name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Data policy
        run: python tools/check_data_policy.py
      - name: Registry
        run: python -m alzres.registry validate
      - name: Generated docs are fresh
        run: python tools/build_docs.py --check
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,progression]"
      - name: Upstream tools against synthetic ground truth
        run: pytest -m integration
