# Graded prevention / slowing / "reversal" claims. Rendered to evidence/README.md by tools/build_docs.py.
# Grades: A = replicated or adequately powered RCTs on a clinical endpoint; A-null = adequately powered
# RCT(s) that found no benefit; B = single RCT, subgroup, biomarker-only, or strong natural experiment;
# C = small, open-label, observational or mechanistic; D = uncontrolled, animal-only or regulator-rejected;
# pending = decisive trial not yet read out.
# verified_by_us: false means the figure was taken from the landscape review, not re-derived by this project.
# Several primary papers were cited from background knowledge by the scouts (see docs/landscape-2026-10/report.md);
# re-check every number against the primary source before publishing it.
claims:
  - id: lecanemab
    claim: Lecanemab slows early symptomatic AD
    grade: A
    effect: -0.45 CDR-SB over 18 months (modest); ARIA-E 32.6% in APOE4 homozygotes
    implication: Slowing, not stopping. APOE-stratified benefit/risk modeling is a grounded goal.
    sources: [https://www.nejm.org/doi/full/10.1056/NEJMoa2212948, https://pmc.ncbi.nlm.nih.gov/articles/PMC12184013/table/tbl0003]
    checked: 2026-10-18
    verified_by_us: false

  - id: donanemab
    claim: Donanemab slows early symptomatic AD
    grade: A
    effect: -0.67 CDR-SB over 18 months (modest); ARIA-E ~24%, ~14% with modified titration
    implication: Safety is improving faster than efficacy.
    sources: [https://pmc.ncbi.nlm.nih.gov/articles/PMC11963282/, https://ukdri.ac.uk/publications/modified-titration-donanemab-reduces-aria-risk-and-maintains-amyloid-reduction]
    checked: 2026-10-18
    verified_by_us: false

  - id: semaglutide-evoke
    claim: Oral semaglutide slows early AD (EVOKE / EVOKE+)
    grade: A-null
    effect: No CDR-SB benefit in 3,808 patients despite biomarker change; EHR studies had suggested 40-70% lower risk
    implication: Observational repurposing signals are hypotheses, not evidence.
    sources: [https://www.alzheimer-europe.org/news/novo-nordisk-announces-topline-results-evoke-and-evoke-trials-semaglutide-early-ad]
    checked: 2026-10-18
    verified_by_us: false

  - id: solanezumab-a4
    claim: Solanezumab prevents decline in preclinical AD (A4)
    grade: A-null
    effect: No slowing over 240 weeks
    implication: Drug prevention in cognitively normal people is unproven.
    sources: [https://www.nejm.org/doi/full/10.1056/NEJMoa2305032]
    checked: 2026-10-18
    verified_by_us: false

  - id: anti-amyloid-prevention-trials
    claim: Anti-amyloid prevention (TRAILBLAZER-ALZ 3, AHEAD 3-45, PrevenTRON)
    grade: pending
    effect: TRAILBLAZER-ALZ 3 screened 63,124 by plasma p-tau217, enrolled 2,196; completion ~Nov 2027
    implication: Decisive prevention data arrive 2027 or later.
    sources: [https://pmc.ncbi.nlm.nih.gov/articles/PMC12439032/]
    checked: 2026-10-18
    verified_by_us: false

  - id: plasma-ptau217
    claim: Plasma p-tau217 detects AD pathology
    grade: A
    effect: FDA clearances May 2025 (Lumipulse) and Aug 2026 (PrecivityAD2)
    implication: Biomarker-trajectory modeling has real clinical relevance (diagnostic, not therapeutic, evidence).
    sources: [https://www.alzdiscovery.org/news-room/announcements]
    checked: 2026-10-18
    verified_by_us: false

  - id: us-pointer
    claim: Structured multidomain lifestyle program improves cognition (US POINTER)
    grade: B
    effect: RCT n=2,111; structured beat self-guided on cognition; modest effect, no dementia endpoint
    implication: Active comparator and funder-announced results; benefit is cognitive, not dementia prevention.
    sources: [https://alz.org/us-pointer/study-results]
    checked: 2026-10-18
    verified_by_us: false

  - id: finger
    claim: FINGER multidomain intervention improves cognition
    grade: B
    effect: Cognitive composite improved
    implication: Consistent with US POINTER.
    sources: ["https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(15)60461-5/fulltext"]
    checked: 2026-10-18
    verified_by_us: false

  - id: shingles-vaccine
    claim: Shingles vaccination lowers dementia diagnoses
    grade: B
    effect: Natural experiment (Wales), >280,000 people; -3.5 percentage points (20% relative) over 7 years
    implication: Strong quasi-causal design, but no RCT and unknown mechanism.
    sources: [https://med.stanford.edu/news/all-news/2025/03/shingles-vaccination-dementia]
    checked: 2026-10-18
    verified_by_us: false

  - id: hearing-aids-achieve
    claim: Hearing intervention slows cognitive decline (ACHIEVE)
    grade: A-null
    effect: Null overall; 48% slowing only in a high-risk subgroup of n=238
    implication: Do not report the subgroup as the headline.
    sources: ["https://sph.unc.edu/?p=407322"]
    checked: 2026-10-18
    verified_by_us: false

  - id: lancet-45-percent
    claim: About 45% of dementia is preventable (Lancet Commission 2024)
    grade: C
    effect: Population-attributable fractions for 14 risk factors, from observational data
    implication: Present as "potentially attributable under causal assumptions", not as trial evidence.
    sources: ["https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(24)01296-0/fulltext"]
    checked: 2026-10-18
    verified_by_us: false

  - id: diranersen
    claim: Tau antisense diranersen (BIIB080) slows decline
    grade: C
    effect: Primary endpoint missed; tau lowered; best cognitive signal at the lowest dose
    implication: Model biomarker-to-clinical translation explicitly.
    sources: [https://investors.biogen.com/news-releases/news-release-details/topline-results-phase-2-celia-study-diranersen-biib080-first]
    checked: 2026-10-18
    verified_by_us: false

  - id: next-gen-antibodies
    claim: Trontinemab / remternetug clear amyloid with less ARIA
    grade: C
    effect: Early-phase biomarker data only (trontinemab 92% amyloid-negative, ARIA-E <5%)
    implication: Phase 3 results come in 2028.
    sources: [https://www.clinicaltrialsarena.com/news/roche-alzheimers-trontinemab-aaic-26/]
    checked: 2026-10-18
    verified_by_us: false

  - id: gamma-40hz
    claim: 40 Hz sensory stimulation slows AD (Cognito HOPE)
    grade: pending
    effect: Company-reported feasibility; Phase 3 (n=670) readout status unconfirmed
    implication: Check NCT05637801 before citing.
    sources: [https://www.cognitotx.com/clinical-studies]
    checked: 2026-10-18
    verified_by_us: false

  - id: focused-ultrasound
    claim: Focused-ultrasound BBB opening enhances amyloid clearance
    grade: C
    effect: n=3; 32% extra regional amyloid clearance
    implication: Proof of concept only.
    sources: [https://www.neurologylive.com/view/combination-ultrasound-blood-brain-barrier-opening-aducanumab-significantly-reduces-amyloid-ad]
    checked: 2026-10-18
    verified_by_us: false

  - id: sildenafil
    claim: Sildenafil lowers AD risk (repurposing)
    grade: C
    effect: Claims data 30-54% lower prevalence; active-comparator Medicare cohort null; no trial
    implication: Make active-comparator designs the minimum standard for repurposing claims.
    sources: [https://academic.oup.com/braincomms/article/6731685]
    checked: 2026-10-18
    verified_by_us: false

  - id: ornish-lifestyle
    claim: Intensive lifestyle change improves early AD (Ornish 2024)
    grade: C
    effect: n~51, 20 weeks, waitlist control, unblinded; mixed results; published critique
    implication: Needs independent replication.
    sources: [https://biomedcentral-alzres.publicaciones.saludcastillayleon.es/counter/pdf/10.1186/s13195-024-01621-6.pdf]
    checked: 2026-10-18
    verified_by_us: false

  - id: valiltramiprosate
    claim: Valiltramiprosate (ALZ-801) benefits APOE4 homozygotes
    grade: C
    effect: Primary endpoint missed; subgroup claims
    implication: Subgroup framing after a missed primary is a red flag.
    sources: [https://alzheon.com/topline-results-from-pivotal-apolloe4-phase-3-trial-of-oral-valiltramiprosate-alz-801-in-patients-with-early-alzheimers-disease-carrying-two-copies-of-apoe4-gene/]
    checked: 2026-10-18
    verified_by_us: false

  - id: lithium
    claim: Lithium (orotate) prevents or reverses AD
    grade: D
    effect: Mouse reversal plus human postmortem association (Nature 2025); no human trial
    implication: Animal-stage evidence; not a treatment claim.
    sources: [https://www.nih.gov/news-events/nih-research-matters/lithium-levels-tied-alzheimers-disease-dementia]
    checked: 2026-10-18
    verified_by_us: false

  - id: blarcamesine
    claim: Blarcamesine slows AD
    grade: D
    effect: EMA CHMP negative opinion, Dec 2025
    implication: Regulator-rejected.
    sources: [https://www.ema.europa.eu/en/news/meeting-highlights-committee-medicinal-products-human-use-chmp-8-11-december-2025]
    checked: 2026-10-18
    verified_by_us: false

  - id: bredesen-recode
    claim: ReCODE protocol reverses AD
    grade: D
    effect: Uncontrolled case series; "84% improved" with no control group
    implication: Do not cite as support. See registry/integrity_watchlist.yaml.
    sources: [https://alzheimer.ca/en/whats-happening/news/bredesen-protocol-offers-false-hope-reversing-alzheimers-disease]
    checked: 2026-10-18
    verified_by_us: false

  - id: simufilam
    claim: Simufilam improves cognition in AD
    grade: A-null
    effect: Two failed Phase 3 trials; SEC settlement over data integrity
    implication: Exclude from evidence bases and knowledge graphs.
    sources: [https://www.fiercebiotech.com/biotech/cassava-stops-alzheimers-program-simufilam-fails-another-phase-3]
    checked: 2026-10-18
    verified_by_us: false
