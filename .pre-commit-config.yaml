# Optional alternative to `git config core.hooksPath .githooks` for pre-commit framework users:
#   pip install pre-commit && pre-commit install
default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: local
    hooks:
      - id: privacy-gate
        name: privacy gate (no identifying information or participant data)
        entry: python tools/check_data_policy.py
        language: system
        pass_filenames: true
        stages: [pre-commit]
      - id: privacy-gate-commit-msg
        name: privacy gate (commit message)
        entry: python tools/check_data_policy.py --commit-msg
        language: system
        stages: [commit-msg]
      - id: privacy-gate-history
        name: privacy gate (full history before push)
        entry: python tools/check_data_policy.py --history
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: build-docs
        name: generated docs up to date
        entry: python tools/build_docs.py --check
        language: system
        pass_filenames: false
        files: ^(registry/|evidence/claims\.yaml)
        stages: [pre-commit]
