repos:
  - repo: local
    hooks:
      - id: data-policy
        name: data policy (no participant data, imaging files or cohort IDs)
        entry: python tools/check_data_policy.py
        language: system
        pass_filenames: true
      - id: build-docs
        name: generated docs up to date
        entry: python tools/build_docs.py --check
        language: system
        pass_filenames: false
        files: ^(registry/|evidence/claims\.yaml)
