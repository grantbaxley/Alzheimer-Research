# Idea catalogue for the nightly research loop (research/nightly/PROGRAM.md).
# Ideas are research hypotheses, not recommendations. Never delete an idea: kill it with a reason.
#
# Fields:
#   id            kebab-case, unique
#   title         one line
#   created       YYYY-MM-DD
#   lens          lens id it came from
#   goal          detect | slow | stop | reverse | understand
#   status        new | investigating | promising | parked | killed | tested
#   mechanism     two sentences
#   novelty       what was found when searching for prior work (trials, reviews)
#   against       strongest evidence against
#   falsify       cheapest test that could kill it
#   evidence      in-silico | preclinical | observational | RCT | none
#   safety        obvious risks, or "none identified"
#   next          next step
#   sources       list of URLs or DOIs
#   history       list of {date, note}
ideas:
  - id: detection-vs-biological-resilience
    title: "Women's verbal-memory reserve is a detection artifact, not extra biological resilience"
    created: 2026-10-19
    lens: resilience
    goal: understand
    status: killed
    mechanism: >-
      Women outperform men on verbal-memory tests at the same level of pathology, which
      is read as cognitive reserve; but per unit of autopsy pathology, pathology is far
      more often clinically expressed as dementia in women than in men. The hypothesis is
      that the verbal-memory advantage delays diagnosis (a measurement effect) while the
      brain is, if anything, under-protected at the synapse for its tau load, so at matched
      tau women should show equal or lower synaptic-integrity markers, not higher.
    novelty: >-
      Sex-specific memory norms and the female verbal advantage are documented (Sundermann
      2016, 2019); the clinical-expression gap is old (Barnes 2005). Framing the advantage as
      a detection artifact to be separated from biological (synaptic) resilience, and
      predicting lower synaptic markers at matched tau in women, is not something the night's
      sources stated directly.
    against: >-
      The female advantage could be genuine functional reserve (richer verbal networks) rather
      than a measurement bias, in which case synaptic markers at matched tau would be equal or
      higher in women, not lower. Off-target tau-PET binding in women inflates apparent tau and
      could confound any matched-tau comparison.
    falsify: >-
      In a cohort with tau-PET (or plasma p-tau217) and a CSF synaptic panel, regress a
      synaptic-integrity marker on tau with a sex term. If women show equal or higher synaptic
      markers at matched tau, the "under-protected synapse" reading is killed.
    evidence: observational
    safety: >-
      None for the hypothesis. If acted on clinically, sex-specific norms risk over-diagnosing
      men or re-diagnosing women; a biomarker study is needed before any norm change.
    next: >-
      Check whether published CSF synaptic-marker studies (YWHAG:NPTX2, NPTX2, NRN1, VGF)
      report sex-stratified marker-vs-tau slopes; list cohorts that could test it.
    sources:
      - "10.1212/wnl.0000000000003288"
      - "10.1212/wnl.0000000000008467"
      - "10.1001/archpsyc.62.6.685"
      - "10.1038/s41591-025-03565-2"
    history:
      - date: 2026-10-19
        note: "Created under resilience lens, women constraint. Unifies the reserve-vs-vulnerability contradiction both research scans flagged."
      - date: 2026-10-21
        note: >-
          Killed on red-team night. Both halves fail. The pure detection-artifact framing is
          refuted by its own cornerstone datum (equal hippocampal atrophy, better female verbal
          memory, Sundermann 2016 PMID 27029635), which is at least as consistent with genuine
          reserve and is read that way by the group that found it (PMID 39951912). The
          "under-protected at the synapse" half is contradicted by the largest CSF synaptic study
          (Oh 2025 Nat Med, n=3,397, PMID 40164724): the synapse-to-cognition axis shows no sex
          interaction, so women do not show lower synaptic markers at matched pathology. Surviving
          kernel, kept as a separate observation not this idea: women decline faster per unit tau
          once symptomatic (PMID 37641484, PMID 41540505) - cognitive vulnerability, not synaptic
          under-protection. Genuine gap remains: no study reports sex-stratified
          synaptic-marker-vs-tau slopes.

  - id: synaptic-reversal-endpoint
    title: "A sex-normed synaptic-integrity fluid panel as a reversal (not just slowing) endpoint"
    created: 2026-10-19
    lens: resilience
    goal: reverse
    status: parked
    mechanism: >-
      Across autopsy and single-cell cohorts, preserved synapses and neurons track preserved
      cognition better than plaque or tangle load, and synaptic proteins (NPTX2, NRN1, VGF,
      the YWHAG:NPTX2 ratio) are the strongest fluid correlates of cognition beyond amyloid and
      tau. If synaptic loss is partly reversible, a rise in these markers over time could be an
      early, objective signal of restored function, read against sex-specific norms because the
      female verbal advantage masks decline.
    novelty: >-
      These markers are established as cross-sectional correlates and decline predictors (Nat Med
      2025; Ann Neurol 2023). Using an upward change as a reversal readout, and pairing it with
      sex-specific norms, was not stated in the sources; most work treats them as decline markers.
    against: >-
      The markers may be downstream readouts that never rise with any current intervention, or
      rise without cognitive benefit; measurement noise could swamp small upward changes. No
      intervention has yet been shown to raise them.
    falsify: >-
      In any interventional cohort with serial CSF or plasma synaptic markers, test whether a
      marker ever rises above its own measurement error and whether a rise precedes cognitive
      improvement. If markers only ever fall or plateau, the reversal-endpoint claim is killed.
    evidence: observational
    safety: "None; this is a biomarker/endpoint proposal, not a treatment."
    next: >-
      Reframe to marker-specific directions, then re-assay the full panel in banked samples from
      a positive anti-amyloid trial (or sabirnetug ALTITUDE-AD, NCT06335173) to see whether the
      protective markers rise, plus a 2-6 week repeatability substudy to fix the minimal
      detectable change.
    sources:
      - "10.1038/s41591-025-03565-2"
      - "10.1002/ana.26725"
      - "10.1016/j.mcpro.2023.100542"
      - "10.1001/jamaneurol.2024.0991"
      - "10.1016/j.tjpad.2025.100082"
      - "10.1186/s13024-024-00755-3"
    history:
      - date: 2026-10-19
        note: "Created under resilience lens, women constraint."
      - date: 2026-10-21
        note: >-
          Parked on red-team night: not killed, but wrong as written. The panel is directionally
          incoherent for an "up = good" readout - neurogranin, YWHAG and VAMP2 RISE with damage
          while NPTX2, NRN1 and VGF fall, and the YWHAG:NPTX2 ratio rises with both decline and
          normal aging (PMID 39380095, PMID 40164724). In the only interventional CSF data,
          anti-amyloid therapy moved damage markers DOWN (gantenerumab lowered neurogranin,
          DIAN-TU, PMID 38683602; sabirnetug lowered neurogranin and VAMP2, PMID 39955261); no
          human trial has driven the protective markers UP (only a preclinical mouse Nptx2 boost).
          Markers are also non-specific (Lewy-body disease, acute injury) with no established
          test-retest reliability for this use. A reframed, marker-specific version survives; the
          simple upswing endpoint does not.

  - id: sex-amyloid-tau-window
    title: "Use each person's amyloid-to-tau interval, not age, to time an anti-seeding therapy"
    created: 2026-10-19
    lens: resilience
    goal: detect
    status: investigating
    mechanism: >-
      The resilience variants that most clearly protect (APOE3-Christchurch, PLCG2 P522R) act by
      suppressing amyloid-induced tau seeding and spread via microglia, so the leverage point is
      the amyloid-to-tau coupling step. Women traverse that step faster (shorter amyloid-to-tau
      interval, faster tau accumulation when amyloid-positive), so the hypothesis is that the
      useful window for an anti-seeding drug is set by time since amyloid onset and runs out
      sooner in women, arguing for enrichment and timing by a personal amyloid clock rather than
      by chronological age.
    novelty: >-
      The amyloid-to-tau interval is described (J Prev Alzheimers Dis 2026) and faster female tau
      is well supported (JAMA Neurol 2025). Using the interval as a sex-aware enrichment clock
      for an anti-seeding therapy, rather than age or amyloid status alone, was not stated in the
      sources.
    against: >-
      Tonight's toy FKPP model did not reproduce the naive "faster growth = narrower window"
      intuition: raising the local tau-growth rate pulled both first-detection and widespread tau
      earlier together, rather than shrinking the gap between them, so "faster" may mean "earlier
      and still detectable", not "no window". The clinical interval also needs two scans, which is
      costly and may be a surrogate for amyloid burden rather than an independent clock.
    falsify: >-
      In a cohort with serial amyloid and tau PET, test whether time since amyloid positivity
      predicts tau accumulation rate better than chronological age, and whether a sex term adds
      anything once the interval is in the model. If sex adds nothing beyond the interval, the
      "sex-specific window" part is killed.
    evidence: observational
    safety: >-
      None for the analysis. Any resulting trial-timing rule would need prospective validation
      before use.
    next: >-
      Re-anchored clock: use time-since-amyloid-positivity (amyloid chronicity, SILA-estimated),
      not chronological age or a two-scan tau interval, since sex acts on the amyloid->tau
      conversion step, not amyloid rate. In ADNI/BioFINDER/WRAP, test whether amyloid chronicity
      predicts tau-accumulation rate and decline after removing amyloid burden and age, and whether
      a sex term adds. Add a cheap tracer-free leading edge: baseline LC neuromelanin-MRI
      (Abeta-conditional, age-normed for its non-monotonic lifespan curve) as a second clock
      variable, and test whether (LC contrast + amyloid chronicity) beats age + chronicity alone.
      The full peer-reviewed version of this analysis does not yet exist (ingredients are all
      positive), so it is an open, largely-scaffolded test, not a new data ask.
    sources:
      - "10.1001/jamaneurol.2025.0013"
      - "10.1016/j.tjpad.2026.100622"
      - "10.1016/j.cell.2023.11.029"
      - "10.1007/s00401-020-02138-6"
      - "10.1002/alz.71064"
      - "10.1007/s00259-026-07934-y"
    history:
      - date: 2026-10-19
        note: "Created under resilience lens, women constraint. Toy FKPP run (scripts/window_2026_10_19.py) complicated the premise; recorded as evidence against, idea kept for the cohort test."
      - date: 2026-10-21
        note: >-
          Advanced to investigating on red-team night. One objection fell, one got sharper. The
          off-target tau-PET worry (that female tau excess is a meningeal/vascular artifact) is
          largely defeated by an off-target-immune fluid tau marker tracking tau-PET with no sex
          interaction (MTBR-tau243, Robinson 2026, PMID 42191949), so the "faster female tau"
          premise stands. But the real kill is that the amyloid-to-tau interval is confounded with
          age at amyloid onset and amyloid burden, and adds little after tau positivity (PMID
          42309020); a reframing (PMID 41485137) describes it better as an amyloid-level x age x
          sex threshold. So "time by interval, not age" largely collapses into "amyloid burden +
          age", which existing enrichment already approximates. The cheapest decisive test is now
          in `next`.
      - date: 2026-10-24
        note: >-
          Trial-design night adds a sobering constraint on the sex half. AD trials are essentially
          never powered for a sex-by-treatment interaction (detecting one needs ~4x the sample of a
          main effect), and the existing sex subgroups point in opposite directions across drugs
          (male-favoring for lecanemab/aducanumab, female-favoring for donanemab; Lim 2025, PMID
          41551731) - a pattern consistent with underpowered noise, not a real sex effect on
          response. So the testable value of this idea sits in the interval-enrichment half, not
          the sex half: run the interval test first (see `next`), and treat sex as a hierarchical
          sub-analysis borrowing strength across a platform rather than a standalone powering
          demand. Status stays investigating.
      - date: 2026-11-08
        note: >-
          Repurposing / LC "why there" revisit. Status stays investigating; sharpened and one
          mechanism demoted. (1) Re-anchor the clock as amyloid chronicity (time-since-Abeta+), not
          age or the two-scan interval, because the robust human sex effect is on the amyloid->tau
          COUPLING step, not amyloid accumulation rate (Coughlan 2025 meta, PMID 40029638: female
          excess is Abeta+-conditional; Wang Brain 2024 locates the sex term at the coupling step) -
          i.e. the sex term and the leverage point are the SAME node. (2) Add LC neuromelanin-MRI as
          a cheaper, earlier, tracer-free leading edge (LC integrity decline precedes MTL tau,
          Bueicheku/Jacobs, Nat Aging 2024, PMID 38664576), kept Abeta-conditional and age-normed
          (non-monotonic LC lifespan curve) and NOT over-claimed for sex content (human LC
          dimorphism is 'minor', Galgani 2025). (3) DEMOTE the X-linked MAO-A sub-hypothesis to a
          clearly-tagged mechanism-to-test: human MAO-A shows dosage compensation (not a clean
          double-dose effect) and the estrogen link is contradictory (MAO-A VT peaks in
          perimenopause, not with estrogen loss; Rekkas). Breadcrumb: the LC-seeding genes (MAOA,
          LGMN/AEP, DBH, ADRA2A) are mechanistically hot but genetically COLD for AD (no GWAS
          nomination), which argues this idea is about TIMING, not etiology. Modelled the 'why there'
          decomposition in scripts/lc_why_there_2026_11_08.py."

  - id: fsh-blockade-women
    title: "Blocking follicle-stimulating hormone to slow post-menopausal Alzheimer's"
    created: 2026-10-19
    lens: resilience
    goal: slow
    status: parked
    mechanism: >-
      In mice, FSH acts on hippocampal and cortical neurons to accelerate amyloid and tau
      deposition through a C/EBP-beta / delta-secretase pathway, and blocking FSH reportedly
      abrogates the phenotype. FSH rises sharply at menopause, so FSH blockade is proposed as a
      female-specific way to slow the disease.
    novelty: >-
      Not novel as a target: a humanized FSH-blocking antibody (MS-Hu6) is described as
      IND-enabling. Logged to record the skeptical assessment, not to claim the idea.
    against: >-
      All the mechanistic and therapeutic FSH work traced tonight comes from a single
      collaborating group with no independent replication found. Human data are small,
      cross-sectional and contradictory (one cohort found higher FSH associated with worse
      cognition, another found higher FSH associated with better cognition in cognitively normal
      women). Hormone therapy, which lowers FSH, does not prevent dementia in RCTs.
    falsify: >-
      An independent lab repeating the mouse FSH to delta-secretase result, or a human study that
      separates FSH from estradiol (for example GnRH-agonist users), showing no FSH effect once
      estradiol is accounted for, would sink it.
    evidence: preclinical
    safety: >-
      FSH blockade would perturb reproductive endocrinology; bone and metabolic effects are
      plausible. Not a candidate for anything but carefully controlled study.
    next: "Watch for independent replication; do not pursue without it."
    history:
      - date: 2026-10-19
        note: "Logged as parked: single-group preclinical program, contradictory human data, HT (which lowers FSH) null in RCTs."

  - id: clearance-threshold-onset
    title: "Model onset as a clearance-capacity tipping point, not a seeding event - and test for hysteresis"
    created: 2026-10-21
    lens: red-team
    goal: understand
    status: parked
    mechanism: >-
      Perivascular and blood-brain-barrier routes continuously clear amyloid and tau, and
      clearance (not overproduction) is impaired in sporadic disease. Model the brain as
      normally holding small seeds below a threshold set by clearance capacity: when vascular
      aging drops clearance below the local aggregation rate the same pre-existing seed takes
      off, and because the system is bistable, restoring clearance after onset may not pull it
      back - predicting that late clearance-restoring therapy fails even when early would have
      worked.
    novelty: >-
      The clearance-deficit view of sporadic disease is established (Mawuenyega 2010) and CAA is
      framed as clearance failure (Greenberg 2020). The specific, testable additions are the
      bistability/hysteresis framing - a tipping point with a no-return region - and tonight's
      toy model (scripts/clearance_2026_10_21.py) showing a sharp clearance threshold at fixed
      seed. A search did not find this cast as a hysteresis prediction for therapy timing.
    against: >-
      Tonight's model only shows that adding a linear clearance term gives a threshold near
      clearance = growth rate, which is close to tautological, not evidence about the brain.
      Autosomal-dominant disease is driven by amyloid overproduction, so seeding clearly matters
      independently of clearance; and clearance proxies (CSF sPDGFR-beta, DCE-MRI leakage) are
      single-cohort and may be confounded by age and small-vessel disease rather than measuring a
      causal clock.
    falsify: >-
      In a serial-PET cohort, test whether a baseline clearance proxy (sPDGFR-beta or DCE-MRI
      Ktrans) predicts tau take-off independent of baseline amyloid burden and age. For the
      hysteresis claim, test in a model system whether restoring clearance after aggregation is
      established reverses burden or only slows it. If clearance adds nothing beyond amyloid
      burden, or if restoration reverses burden freely, the tipping-point framing is wrong.
    evidence: in-silico
    safety: "None; this is a modeling and analysis hypothesis."
    next: >-
      The hysteresis half is answered (no, in this model family). Next, test the tipping-point
      half on data: in a serial-PET cohort, does a clearance proxy (sPDGFR-beta or DCE-MRI
      leakage) predict tau take-off independent of amyloid burden and age? Separately, note that
      irreversibility likely sits in neuron loss, not clearance dynamics.
    sources:
      - "10.1126/science.1197623"
      - "10.1038/s41582-019-0281-2"
      - "10.1038/s41586-020-2247-3"
      - "10.1523/jneurosci.16-14-04491.1996"
    history:
      - date: 2026-10-21
        note: "Created on red-team night under the blood-vessel/BBB constraint, seeded by the clearance-threshold toy model."
      - date: 2026-10-22
        note: >-
          Hysteresis corollary falsified in-silico. scripts/hysteresis_2026_10_22.py ran the
          clearance model two ways - fixed clearance, and clearance impaired by pathology (a
          positive-feedback failure loop) - and NEITHER showed hysteresis: restoring clearance
          collapsed burden back to the never-ill baseline both times. Reason: the logistic growth
          term is zero at saturation, so any positive clearance drains the high state; this model
          family is reversible by construction. Implication for the inversion lens: the
          irreversibility of real disease cannot come from clearance/aggregation dynamics here -
          it must come from loss of substrate (neuron death), which the model does not represent
          and which the reversibility scan puts at ~60% entorhinal layer-II loss by very-mild
          dementia (Gomez-Isla 1996, PMID 8699259). The tipping-point (onset) half of the idea is
          untouched by this and still needs the cohort test in `next`; the "no way back" half is
          reattributed from clearance bistability to neuron loss.
      - date: 2026-10-28
        note: >-
          Two advances on the combination-timing / sleep night. (1) Timing of clearance matters,
          not just its average: scripts/intermittent_clearance_2026_10_28.py shows that at an equal
          daily-average clearance, delivering it in a short window with long low-clearance gaps
          (sleep-like) leaves more burden near the threshold than constant clearance, because the
          gaps let the seed regrow - a nonlinear-averaging (Jensen) effect of the concave growth
          term. So the model says regularity/consolidation of the clearance window could matter,
          not just total clearance. (2) The physiological analog is shakier than the model's clean
          term suggests: sleep is the proposed clearance mechanism, but the glymphatic bulk-flow
          account is contested (Smith/Verkman vs Nedergaard/Mestre), Mendelian randomization is
          largely null for sleep traits causing AD (Anderson 2021, PMID 33150399), and the best
          controlled sleep-improvement trials (CPAP/APPLES, CBT-I/Siengsukon 2026 PMID 42298279)
          are null on cognition and amyloid. Only the worsening direction (acute deprivation) and an
          acute suvorexant biomarker drop are randomized. So: keep the model as an abstraction, but
          do not read it as "improve sleep clearance to slow AD" - that causal claim is unproven.
      - date: 2026-11-17
        note: >-
          Modeling-lens revisit - PARKED; the hysteresis sub-claim is now contradicted by human data
          as well as by our own model (2026-10-22). After antibody treatment clears plaque and dosing
          stops, amyloid neither stays low nor jumps back: it re-grows at roughly 2.4-3.4 Centiloids
          per year, about the natural early rate (donanemab: sponsor modelling 2.8 CL/yr and
          conference reports of ~2.4; a 46-person florbetapir abstract ~3.4, 10.1002/alz.078175;
          modelled 3.9 years to re-cross the treatment threshold, JAMA Neurol post hoc). That is the
          behaviour of a single-state system with a persistent production-clearance imbalance and
          burden-dependent growth - clearance resets the clock, it does not restore a healthy stable
          state. Isotope-labelling studies agree on a gradual shift: clearance about 30% slower in
          Alzheimer's with normal production (PMID 21148344) and amyloid turnover slowing steadily
          with age (half-life 3.8 h at 30 to 9.4 h at 80; PMID 26040676), with overlapping groups and
          no threshold. The rates are sponsor-modelled or from abstracts, so treat the exact numbers
          with caution. One test could revive a capacity-threshold reading: a person's
          re-accumulation slope being SLOWER than their own pre-treatment slope at the same amyloid
          level (see reaccumulation-slope-readout).

  - id: vascular-reserve-aria-dosing
    title: "Stratify anti-amyloid dose by a pre-treatment vascular-integrity readout to widen the ARIA-limited window"
    created: 2026-10-21
    lens: red-team
    goal: slow
    status: investigating
    mechanism: >-
      The dominant neurovascular event in the clinic is iatrogenic ARIA, driven by cerebral
      amyloid angiopathy and vessel-wall fragility as anti-amyloid antibodies clear vascular
      amyloid. If a pre-treatment vascular-integrity readout (microbleed/CAA burden on MRI plus a
      BBB/pericyte-injury marker such as CSF sPDGFR-beta) predicts individual ARIA risk beyond
      APOE4 and microbleed count, dose and titration could be personalised, turning the
      neurovascular unit from an uncontrolled liability into a dosing variable and letting
      lower-risk patients clear amyloid faster.
    novelty: >-
      APOE4 genotype and baseline microbleeds already gate eligibility and dosing. Adding a
      dynamic BBB-integrity biomarker to personalise dose/titration, rather than just exclude, is
      less established; no trial found that tests sPDGFR-beta-guided dosing.
    against: >-
      CSF sPDGFR-beta is validated mainly in one cohort and may not be specific to cerebrovascular
      injury; ARIA prediction from APOE4 plus microbleed count may already capture most of the
      signal, leaving little to add. Collecting CSF to decide dosing adds cost and invasiveness.
    falsify: >-
      In banked baseline samples and MRI from a positive anti-amyloid trial, test whether baseline
      sPDGFR-beta (or a small vascular panel) predicts ARIA-E after adjusting for APOE4 and
      microbleed count. If it adds no discrimination, the idea is dead without any new trial.
    evidence: observational
    safety: >-
      Aimed at reducing iatrogenic harm, but a mis-set rule could under-treat someone who would
      have benefited, or expose a mis-classified patient to ARIA. Any dosing rule needs
      prospective validation before use.
    next: "Re-scoped as a DISCRIMINATION question, not a dosing scheme: in any public ARIA risk dataset, quantify the incremental AUC of adding a fluid vascular marker to {APOE4 allele count + microbleed count + superficial siderosis + amyloid load + MAP}. Pre-register the kill: delta-AUC < 0.02 -> biomarker-gated dosing is dead and cheap static microbleed-count-gated titration wins."
    sources:
      - "10.1001/jamaneurol.2025.0065"
      - "10.1038/s41586-020-2247-3"
      - "10.1038/s41582-019-0281-2"
      - "10.1002/alz.70062"
    history:
      - date: 2026-10-21
        note: "Created on red-team night under the blood-vessel/BBB constraint, from the observation that ARIA makes the neurovascular unit clinically central as a toxicity site."
      - date: 2026-10-25
        note: >-
          Contextual advance (not a dedicated ARIA-biomarker search tonight). The prevention/myelin
          scan reinforces that white-matter-hyperintensity (WMH) / small-vessel burden is both
          measurable and modifiable - intensive blood-pressure control slowed WMH growth in the
          SPRINT MIND MRI substudy (Nasrallah 2019, PMID 31408137) - so baseline WMH burden is a
          natural third component of the pre-treatment vascular-integrity readout alongside
          microbleeds and CSF sPDGFR-beta. Still status new: the decisive test (does any vascular
          marker predict ARIA beyond APOE4 + microbleed count in banked trial data?) has not been
          run. Flagged for a dedicated ARIA-biomarker literature pull.
      - date: 2026-11-11
        note: >-
          Combination-timing / engineer revisit - DOWNGRADE and RE-SCOPE (status new ->
          investigating). The biomarker-gated-DOSING form is weakened on three fronts. (1) The
          controller that already works is open-loop slow TITRATION: TRAILBLAZER-ALZ6 (NCT05738486,
          Alz & Dementia 2025, 10.1002/alz.70062) cut donanemab ARIA-E 24% -> ~14% at equal cumulative
          exposure and equal amyloid + p-tau217 lowering, and FDA approved the gentler titration label
          - so the safe clearance RATE is set by dose schedule, needing NO per-patient vascular readout.
          (2) sPDGFR-beta faces a compartment-mismatch objection (it reflects deep capillary pericyte
          injury, while ARIA is driven by leptomeningeal/cortical CAA that microbleeds/siderosis already
          image), is collinear with APOE4, and is single-lab (Zlokovic, under scrutiny); the actual
          CSF-vs-ARIA proteome study nominated CHIT1/DDAH1 (innate immunity), not a pericyte marker
          (Oosthoek 2025, 10.1186/s13195-025-01799-3). (3) The only in-vivo ARIA feedback signal is the
          microbleed itself - a lagging failure, so a closed-loop controller would detect the crash, not
          prevent it; the feed-forward setpoint already exists cheaply as baseline microbleed count. So
          re-scoped as a DISCRIMINATION question with a pre-registered kill (delta-AUC < 0.02). The
          current ARIA risk model (Zimmer 2025, 10.1001/jamaneurol.2025.0065) uses 6 imaging/genetic/
          hemodynamic predictors and no fluid marker, and reports no headline AUC - group stratification
          is good, individual discrimination poor. Modelled the rate-vs-dose control logic in
          scripts/aria_titration_control_2026_11_11.py."

  - id: fn1-clearance-restore
    title: "Lower excess blood-brain-barrier fibronectin to phenocopy the FN1 resilience variant in APOE4 carriers"
    created: 2026-10-21
    lens: red-team
    goal: slow
    status: investigating
    mechanism: >-
      A rare loss-of-function FN1 variant (rs140926439) is strongly protective in APOE4
      homozygotes, apparently because less fibronectin accumulates at the blood-brain barrier,
      so toxic-protein clearance and gliovascular remodeling are preserved. Reducing
      astrocyte-derived or vascular fibronectin assembly at the barrier might phenocopy that
      protection and restore clearance in APOE4 carriers who did not inherit the variant.
    novelty: >-
      FN1 as an Alzheimer's resilience target is recent (2024-2026) with an independent-cohort
      replication and a mechanistic follow-up; no drug programme targeting barrier fibronectin for
      this purpose was found. The specific twist is testing reduction AFTER pathology is
      established, i.e. as a restorative rather than preventive move.
    against: >-
      The protective odds come from case-control genetics on a rare variant with a wide
      confidence interval, not from intervention. Fibronectin is essential for vascular integrity,
      wound healing and haemostasis, so lowering it is likely dangerous systemically, and the
      zebrafish loss-of-function benefit may be developmental and not reproducible by lowering
      fibronectin in an adult brain.
    falsify: >-
      In an APOE4 blood-brain-barrier model with established fibronectin accumulation, lower
      fibronectin assembly and test whether clearance recovers and gliosis falls (restoration),
      not merely whether co-suppression from the start prevents it. No restoration effect kills
      the restorative version.
    evidence: preclinical
    safety: >-
      Fibronectin is systemically essential (clotting, wound healing, vascular integrity); any
      approach would need brain-vascular-local targeting and careful bleeding/fibrosis monitoring.
    next: >-
      The question is now specific and preclinical: run the staged "establish-then-treat" experiment
      - lower fibronectin (genetically or with pUR4/FUD) in aged APOE4-knock-in mice that already
      have established deposition - and see whether established leak/deposition REVERSES. Until that
      is done, treat FN1 as a prevention lead only (see idea fn1-staged-reversal-test).
    sources:
      - "10.1007/s00401-024-02721-1"
      - "10.1038/s43587-026-01204-0"
      - "10.1097/WAD.0000000000000692"
    history:
      - date: 2026-10-21
        note: "Created on red-team night under the blood-vessel/BBB constraint, from the FN1 vascular-resilience signal."
      - date: 2026-11-01
        note: >-
          The restoration-vs-prevention question is answered: PREVENTION. A full-text read of the
          Nat Aging 2026 paper (PMID 42728404, open access PMC13577929) shows every FN1-lowering
          manipulation was co-suppression or constitutive, never applied to established pathology:
          the genetic tool is a constitutive fn1b knockout that blocks the rise of fibronectin after
          Abeta42 exposure; the pharmacologic tools (camptothecin, Torin2, the FAK inhibitor
          PF-573228, the integrin blocker ATN-161) were given concurrently in an acute 1-day adult
          zebrafish model; and the aged APOE4-knock-in mice (the only model with chronic established
          pathology) were used descriptively, with NO FN1-lowering intervention. So "rescue/restore"
          in the paper means a concurrently-induced acute phenotype, not reversal of established
          deposition. Consequence: this idea's distinctive claim (lowering FN1 AFTER pathology
          reverses it) is UNTESTED, and FN1 is currently a prevention/co-suppression lead, not a
          reversal lead. The decisive experiment is spun out as idea fn1-staged-reversal-test. No
          cheap approved FN-lowering CNS drug exists (pUR4/FUD and ATN-161 are preclinical;
          pirfenidone's brain exposure is unproven; nintedanib barely crosses the barrier)."
      - date: 2026-10-23
        note: >-
          Advanced on repurposing night. Both source papers reconfirmed (Bhattarai 2024 Acta
          Neuropathol, PMID 38598053; Bhattarai 2026 Nat Aging, PMID 42728404). The 2026 abstract
          says reducing fibronectin "rescues" BBB function in vitro and in vivo - suggestive of
          restoration - but does not state whether FN1 was lowered after pathology was established
          or co-suppressed from baseline; full text is paywalled, so the restoration-vs-prevention
          question (the crux for this idea's reversal goal) is still open. No cheap approved
          brain-penetrant FN1-lowering drug exists: pirfenidone is antifibrotic but not CNS-targeted
          and likely fails the cost gate; the FUD/pUR4 fibronectin-assembly inhibitor is
          experimental, not approved; losartan and metformin lower peripheral fibronectin cheaply
          but there is no evidence they reach the perivascular brain compartment (speculative).
          So: genetically anchored and mechanistically fresh, but neither clearly reversal-capable
          nor cheaply druggable yet.

  - id: identify-autocatalysis-rate
    title: "Test whether tau's growth term is actually positive in humans, or just connectivity-patterned transport"
    created: 2026-10-22
    lens: inversion
    goal: understand
    status: tested
    mechanism: >-
      Network-spreading models (including this repo's FKPP) assume tau grows autocatalytically via
      a logistic term alpha*x*(1-x), but "autocatalytic" is an assumption, not a measured human
      rate, and a good spatial fit (high Pearson r to a regional tau map) does not prove the
      spreading mechanism - regional vulnerability can produce the same pattern. The idea is to fit
      the growth parameter region-wise to longitudinal human tau-PET and test whether it is
      genuinely greater than zero (true self-amplification) or near zero (pattern set by transport
      plus intrinsic vulnerability), because if there is no real self-amplification the whole
      rationale for anti-seeding therapy weakens.
    novelty: >-
      Diffusion models are fit to human tau (Vogel 2020, Raj 2012) and growth+diffusion models
      exist (Schafer/Kuhl 2021), but explicitly testing whether the growth term is identifiable
      and positive region-wise, against a regional-vulnerability confound, is the open question the
      feedback-loop scan surfaced (Xiao et al. preprint: network dynamics set tau presence,
      vulnerability sets load).
    against: >-
      Identifiability: with only a few PET timepoints the growth rate and a static vulnerability
      map may be statistically confounded, so the fit could be unable to separate them even in
      principle. The repo's own synthetic tests show the tooling runs; they say nothing about
      whether a real growth rate is recoverable.
    falsify: >-
      First on synthetic data with a known growth rate: does the fit recover it, or does a
      vulnerability-only model fit equally well? If the two are not separable in silico, the
      question cannot be answered from the available human data and the idea is parked; if they
      are separable, apply it to a public longitudinal tau-PET summary.
    evidence: in-silico
    safety: "None; modeling and inference only. Also a useful honesty check on the repo's own FKPP results."
    next: >-
      Harder test still needed: distinguish growth from a STATIC regional-vulnerability map (not
      just pure diffusion), add realistic noise and unknown seed location, and only then apply to a
      public longitudinal tau-PET summary.
    sources:
      - "10.1038/s41467-020-15701-2"
      - "10.1016/j.neuron.2011.12.040"
      - "10.3389/fphys.2021.702975"
    history:
      - date: 2026-10-22
        note: "Created on inversion night under the engineering constraint, from the feedback-loop scan's point that autocatalysis is assumed, not measured, and good fit does not prove mechanism."
      - date: 2026-10-29
        note: >-
          Ran the synthetic identifiability test (scripts/identifiability_2026_10_29.py) and advanced
          to investigating. First attempt used a NULL with no network term at all - a strawman the
          growth model trivially beat, which told us nothing; corrected to a nested, network-aware
          test (FKPP with free growth vs the same model with growth off = pure diffusion). Honest
          methodological lesson in its own right: a weak null fakes identifiability (echoes the
          "good fit does not prove mechanism" caution). On the corrected test, when the ground truth
          genuinely has strong autocatalytic growth (alpha=1.2, light noise, known seed), the growth
          term IS recoverable even from 3 scans - alpha_hat recovered exactly, fit ~15-20x better
          than pure diffusion. So the method is sound in principle and worth applying to real serial
          tau-PET. Two caveats keep it at investigating, not promising: (1) the harder real-world
          confound is growth vs a STATIC regional-vulnerability map (Xiao et al.), which this test
          does not cover - only growth vs pure diffusion; (2) real data add noise, unknown seed, and
          model misspecification. Those are the new `next`. Tonight this idea also became a component
          of the fused idea nonprogressor-rate-plus-synapse (personal tau rate as an early signal)."
      - date: 2026-11-20
        note: "Revisited on the reversal-biology night: TESTED, by others and by perturbation. A network growth model with regional capacities, fitted to people with three or more scans in two cohorts, finds net local growth of about 0.11-0.13 per year once amyloid and tau are both present and transport-dominated spread before that (10.1371/journal.pbio.3003241, abstract checked; rates as reported from the full text) - close to the earlier 0.14 per year (10.1126/sciadv.abh1448). The caveat this idea raised stands: with regional capacities fixed in advance, self-amplification and static vulnerability are confounded by design. Perturbation gives the practical answer instead: antibodies against tau outside cells mostly did not slow scans or decline, while lowering tau production by about half made scan signal fall below baseline (10.1001/jamaneurol.2023.3861, abstract checked). Our model (scripts/tau_knockdown_ladder_2026_11_20.py) shows a dose ladder locates the halting dose in either world but cannot prove self-amplification, and even re-growth after stopping differs only modestly. So net growth is positive; whether it is true self-amplification cannot be settled with available data and matters less than the halting dose. Continued as tau-halting-dose-ladder."

  - id: reserve-as-redundancy-threshold
    title: "Operationalise cognitive reserve as a measured network-redundancy quantity that predicts a tipping point"
    created: 2026-10-22
    lens: inversion
    goal: detect
    status: investigating
    mechanism: >-
      Cognitive reserve is invoked as redundancy - spare circuits that keep function as nodes fail
      - but it is usually measured by proxies (education) rather than a redundancy quantity, and no
      one has tied a measured redundancy to a predicted resilience threshold. The idea is to define
      a concrete graph-redundancy or degeneracy metric on an individual's connectome (independent
      path count, or spectral robustness to node removal) and test whether it predicts the tau
      burden at which that person's cognition falls - a personal failure threshold.
    novelty: >-
      Reserve-as-redundancy and graph-resilience are active but conceptual or cross-sectional; the
      feedback-loop scan found no source closing the loop from a measured redundancy quantity to a
      predicted threshold (Nawani 2025 calls for exactly this). The specific, falsifiable metric
      -> threshold link is the gap.
    against: >-
      Education and brain volume already predict cognition-at-matched-pathology, so a redundancy
      metric may add nothing; cross-sectional connectomes confound cause and consequence; and
      "degeneracy" (different structures, same function) is hard to measure and easy to assert.
    falsify: >-
      Does a connectome-redundancy metric predict cognition at matched tau beyond education and
      brain volume? If it adds no variance in a cohort with connectomes, tau-PET and cognition, the
      idea is dead. Prototype the metric on synthetic connectomes first to check it behaves.
    evidence: observational
    safety: "None; analysis only."
    next: >-
      Needs data: does algebraic connectivity (or a better efficiency-based robustness measure)
      predict cognition at matched tau in a real connectome cohort, beyond education and brain
      volume? Also replace the failed edge-weight knockout measure with a global-efficiency
      (shortest-path) one.
    sources:
      - "10.1002/brb3.70903"
      - "10.1016/j.neuron.2011.12.040"
      - "10.1016/j.ynirp.2025.100255"
    history:
      - date: 2026-10-22
        note: "Created on inversion night under the engineering (redundancy) constraint, from the gap the feedback-loop scan named."
      - date: 2026-10-30
        note: >-
          Prototyped the metric on the repo's synthetic connectome (scripts/redundancy_metric_2026_10_30.py)
          and advanced to investigating - with a partial result. Algebraic connectivity (the Fiedler
          value) WORKS as a reserve proxy: it cleanly separated a redundant many-long-range-edge graph
          (1.145) from a sparse one (0.231) and fell monotonically as nodes were lesioned (1.145 ->
          0.471 over 24 removed). But the second measure I tried - knockout robustness defined as
          retained giant-component edge weight - did NOT discriminate (0.636 vs 0.638), because it is
          dominated by the dense local backbone both graphs share; it needs a global-efficiency
          (shortest-path) definition instead. So the method check half-passes: one usable metric, one
          to fix. Independent human support that redundancy is amyloid-sensitive (cross-sectional):
          Blujus 2025, posterior-hippocampal redundancy reduced by amyloid (doi:10.1016/j.ynirp.2025.100255).
          The matched-pathology predictive test still needs a real cohort (the `next`)."

  - id: restore-before-the-floor
    title: "Gate reversal trials on preserved neuronal substrate and read out a plastic compartment"
    created: 2026-10-22
    lens: inversion
    goal: reverse
    status: investigating
    mechanism: >-
      Reversal is only possible in compartments that are still plastic (synapses, myelin,
      perfusion, inflammation); once neurons are dead they are not replaced, and ~60% of entorhinal
      layer-II neurons are already gone by very-mild dementia. So a reversal trial should enrol only
      people whose neuronal/synaptic substrate is still largely intact - gated by preserved synaptic
      density (SV2A-PET) or entorhinal volume - and measure a plastic-compartment readout that can
      actually move upward, rather than chasing reversal in brains past the irreversible floor.
    novelty: >-
      Trials enrich by amyloid level and tau stage, not by a synaptic-substrate floor, and no
      reversal trial uses SV2A-PET as a substrate gate plus improvement readout. The twist is
      designing for the window where reversal is biologically possible instead of testing it where
      it cannot occur.
    against: >-
      No intervention has yet raised SV2A-PET or any synaptic marker in humans, and no longitudinal
      recovery study exists, so the readout is unproven; a strict substrate gate might exclude most
      symptomatic patients, shrinking the trial population to near-preclinical where change is
      slow and hard to detect.
    falsify: >-
      Is there any cohort where SV2A-PET (or another plastic-compartment readout) rose after an
      intervention? If synaptic density is never observed to increase in humans, the reversal
      endpoint is unusable and the design cannot work; that single question settles it cheaply.
    evidence: observational
    safety: >-
      None for the design itself; any trial would carry its intervention's own risks and must not
      give enrolled people a false expectation of reversal.
    next: >-
      The reversal endpoint is the bottleneck, not the gate. Before designing the trial, establish a
      minimal-detectable-change for SV2A-PET (test-retest ~3-9%) and find or run a positive-control
      setting where a synaptic readout provably rises, since no therapy has yet moved it.
    sources:
      - "10.1523/jneurosci.16-14-04491.1996"
      - "10.1002/alz.12097"
      - "10.1002/ana.410300410"
      - "10.1371/journal.pbio.3002456"
    history:
      - date: 2026-10-22
        note: "Created on inversion night; the reversibility scan's compartment inventory (plastic vs lost-neuron) and tonight's no-hysteresis model both point to a narrow pre-floor window."
      - date: 2026-10-31
        note: >-
          Advanced to investigating on the modeling night; the blocking question was answered, and the
          answer is discouraging for the endpoint. SV2A-PET CAN rise detectably in humans - but the
          only convincing within-subject increase is from SLEEP DEPRIVATION (thalamus +4.6%,
          hippocampus +5.6%, n=40 randomized; Elmenhorst 2026, PMID 42335020), read as pathological
          synaptic accumulation, not recovery. NO therapy has ever driven a significant within-group
          SV2A-PET rise: human single-dose ketamine (PMID 41863255) and psilocybin (PMID 42457666)
          were null, and the increases that exist sit right at the ~3-9% test-retest floor (Finnema
          2018, PMID 28792356). The one genuine above-baseline COGNITIVE gain from a peripheral-immune
          agent (sargramostim, Potter 2021, +1.45 MMSE within-group) was tiny, transient and not a
          synaptic readout. So the gate half of the idea is sound but the reversal-readout half is not
          yet usable: SV2A-PET has never been shown to go up with treatment and barely clears its own
          noise floor. Reframed `next` accordingly. Related idea improvement-endpoint-validation
          carries the same bottleneck."

  - id: vaccine-trained-immunity
    title: "Test whether adult vaccines protect by trained innate immunity (antigen-independent), not anti-herpesvirus action"
    created: 2026-10-23
    lens: repurposing
    goal: understand
    status: investigating
    mechanism: >-
      A regression-discontinuity natural experiment on the Welsh shingles rollout found roughly a
      20% relative drop in dementia, and the protection does not look antigen-specific: the
      recombinant shingles vaccine (a different, adjuvanted antigen) protects at least as well as
      the live one, an adjuvanted RSV vaccine shows a similar signal, and unrelated vaccines (BCG,
      Tdap, influenza, pneumococcal) each associate with lower risk. The hypothesis is that the
      shared cause is trained innate immunity - durable epigenetic/metabolic reprogramming of
      myeloid cells and microglia - so the protective ingredient is immune stimulation in general,
      not suppression of any one pathogen.
    novelty: >-
      The individual vaccine-dementia associations are published; framing them as one
      antigen-independent trained-immunity effect with a single decisive prediction, and treating
      the recombinant-vs-live and cross-vaccine contrasts as the test, is the contribution. A
      BCG-to-CSF reprogramming trial exists but is tiny and open-label.
    against: >-
      Healthy-vaccinee bias inflates cohort estimates (the regression-discontinuity effect ~20% is
      far smaller than cohort hazard ratios of 0.49-0.74, and an active Tdap comparator attenuates
      one estimate from 0.49 to 0.73). An antigen-specific anti-herpesvirus pathway is not excluded
      (shingles infection itself raises risk; antivirals modestly lower it). Trained immunity can
      also worsen neuroinflammation, so "net protective" is not obvious. No RCT with a clinical
      dementia endpoint exists for any of these.
    falsify: >-
      Antigen-independence is the test. If, across regression-discontinuity or active-comparator
      designs, antigenically unrelated vaccines (BCG, Tdap) do NOT lower risk while only
      herpesvirus-directed ones do, trained immunity is wrong and the effect is anti-herpesvirus.
      If recombinant and live shingles vaccines diverge sharply (live better), that also favours
      the antiviral story over trained immunity.
    evidence: observational
    safety: >-
      Adult vaccines are broadly safe and already recommended, so the translational risk is low;
      but trained immunity is double-edged and could in principle worsen neuroinflammation in some
      people, which any trial must monitor. Nothing here is medical advice.
    next: "Watch for independent (non-originating-group) regression-discontinuity replications and any head-to-head antigen-unrelated-vaccine comparison; see the power note in scripts/power_2026_10_23.py."
    sources:
      - "10.1038/s41586-025-08800-x"
      - "10.1038/s41591-024-03201-5"
      - "10.1038/s41541-025-01172-3"
      - "10.1001/jamanetworkopen.2023.14336"
      - "10.7554/eLife.106037"
    history:
      - date: 2026-10-23
        note: "Created on repurposing night. Strongest of the night: a cheap, safe class with a natural-experiment signal and one clean falsification (antigen-independence)."
      - date: 2026-10-30
        note: >-
          Weakened on the frontier-scan night (confidence lowered; still new, no longer treated as
          the single most promising idea). A 2026 reanalysis (Kivimaki et al., Brain Behav Immun,
          PMID 42754179, verified against source) quantified the IMPLIED vaccine effectiveness behind
          the shingles natural experiments: Wales 18%, Australia 177%, Canada 84% and 111% - two
          exceed the 100% theoretical maximum, and no matching decline appears in national dementia
          statistics, so the authors conclude these "cannot be considered strong evidence of a
          clinically meaningful effect." Reading: the flagship Welsh regression-discontinuity (~18%)
          remains the least-biased single estimate and is not overturned, but the "robustly
          replicated ~20%" framing does not hold - the confirmatory-looking replications are
          implausibly large, consistent with residual (healthy-vaccinee) confounding. The idea
          survives as a hypothesis with a clean falsification (antigen-independence), but its
          evidence base is weaker than the first write-up implied."
      - date: 2026-10-31
        note: >-
          A mechanistic headwind from the peripheral-immune scan: the key preclinical experiment on
          peripheral innate-immune training (Wendeln 2018 Nature, PMID 29643512) found that immune
          TRAINING WORSENED cerebral amyloidosis while tolerance alleviated it - the opposite
          direction to the human vaccine-lower-dementia signal. Combined with last night's
          confounding critique, the net sign of peripheral immune training on AD pathology is now
          genuinely in doubt; this is the decisive question spun out tonight as idea
          trained-immunity-net-sign."
      - date: 2026-11-04
        note: >-
          Reversal-lens / women-focus revisit. Status new -> investigating. The idea's OWN
          falsification test is antigen-independence, and it now has data that leans toward trained
          immunity: the recombinant adjuvanted Shingrix out-protects the live-attenuated Zostavax
          (Taquet et al., Nat Med 2024, restricted-mean-time-lost ratio 0.83 [0.80-0.87], PMID
          39053634) - a replicating live virus should win if the mechanism were antiviral, so losing
          to the adjuvanted protein favours the adjuvant/trained-immunity read; the two AS01
          vaccines (zoster, RSV) are equivalent (npj Vaccines 2025, 10.1038/s41541-025-01172-3); and
          BCG lowers dementia ~20% despite zero shared antigen with VZV (JAMA Netw Open 2023 HR 0.80
          [0.69-0.99]; Swedish cohort PLOS ONE 10.1371/journal.pone.0292174, AD-specific NS), though
          only in confounded bladder-cancer cohorts. Sex-specificity verified in both primary RD
          sources (Eyting 2025 Nature 10.1038/s41586-025-08800-x, effect markedly greater in women;
          Cell 2025 progression study, men indistinguishable from zero for every outcome) BUT it is
          MECHANISM-AGNOSTIC - estrogen-enhanced trained immunity, higher female anti-VZV response,
          and sex-skewed healthy-vaccinee bias all predict a female signal, so sex does not
          adjudicate; recorded as a feature, not as support. Still NO independent (non-originating-
          group) regression-discontinuity replication (the Australian RD is a Geldsetzer
          collaboration; Taquet/Oxford is independent but a different, cohort design). Reversal lens:
          only progression-slowing in the already-diagnosed (Cell 2025) plus mouse-only microglial-
          repair hints; no evidence of reversal, consistent with the recurring freeze-not-reverse
          finding. Net: the mechanism half strengthened, the effect-is-real half stayed weak
          (Kivimaki >100% implied VE in 3 of 4 natural experiments, PMID 42754179; Wendeln 2018
          training worsened amyloid, PMID 29643512; no RCT). Not promising (effect base too weak),
          not parked/killed (the discriminating test is alive and currently favourable)."
      - date: 2026-11-25
        note: "2026-11-25: two developments. (1) A critique scaled the three natural experiments from 'eligible' to 'vaccinated' and found implied reductions in dementia of 18% in Wales but 177% in Australia and 84-111% in Canada - above the possible maximum - and concluded the designs are not strong evidence (10.1016/j.bbi.2026.107021, abstract checked). (2) Two randomised trials are now registered: one of about 33,600 people aged 76 and over against placebo, and an open-label one of about 162,000, reading out in 2029-2030 (as reported from registries). The mechanism question this idea asks is premature until those report. Status unchanged; tonight's ladder model gives the effect a 30% chance of being real."
  - id: lithium-microdose-target-trial
    title: "Microdose lithium for prevention, made credible by an active-comparator target-trial emulation"
    created: 2026-10-23
    lens: repurposing
    goal: slow
    status: investigating
    mechanism: >-
      Endogenous brain lithium is reduced in MCI and further depleted in Alzheimer's by amyloid
      sequestration, and in mice dietary lithium depletion worsens amyloid, tau, inflammation and
      memory via GSK3-beta while an amyloid-evading lithium salt prevents it. The hypothesis is
      that restoring lithium at microdose (well below psychiatric doses) slows progression, tested
      not by yet another tiny trial but by emulating a target trial in existing records.
    novelty: >-
      Lithium-in-AD is an old idea with small positive MCI trials and drinking-water epidemiology;
      the fresh parts are the 2025 endogenous-depletion mechanism and, as the contribution here, a
      credible-inference design - comparing people already on lithium for mood disorders against an
      active comparator (other mood stabilisers) to defeat healthy-user bias - rather than relying
      on confounded ecological water-lithium studies.
    against: >-
      The mechanism and salt-specific rescue are preclinical (mouse); the human RCTs are small and
      old (Forlenza, n=45) and a microdose pilot was methodologically weak; drinking-water studies
      are ecological and confounded. Even low-dose lithium carries real renal and thyroid risk over
      years, and the amyloid-evading orotate salt is unproven in humans.
    falsify: >-
      In a claims/records cohort, emulate a target trial of lithium vs an active mood-stabiliser
      comparator in people with mood disorders, with negative-control outcomes. If lithium shows no
      lower dementia incidence against the active comparator, the observational rationale collapses
      before any prevention RCT is worth running.
    evidence: preclinical
    safety: >-
      Lithium has a narrow therapeutic window even if microdosing is safer; chronic renal and
      thyroid toxicity are the main risks and would gate any trial. Not medical advice; no one
      should self-dose.
    next: "The emulation now largely exists (medRxiv 2026); shift to the untested matched-pathology question - in an autopsy cohort with lithium + amyloid + tau + cognition, does PFC lithium predict cognition WITHIN the high-pathology stratum (a resilience buffer) or only track disease stage? Treat the 2026 preprint as not-yet-peer-reviewed."
    sources:
      - "10.1038/s41586-025-09335-x"
      - "10.1192/bjp.bp.110.080044"
      - "10.1016/j.envpol.2026.127766"
      - "10.64898/2026.01.12.26343472"
    history:
      - date: 2026-10-23
        note: "Created on repurposing night. Cheapest candidate with a 2025 mechanism; the design, not the drug, is the novel part."
      - date: 2026-11-04
        note: >-
          (Bookkeeping) This entry was silently merged into vaccine-trained-immunity from 2026-10-23
          until 2026-11-04 because its `- id:` line was missing (YAML duplicate-key last-wins), so it
          did not exist as a loadable catalogue entry during that window; restored on the
          reversal-biology night.
      - date: 2026-11-05
        note: >-
          Resilience-lens revisit. Status new -> investigating, with two honest DOWNGRADES and a
          reframe. (1) The entry's claimed novelty was "the design, not the drug" - an
          active-comparator, new-user target-trial emulation - but that design now LARGELY EXISTS: a
          2026 preprint (medRxiv 10.64898/2026.01.12.26343472) emulates exactly it (lithium vs
          antiepileptic mood stabilisers, Medicare/MarketScan/Optum) and finds a modest, heterogeneous
          5-yr RR ~0.84-0.87 for progression to advanced ADRD (Optum null ~0.90, MarketScan ~0.57),
          not peer-reviewed and about PROGRESSION in already-ill patients, not prevention; a 2024
          Nordic register target trial (lithium vs lamotrigine/valproate) found no systematic dementia
          difference. So the signal weakly survives an active comparator but is not clean. (2) The 2025
          Nature mechanism paper (10.1038/s41586-025-09335-x) compared DIAGNOSTIC groups (CN/MCI/AD),
          not cognitively resilient-vs-demented brains at matched pathology, so the tempting
          "endogenous lithium is a resilience buffer" reading is an inference, not a demonstrated
          resilience finding, and its mouse rescue is prevention-dominant/reversal-ambiguous. Reframe:
          the live contribution is now (a) the resilience-buffer MECHANISM (PFC-specific lithium
          depletion already at MCI, amyloid sequestration, de-repressed GSK3-beta driving tau - a
          growth-term lever, which tonight's firebreak toy argues is where resilience against an
          autocatalytic spreader actually lives) and (b) the untested matched-pathology question. Note
          a possible convergence: the RELN-COLBOS resilience variant lowers tau via Dab1 and lithium
          loss raises tau via GSK3-beta - plausibly the same kinase node. Kept evidence: preclinical;
          not promoted to promising (modest, heterogeneous, unreplicated by peer review)."
      - date: 2026-11-22
        note: "2026-11-22: the pilot trial in mild impairment has reported. None of its six co-primary outcomes met the pre-set threshold in 80 people; one memory test declined 0.73 against 1.42 points a year (difference 0.69, 95% range 0.01 to 1.37, p = 0.05), and serious adverse events were 29% against 23% (10.1001/jamaneurol.2026.0072, abstract checked). By tonight's base-rate model a nominal result on one of several outcomes in a small trial leaves the chance of a real effect at roughly 7-11%. A 200-person trial is registered but not recruiting (as reported). Status unchanged."

  - id: repurposing-credibility-gate
    title: "A standard active-comparator / regression-discontinuity bar before any observational repurposing claim is graded"
    created: 2026-10-23
    lens: repurposing
    goal: understand
    status: investigating
    mechanism: >-
      Observational repurposing signals in this field are systematically inflated by healthy-user
      and immortal-time bias: the shingles-vaccine effect shrinks from cohort hazard ratios near
      0.5 to ~20% under regression discontinuity, the sildenafil claims signal attenuates under
      active-comparator designs, and metformin's protective claims signal is near-null in Mendelian
      randomisation. The idea is a fixed credibility gate - active comparator, negative-control
      outcomes, and regression discontinuity where an eligibility cutoff exists - that any
      observational repurposing claim must pass before the repo grades it above the weakest level.
    novelty: >-
      Target-trial emulation and active comparators are established methods; adopting them as an
      explicit grading gate in this repo's evidence table, tied to concrete worked examples from
      the nightly scans, is the contribution.
    against: >-
      Emulation cannot remove unmeasured confounding entirely, and regression discontinuity needs a
      natural eligibility cutoff that usually does not exist, so the gate could reject real effects
      for lack of a clean design rather than for being false.
    falsify: >-
      Apply the gate retrospectively to the night's candidates. If active-comparator correction
      does NOT change the signals (e.g. if the shingles effect had not shrunk from 0.49 to 0.73
      against a Tdap comparator), the gate adds nothing and is not worth adopting. Its value is
      exactly the size of the corrections it forces.
    evidence: observational
    safety: "None; this is a methodological standard for grading evidence."
    next: >-
      Put the five-point gate below to the project owner as a proposed addition to policy/VETTING.md
      (do not edit policy unprompted). Then apply it to one live candidate end to end.
    sources:
      - "10.1038/s41586-025-08800-x"
      - "10.1038/s41591-024-03201-5"
      - "10.1007/s00125-022-05743-0"
    history:
      - date: 2026-10-23
        note: "Created on repurposing night, from the recurring pattern that every observational repurposing signal shrank under a stronger design."
      - date: 2026-11-02
        note: >-
          Advanced to investigating with concrete criteria drafted on the causal-chain/repurposing
          night. Proposed five-point gate a repurposing claim should pass before being graded above
          the weakest tier: (1) active-comparator new-user / target-trial emulation; (2)
          negative-control outcomes AND exposures; (3) regression discontinuity where an eligibility
          cutoff exists; (4) drug-target cis-Mendelian-randomization PLUS colocalization,
          direction-matched to the proposed drug effect; (5) APOE-locus exclusion and a
          clinically-diagnosed (non-proxy) AD GWAS as primary, proxy-AD only for replication. Worked
          examples from our own history: shingles (0.49 cohort -> 0.73 vs active comparator, but the
          effect survives and has a birth-date regression-discontinuity natural experiment ->
          promotes); sildenafil (naive ~69% collapses under active-comparator/DREAM -> stays weakest);
          metformin (MR null/conflicting -> stays weakest); and tonight's ACE example (coloc-backed MR
          with a direction that argues against the drug -> criterion 4 catches a false-positive
          "protective" story). This is a PROPOSAL, not adopted; it needs owner sign-off to enter
          policy/VETTING.md."
      - date: 2026-11-22
        note: "Red-team night 2026-11-22: the gate's first criterion is necessary, not sufficient. The cleanest prospective test of an active-comparator health-record prediction - a diabetes drug reported to cut Alzheimer's diagnoses by 40-70% against sister drugs (10.1002/alz.14313, abstract checked) - failed in two large trials. Only 16-19% of drugs now in Alzheimer's trials pass a same-class comparison at all (10.1002/trc2.70193, abstract checked). Human-genetic support is the only feature with general evidence of raising success (about 2.6 times). The night's scoreboard and base-rate model (scripts/repurposing_prior_2026_11_22.py) put the starting chance for an approved drug with observational support at a few percent; the gate should state that number and require two pivotal-size wins before a claim is graded as established."

  - id: antiviral-hsv-reactivation
    title: "Antiherpes antivirals (valacyclovir) to slow Alzheimer's via the HSV-reactivation hypothesis"
    created: 2026-10-23
    lens: repurposing
    goal: slow
    status: killed
    mechanism: >-
      Herpes simplex reactivation was proposed to drive neuroinflammation and amyloid as an
      antimicrobial response, so suppressing reactivation with antiherpes antivirals was expected
      to slow decline.
    novelty: >-
      Not novel; logged to record that a randomized trial has now settled it for the tested
      regimen.
    against: >-
      The VALAD randomized trial (valacyclovir 4 g/day, early symptomatic Alzheimer's, HSV
      seropositive) was not merely negative: cognition worsened significantly MORE on valacyclovir
      than on placebo (ADAS-Cog between-group difference 3.93, 95% CI 1.03-6.83, p=0.01), with no
      effect on amyloid or tau PET. The 4 g/day dose also fails the cost gate.
    falsify: >-
      Already falsified for this regimen by VALAD. A residual, narrower question (early/preclinical
      timing, low suppressive dose, or PCR-confirmed active reactivation only) would need its own
      trial and is not pursued here without a positive signal first.
    evidence: RCT
    safety: >-
      The trial suggests possible harm (greater cognitive worsening) at the dose tested; this is a
      reason not to pursue the regimen, and certainly not medical advice.
    next: "Do not pursue the tested regimen. Read VALMCI (PMID 42210804) in full before revisiting any narrower version."
    sources:
      - "10.1001/jama.2025.21738"
      - "10.1186/s13195-021-00950-0"
    history:
      - date: 2026-10-23
        note: "Created and immediately killed on repurposing night: the VALAD RCT (Devanand, JAMA 2026, PMID 41405855) reported negative and trending to harm, verified against Europe PMC."

  - id: regime-shift-trial-signatures
    title: "Design trials to detect the signatures of alternative stable states, not a group-mean slope"
    created: 2026-10-24
    lens: trial-design
    goal: reverse
    status: parked
    mechanism: >-
      If the brain behaves like an ecosystem with alternative stable states, recovery is not a
      graded reversal of decline but a jump between basins, so the useful trial signals are (a)
      bimodal, person-level outcomes - a subset crossing back above their own baseline while most do
      not - and (b) a threshold-shaped dose-response rather than a straight line. A trial that reads
      only the group-mean change averages a bimodal response into a muddy slope and misses both.
    novelty: >-
      Responder and dose-ranging analyses exist, but as secondary readouts; pre-specifying a
      bimodality/time-to-improvement endpoint AND a test for a discontinuous dose-response, both
      motivated explicitly by an alternative-stable-states model, is the contribution. Tonight's toy
      regime-shift model (scripts/regime_shift_2026_10_24.py) shows the hysteresis gap this would
      look for; dynamical AD models with thresholds/early-warning signals exist (PMID 42899506 =
      a network-collapse phase transition; PMID 41675964 = a generic early-warning-signal method on
      ADNI) but these are in-silico/method and show a threshold-to-collapse, NOT a demonstrated
      bistable basin, and none has been turned into a trial-readout prescription.
    against: >-
      No instrument is validated to detect improvement above baseline in 6-12 months (the trial-
      design scan's central finding), so a "crossed back above baseline" endpoint has no validated
      ruler yet. Bistability in human AD is unproven - it is so far modeling and metaphor, with no
      demonstrated basin structure - so the premise may simply be false, and a responder threshold
      can be gamed by where it is set.
    falsify: >-
      Re-analyze a positive anti-amyloid trial (lecanemab CLARITY-AD or donanemab TRAILBLAZER-ALZ 2)
      for a bimodal responder distribution and its dose arms for a graded-vs-threshold shape. If the
      outcome is unimodal decline and the dose-response is graded, there is no basin signature and
      the premise is unsupported.
    evidence: observational
    safety: "None; a trial-analysis and design proposal."
    next: "Specify the bimodality + threshold-dose readout concretely; check whether published trial-level distributions (not just means) are available to test for bimodality."
    sources:
      - "10.1111/ejn.70713"
      - "10.1002/qub2.86"
      - "10.1056/NEJMoa2212948"
    history:
      - date: 2026-10-24
        note: "Created on trial-design night under the ecosystem constraint, from tonight's regime-shift model and the finding that no endpoint detects improvement."
      - date: 2026-11-07
        note: >-
          Inversion / vascular revisit - PARKED. The trial-signature half fails its own falsification
          test: published anti-amyloid person-level distributions are unimodal and heavily overlapping
          with no second mode (Espay/Kepp/Herrup, eNeuro 2024, 10.1523/ENEURO.0319-23.2024; donanemab's
          ~47% 'no CDR-SB change' is a pile-up at the scale floor, not a subpopulation crossing above
          baseline), the dose-response half is untestable in the single-dose pivotal trials (graded in
          Phase 2), and the 'crossed back above baseline' endpoint still has no validated ruler
          (improvement-endpoint-validation). As a TRIAL-SIGNATURE idea it is metaphor dressed as design.
          What survives is strictly the VASCULAR mechanism: a genuine saddle-node + hysteresis exists in
          a published cerebrovascular model (Ahern/Goriely, Proc R Soc A 2025, 10.1098/rspa.2024.0548),
          with its first arm empirically real in human tissue (Nortley/Attwell 2019, Science,
          10.1126/science.aav9518), spun out tonight as vascular-bistability-hysteresis (investigating,
          modelled in scripts/vascular_hysteresis_2026_11_07.py). The honest open question is empirical,
          not modeling: is a vascular readout bimodal at matched amyloid, and does post-clearance CBF
          show path-dependence? Also softened the PMID wording above (those models are threshold/EWS, not
          demonstrated bistability)."

  - id: microglia-plaque-predator-prey
    title: "A predator-prey model of microglia clearing amyloid, where the predator degrades as it feeds"
    created: 2026-10-24
    lens: trial-design
    goal: understand
    status: investigating
    mechanism: >-
      Neurodegeneration modeling uses spreading/aggregation math (reaction-diffusion, epidemic-style)
      but almost no true population-competition models; yet microglia clearing amyloid look like a
      predator-prey system with a twist - chronic engagement exhausts and transforms microglia from a
      homeostatic to a dysfunctional disease-associated state, so the predator degrades as it feeds.
      A Lotka-Volterra-type model with that feedback could reveal whether the amyloid-microglia system
      has collapse or oscillation regimes a pure spreading model cannot show.
    novelty: >-
      The ecosystem scan found genuine Lotka-Volterra / predator-prey models of brain cell populations
      are essentially absent; this fills a real gap rather than restating known spreading dynamics.
    against: >-
      Microglial states are a continuum, not two discrete species - the field has formally deprecated
      the two-state A1/A2 and M1/M2 caricatures (Escartin 2021, PMID 33589835) - so a discrete
      predator-prey model may encode exactly the oversimplification that was abandoned, and could be
      elegant but unfalsifiable without longitudinal single-cell state data.
    falsify: >-
      Build the model and ask whether it predicts anything the existing reaction-diffusion/epidemic
      models do not (e.g. a clearance-collapse regime or oscillation), then check whether that
      prediction is distinguishable against published microglial-state trajectories. If it only
      re-describes known spreading behavior, it adds nothing and is dropped.
    evidence: in-silico
    safety: "None; modeling only."
    next: >-
      Fix the likely wrong sign of the peripheral term: re-run with peripheral input allowed to ADD
      to inflammation / suppress clearance (per Wendeln 2018), and work out which human readout would
      reveal the true sign. Also move from two discrete states toward a continuum before over-reading.
    sources:
      - "10.1038/nature21029"
      - "10.1038/s41593-020-00783-4"
      - "10.1371/journal.pcbi.1012743"
      - "10.1038/nature25158"
    history:
      - date: 2026-10-24
        note: "Created on trial-design night under the ecosystem constraint, from the Lotka-Volterra gap the scan identified."
      - date: 2026-10-31
        note: >-
          Built the model (scripts/predator_prey_2026_10_31.py) on the modeling night and advanced to
          investigating. Minimal predator-prey with microglial exhaustion (self-limitation) and a
          peripheral-immune reinforcement term r. Result: the outcome is a THRESHOLD, not a dial -
          amyloid either clears or saturates; clearance efficiency a and peripheral reinforcement r
          push toward clearing, microglial exhaustion q pushes toward saturation (sensitivity across
          each range: a -0.62, q +0.49, r -0.44 around the base point). So the model answers its own
          falsification - it does predict a collapse/clearance threshold a pure spreading model does
          not. BUT tonight's peripheral-immune scan undercuts the model's most policy-relevant
          assumption: physiological peripheral-monocyte amyloid clearance is ~0 (the engraftment story
          is largely an irradiation-chimera artifact - Mildner 2007, Prokop/Varvel 2015), peripheral
          trained immunity WORSENED amyloidosis in the key experiment (Wendeln 2018 Nature, PMID
          29643512), and systemic inflammation suppresses clearance. So the r>0-helps term may have
          the WRONG SIGN, and microglia may not even be rate-limiting for plaque maintenance
          (Grathwohl 2009). The model is structurally sound and its threshold behaviour is honest, but
          its optimistic peripheral knob is not supported by the biology - that is the new `next`. The
          night-6 caveat (states are a continuum, not two species) still stands."

  - id: improvement-endpoint-validation
    title: "Find and validate a readout that can detect within-person cognitive improvement in 6-12 months"
    created: 2026-10-24
    lens: trial-design
    goal: detect
    status: investigating
    mechanism: >-
      Every validated cognitive, digital and fluid measure is validated for rate of DECLINE, not for
      improvement above a person's own baseline, so no reversal trial can currently be scored on its
      own terms. The idea is to validate a candidate improvement-sensitive readout - a passive
      digital/speech measure with good within-person reliability, or a functional measure that
      outperforms cognitive composites over short windows - by testing whether it can detect a KNOWN
      within-person gain against a positive control (e.g. recovery from a reversible cause such as
      treated depression, delirium or sleep deprivation).
    novelty: >-
      The gap is explicit in the literature (no improvement-validated endpoint over 6-12 months); using
      a reversible-cause recovery as a positive control to validate an improvement ruler is the
      contribution.
    against: >-
      Practice effects contaminate any apparent improvement (both arms rose in FINGER/POINTER largely
      via retesting), so a measure might register "improvement" that is just test familiarity; and if
      genuine within-person gains essentially never occur in Alzheimer's, there is nothing to validate
      the ruler against within the disease.
    falsify: >-
      Take a candidate measure and test whether it detects a real within-person cognitive gain in a
      positive-control setting with acceptable reliability and above practice-effect noise. If it
      cannot, no improvement endpoint is feasible and reversal trials cannot be scored - a decisive,
      cheap negative.
    evidence: observational
    safety: "None; a measurement-validation proposal."
    next: "Take one passive/practice-robust at-home signal with published within-person reliability - connected-speech MFCC acoustic-variance (ICC>0.65, 10.1186/s13195-024-01543-3) or an M2C2 burst aggregate (ICC 0.89-0.97, 10.1002/dad2.12283) - and test whether it registers the within-person rebound after one night of RECOVERY SLEEP following sleep deprivation (the one at-home positive control with documented reversible within-person change, PVT-validated, 10.3758/s13428-016-0763-8), above its own retest band. Days, not months; decisive negative if it fails."
    sources:
      - "10.1016/S0140-6736(15)60461-5"
      - "10.1016/j.trci.2017.08.010"
      - "10.1002/dad2.12283"
      - "10.1186/s13195-024-01543-3"
      - "10.1002/alz.087332"
    history:
      - date: 2026-10-24
        note: "Created on trial-design night, from the scan's central finding that no instrument is validated to detect improvement above baseline."
      - date: 2026-11-06
        note: >-
          Red-team / at-home revisit. Status new -> investigating, re-scoped. Survives the red-team but
          only in a narrow form. Active cognitive tasks cannot cleanly show improvement: retest
          (practice) effects mimic ~0.2 SD gains (FINGER both arms rose, 10.1016/S0140-6736(15)60461-5;
          Jacobs 2017, 10.1016/j.trci.2017.08.010), and the only domain with a proven at-home
          within-person recovery is vigilance (PVT after recovery sleep, 10.3758/s13428-016-0763-8),
          not AD-relevant episodic memory. Key reframe: the practice effect is ALSO an AD signal - its
          attenuation tracks amyloid and entorhinal tau (Tort-Merino 2025, 10.1002/alz.087332) - so the
          ruler should be deviation from each person's expected practice-learning curve, not raw change
          (spun out as practice-curve-deviation-endpoint). Only high-reliability burst-aggregated
          measures (M2C2, ICC 0.89-0.97, 10.1002/dad2.12283) clear the detectability bar, and passive
          measures that escape practice by construction (speech acoustics) have the weakest reliability
          so far - the crux. Modelled tonight in scripts/improvement_detectability_2026_11_06.py. Also
          corrected a mis-cited source: the old 10.1001/jamaneurol.2014.803 is the PACC decline
          composite, not a practice-effects paper; swapped for FINGER + Jacobs."

  - id: remyelination-prevention-window
    title: "Test a cheap remyelination drug early, in high-myelin-risk people, with a myelin imaging endpoint"
    created: 2026-10-25
    lens: prevention-population
    goal: slow
    status: investigating
    mechanism: >-
      Myelin breakdown is demonstrably early in Alzheimer's - visible in preclinical disease and even
      in APOE4-carrier infants - and remyelination is druggable (clemastine shortened visual-evoked
      latency in a multiple-sclerosis RCT; metformin rejuvenates aged oligodendrocyte precursors in
      rodents). Yet no remyelination trial exists in Alzheimer's. The idea is to test a cheap generic
      remyelinator in high-risk preclinical people (APOE4 or high white-matter-hyperintensity burden)
      with a myelin imaging readout (myelin water fraction / g-ratio), where repair is still possible.
    novelty: >-
      The absence of any Alzheimer's remyelination trial is an explicit gap in the literature; moving a
      proven-in-MS agent into early/high-risk Alzheimer's with a myelin endpoint is the contribution.
    against: >-
      Clemastine's MS benefit was a surrogate (conduction latency), not cognition, and clemastine is
      strongly anticholinergic - and anticholinergic burden is itself associated with higher dementia
      risk, so the drug could do net harm in an older brain. Structural myelin protection may not reach
      cognition anyway: SPRINT MIND slowed white-matter-lesion growth yet missed its dementia endpoint.
      Remyelination may also be MS-specific and not achievable against ongoing amyloid/tau toxicity.
    falsify: >-
      In a high-risk cohort, does a remyelination agent move BOTH myelin imaging and cognition, or
      myelin only? A myelin-only result (as in the MS surrogate, and echoing SPRINT's
      structure-without-dementia) shows the chain does not reach clinical benefit, killing the
      prevention rationale. Choose a non-anticholinergic agent (e.g. metformin) to avoid confounding
      harm.
    evidence: observational
    safety: >-
      Clemastine is sedating and anticholinergic (a real dementia-risk concern in older adults);
      metformin is safer but has its own cautions. Any trial needs a non-anticholinergic agent and
      careful monitoring. Not medical advice.
    next: "Before any trial, run the cheap open-data surrogate-validity check: does within-person change in myelin (MWF/R1) predict change in processing-speed slope AFTER adjusting for WMH volume AND amyloid? If myelin's partial R2 over WMH+amyloid is ~0, a dedicated myelin endpoint is redundant and this parks behind surrogate-gated-myelin-trial."
    sources:
      - "10.1016/S0140-6736(17)32346-2"
      - "10.1016/j.stem.2019.08.015"
      - "10.1038/s41586-023-06120-6"
      - "10.1001/jama.2019.10551"
      - "10.1001/jamanetworkopen.2024.12824"
    history:
      - date: 2026-10-25
        note: "Created on prevention night starting from the oligodendrocyte; the AD remyelination-trial gap plus the anticholinergic safety tension are the crux."
      - date: 2026-11-10
        note: >-
          Prevention-population revisit. Status new -> investigating; evidence RCT -> observational
          (the 'RCT' was clemastine's MS conduction-latency surrogate, not AD prevention) and the
          prevention rationale DOWNGRADED. The causal chain myelin/WMH -> dementia fails the tests it
          needs: the most-cited 'WMH is causal' paper (JAMA Netw Open 2024, PMID 38776079) reports
          WMH -> AD-liability MR OR ~1.43 but its own genetic-WMH score -> ALL-CAUSE dementia is NULL
          (HR 1.02, p=0.07), with a paradoxical protective BP-MR signal (a pleiotropy flag), so the
          causal headline rests on an AD-GWAS-liability outcome with by-proxy cases; and SPRINT-MIND
          slowed WMH but missed its dementia primary (PMID 30688979). No remyelination agent has been
          trialed in MCI/preclinical AD with a myelin endpoint (gap confirmed). Metformin (the preferred
          non-anticholinergic agent) has a dementia signal only from target-trial emulation and
          drug-target MR (~14% lower AD odds via mitochondrial complex I; 10.1038/s41467-022-35157-w,
          10.1007/s00125-022-05743-0), with the first RCT (MAP, NCT04098666) unread until ~2027. GWAS
          heritability is microglial, not oligodendroglial (Nott 2019; Bryois 2020), so starting from
          the oligodendrocyte swims against the genetics - the defensible mechanism is oligo-myelin <->
          microglial clearance. Tonight's preventable-fraction toy shows how little of the WMH-attributed
          fraction survives causal restriction."

  - id: wmh-enriched-prevention-trial
    title: "Enrich a blood-pressure prevention trial for high white-matter-lesion burden before concluding BP does not prevent dementia"
    created: 2026-10-25
    lens: prevention-population
    goal: slow
    status: parked
    mechanism: >-
      Intensive blood-pressure control slowed white-matter-hyperintensity growth in the SPRINT MIND
      MRI substudy and cut mild cognitive impairment, but missed its probable-dementia endpoint even on
      extended follow-up - plausibly because the trial stopped early (underpowered) and enrolled
      everyone, not those with the most small-vessel/myelin damage to protect. The idea is a prevention
      trial enriched for high baseline white-matter-lesion burden, with a myelin/vascular mechanistic
      endpoint and adequately powered long dementia follow-up.
    novelty: >-
      SPRINT MIND was not enriched for white-matter burden; targeting the subgroup with the most
      modifiable small-vessel damage, and testing whether the structure-to-dementia link holds there,
      is the contribution.
    against: >-
      The structure-vs-clinical disconnect may be real - slowing lesion growth might simply not prevent
      dementia - in which case enrichment will not rescue it. Enriching for high white-matter burden
      also selects mixed/vascular dementia, muddying an Alzheimer's-specific claim, and blood-pressure
      lowering has intrinsic limits and harms at the extremes.
    falsify: >-
      Re-analyze SPRINT MIND by baseline white-matter-hyperintensity burden: did the high-burden
      subgroup get a dementia benefit (a treatment-by-burden interaction)? No interaction means
      enrichment will not help and the premise is dead - a cheap test on existing data before any new
      trial.
    evidence: RCT
    safety: >-
      Intensive blood-pressure lowering carries falls/syncope/renal risks, especially in frail elders;
      a trial would weigh these. Not medical advice.
    next: "Parked. The one test that could revive it: re-run treatment x baseline WMH (continuous and by region) on SPRINT MIND's EXTENDED adjudicated outcomes (median 7 years); if the high-WMH hazard ratio stays >= 1 the enrichment premise is dead. Participant-level SPRINT data are access-controlled and off-limits here, so this waits for a publication."
    sources:
      - "10.1001/jama.2019.10551"
      - "10.1001/jama.2018.21442"
      - "10.1001/jamaneurol.2018.3122"
      - "10.1097/HJH.0000000000004093"
    history:
      - date: 2026-10-25
        note: "Created on prevention night; connects the oligodendrocyte/WMH thread to the population BP lever and SPRINT MIND's structure-without-dementia result."
      - date: 2026-11-12
        note: >-
          Earliest-signal / ecologist revisit - PARKED. The cheap first step this idea proposed has
          been published and points the wrong way: in SPRINT's MRI subset (n=759), intensive BP
          control was associated with MORE mild cognitive impairment or probable dementia in the
          above-median WMH group (HR 2.36, 95% CI 1.20-4.66; 28/196 vs 12/184 events), with no
          difference below the median and interaction p=0.09 (Reddy et al., J Hypertens 2025, PMID
          40586237; checked against the full text). It is post hoc, about 60 events, original
          follow-up only, so it does not prove harm - but it removes the premise that enriching for
          high WMH unmasks a cognitive benefit. WMH-enriched trials have also already run: INFINITY
          (WMH accrual slowed, cognition flat; PMID 31607143) and PRESERVE (neither imaging nor
          cognition moved; PMID 34044580) - the "benefit stops at the imaging marker" pattern again,
          though none was powered for cognition. SPRINT MIND's extended follow-up stayed borderline
          (probable dementia HR 0.86, 0.72-1.02; PMID 39819096). The ecological reading - a degraded
          system in which the intervention itself becomes a stressor once autoregulation is lost -
          is spun out as autoregulation-gated-bp-lowering.

  - id: oligodendrocyte-amyloid-source-test
    title: "Does remyelination raise or lower amyloid? A go/no-go for combining it with anti-amyloid therapy"
    created: 2026-10-25
    lens: prevention-population
    goal: understand
    status: investigating
    mechanism: >-
      Two recent preclinical findings conflict: myelin loss drives amyloid accumulation (so repairing
      myelin should lower it), yet oligodendrocytes themselves produce amyloid-beta and contribute to
      plaques (so boosting oligodendrocyte activity might raise it). If oligodendrocytes are a
      meaningful amyloid source, promoting remyelination could paradoxically increase amyloid load and
      conflict with anti-amyloid therapy - a decision that must be settled before pairing the two.
    novelty: >-
      The victim-versus-culprit contradiction is fresh (both findings 2023-2024) and unreconciled;
      framing it as a go/no-go test for combining remyelination with anti-amyloid therapy is the
      contribution.
    against: >-
      Both findings are in amyloid-overexpressing mouse models, which translate poorly; the
      oligodendrocyte amyloid contribution may be negligible in human brain, making the worry moot. The
      question may also be unanswerable without clean lineage-specific amyloid-source measurement.
    falsify: >-
      In a model, promote remyelination and measure amyloid burden: if it falls (the myelin-loss-drives-
      amyloid direction dominates), the conflict worry is void and remyelination is safe to combine; if
      it rises, remyelination-as-therapy carries an amyloid penalty. Either result is decisive.
    evidence: preclinical
    safety: "None directly; the point is to prevent a harmful drug combination before it is tried in people."
    next: "Partly resolved (leans lower/GO). The missing decisive run is a 2x2 factorial in a humanized knock-in (APP-NL-G-F, not an overexpression model) - OPC-specific genetic remyelination x anti-amyloid, with an oligodendrocyte-Bace1 control arm - measuring cortical plaque load + soluble Abeta42 and the interaction (spun out as remyelination-amyloid-factorial-gonogo)."
    sources:
      - "10.1038/s41593-024-01730-3"
      - "10.1038/s41586-023-06120-6"
      - "10.1038/s41586-022-05439-w"
      - "10.3389/fcell.2021.733945"
    history:
      - date: 2026-10-25
        note: "Created on prevention night from the oligodendrocyte victim-vs-culprit contradiction (Sasmita 2024 vs Depp 2023); a mechanistic go/no-go rather than a prevention lever."
      - date: 2026-11-09
        note: >-
          Trial-design / oligodendrocyte revisit. Status new -> investigating; the contradiction
          largely DISSOLVES and the go/no-go leans LOWER (GO), partly resolvable from existing papers.
          (1) The two 'opposing' findings are SAME-LAB (Nave) and complementary, not opposing camps:
          myelin dysfunction drives amyloid (Depp 2023, Nature, PMID 37258678 - loss-of-function only,
          they did NOT remyelinate-then-measure), while oligodendrocytes do make Abeta but CANNOT seed
          plaques without a neuronal threshold Abeta, so the oligo source is subordinate (Sasmita 2024,
          Nat Neurosci, PMID 39103558; ~50% of human gray-matter oligodendrocytes carry APP/BACE1 mRNA
          in AD, so the machinery is real in human tissue, but expression != plaque contribution).
          (2) INDEPENDENT gain-of-function evidence outside the three cited papers: the remyelinating
          drug clemastine LOWERS Abeta and rescues memory in APP/PS1 mice (Xie 2021, PMID 34746130) -
          so the feared amyloid penalty is backwards, though clemastine has muscarinic off-targets and
          this is an overexpression model. (3) Source correction: the cited Blanchard 2022 (PMID
          36385529) is human APOE4 oligodendrocyte-cholesterol/myelin work with NO amyloid readout - it
          is context, not an amyloid-source/lowering result. (4) Breadcrumb caveat: AD GWAS heritability
          enriches in MICROGLIA, not oligodendrocytes (Nott 2019; Bryois 2020), so the mechanism likely
          runs oligo-myelin <-> microglial clearance (BIN1, an Agora-nominated 'Myelination' target),
          not oligo-amyloid-source in isolation. Not closed (all causal data mouse)."

  - id: sleep-regularity-vs-duration
    title: "Night-to-night regularity of consolidated slow-wave sleep may predict pathology better than sleep duration"
    created: 2026-10-28
    lens: combination-timing
    goal: understand
    status: parked
    mechanism: >-
      Both short and long sleep associate with worse amyloid and cognition (a U-shape), which makes
      total duration a poor single axis. Tonight's timing model shows that, near a clearance
      threshold, how clearance is distributed in time changes containment even at equal daily
      average - long low-clearance gaps let pathology regrow. That points to the regularity and
      consolidation of slow-wave windows, not mean duration, as the sleep variable most likely to
      track amyloid/tau.
    novelty: >-
      Sleep-regularity indices predict cardiometabolic outcomes and mortality, but their link to AD
      biomarkers versus mean duration is far less established; the timing model gives the prediction
      a concrete rationale, and the U-shape in duration is a reason to expect duration to
      underperform.
    against: >-
      Mendelian randomization is largely null for sleep traits causing AD, so any sleep-pathology
      link may be reverse causation (early pathology fragments sleep) or confounding; regularity is
      noisier to measure than duration; and the model's timing effect is a property of its concave
      growth term, not evidence the brain works this way.
    falsify: >-
      In a cohort with multi-night actigraphy (or EEG) and amyloid/tau PET, does a sleep-regularity
      / slow-wave-consolidation index predict pathology better than mean duration, adjusting for
      age and APOE? If regularity adds nothing beyond duration, the idea is dead.
    evidence: observational
    safety: "None; an analysis and measurement hypothesis."
    next: "Look for cohorts with actigraphy/EEG regularity metrics plus amyloid/tau PET; compare regularity vs mean duration as predictors."
    sources:
      - "10.1001/jamaneurol.2021.2876"
      - "10.1093/brain/awx148"
      - "10.1038/s41386-019-0478-5"
    history:
      - date: 2026-10-28
        note: "Created on combination-timing night (sleep constraint), from the U-shaped duration finding plus the intermittent-clearance timing model."
      - date: 2026-11-19
        note: "Revisited on the causal-chain night (symptomatic focus). PARKED. Across cohorts the classic regularity measure is the least consistent rhythm predictor (null in several, and pointing the wrong way for Alzheimer's in one large analysis, 10.1186/s13195-024-01411-0); the two large analyses of the newer regularity index disagree on the shape of the curve and neither tested prediction formally (10.1212/WNL.0000000000208029; 10.1186/s12889-025-21649-z). Direction leans to consequence: rhythm decline doubles after a diagnosis of mild impairment and again after dementia (10.1016/s2666-7568(20)30015-5, abstract checked), and genetic studies find Alzheimer's risk shifting sleep but not sleep causing Alzheimer's (10.1212/WNL.0000000000010463, abstract checked). The slow-wave version has a measurement problem: night-to-night variation in scored deep sleep is 47%, mostly noise, while slow-wave power is stable (10.1093/sleep/zsaf329, abstract checked). In people with dementia, light and melatonin trials did not measurably move regularity, so regularising sleep has never actually been tested as a removal experiment. Re-open on a head-to-head comparison with a formal prediction statistic, or a study using slow-wave power variability with amyloid or tau imaging."

  - id: orexin-antagonist-early-window
    title: "A dual orexin-receptor antagonist tested early, with PET endpoints, to see if nightly use durably lowers accumulation"
    created: 2026-10-28
    lens: combination-timing
    goal: slow
    status: parked
    mechanism: >-
      A single dose of suvorexant acutely lowered CSF amyloid and p-tau in a small randomized study,
      and the field's best-evidenced timing lesson is that intervening earlier helps far more. The
      idea is to test a dual orexin-receptor antagonist nightly in high-risk preclinical people with
      amyloid/tau PET endpoints, with the explicit prediction that it only changes trajectory if the
      acute biomarker drop accumulates into durable lowering AND it is started before the tipping
      point - a sleep-drug-plus-early-timing combination.
    novelty: >-
      A DORA trial with a cognitive or PET-progression endpoint is an explicit gap (evidence stops at
      acute biomarkers); pairing it with early-stage enrollment and a durability test is the
      contribution.
    against: >-
      The sleep-causal premise is shaky: Mendelian randomization is largely null for sleep traits,
      and the best sleep-improvement trials (CPAP, CBT-I) are null on cognition and amyloid, so a
      DORA may move biomarkers acutely without changing disease. Suvorexant's effect was transient,
      single-night, biomarker-only; DORAs cause next-day somnolence and fall risk in elderly.
    falsify: >-
      A nightly-DORA RCT in high-risk preclinical people with serial amyloid/tau PET: does chronic
      dosing produce durable lowering and slower accumulation, or only the known acute dip? Acute-
      only (no durable change) kills the disease-modification rationale.
    evidence: RCT
    safety: >-
      Dual orexin-receptor antagonists cause somnolence, next-day impairment and fall risk,
      especially in older adults; a trial must weigh these. Not medical advice.
    next: "Check whether any DORA trial with a cognitive/PET-progression endpoint is registered; if not, that is the missing study."
    sources:
      - "10.1002/ana.26641"
      - "10.1002/alz.71591"
      - "10.1093/ije/dyaa183"
    history:
      - date: 2026-10-28
        note: "Created on combination-timing night; the DORA cognitive-endpoint gap plus the early-timing lesson are the crux, against a shaky sleep-causal premise."
      - date: 2026-11-18
        note: "Revisited on the cross-domain night. The next step is answered: as reported by a registry scan (not independently re-checked), no orexin-antagonist trial uses amyloid or tau PET; three prevention-style trials are recruiting with blood p-tau ratios as the primary endpoint (NCT04629547 suvorexant 18-24 months, n about 120; NCT06274528 lemborexant 6 months; NCT07213349 daridorexant 12 months), reading out from 2028. The acute effect is also weaker than recorded here: as reported from the full text, spinal-fluid amyloid was lower only after normalising to hour 6 and rebounded before the next dose, and p-tau217 did not fall. Our model (scripts/nightly_dip_accumulation_2026_11_18.py) shows a night-only dip of 10-20% is a 3-10% fall in the 24-hour average, giving a plaque slowing far below the 40% that failed to help cognition in A4 and needing hundreds to thousands of people per arm to see on PET. PARKED: the proposed PET trial is a poor test, and the informative trials are already running. Re-open if those trials show spinal-fluid and blood markers moving together, or a kinetic study shows lower production over 24 hours."

  - id: circadian-period-enrichment
    title: "Use intrinsic cellular circadian period as prognostic enrichment to select fast progressors for trials"
    created: 2026-10-28
    lens: combination-timing
    goal: detect
    status: parked
    mechanism: >-
      A longer intrinsic cellular circadian period (measured ex vivo) was associated with higher
      p-tau/NfL/GFAP, medial-temporal atrophy, and faster clinical decline, reportedly independent of
      baseline pathology. If it genuinely adds prognostic information beyond standard markers, it
      could enrich trials for fast progressors - shrinking the sample size and time needed to detect
      an effect, the recurring bottleneck in this field.
    novelty: >-
      The circadian-period association is published as prognostic only; using it as a trial-
      enrichment variable (alongside or instead of p-tau217) is the contribution.
    against: >-
      The measurement is an ex-vivo fibroblast assay - invasive, slow, and hard to scale for
      enrollment; and the period may partly track pathology rather than add to it, in which case it
      collapses into p-tau217 and adds no value. Single-cohort finding.
    falsify: >-
      Does circadian period predict decline after adjusting for plasma p-tau217 and baseline tau PET
      (i.e. is the reported independence robust and replicable)? If it collapses into p-tau217, it
      adds nothing as an enrichment variable.
    evidence: observational
    safety: "None; a trial-enrichment biomarker proposal."
    next: "Read the circadian-period paper's adjustment models; check whether a scalable proxy (e.g. a blood-based clock measure) exists."
    sources:
      - "10.1073/pnas.2527236123"
      - "10.1002/alz.71577"
    history:
      - date: 2026-10-28
        note: "Created on combination-timing night from the circadian-period prognostic signal; framed as trial enrichment, connecting to the trial-design night's power problem."
      - date: 2026-11-13
        note: >-
          Frontier-scan revisit - PARKED. Checked the anchor paper directly (PNAS 2026,
          10.1073/pnas.2527236123; 135 people, 119 followed): the progression model (longest-period
          fifth, HR 4.41, 95% CI 1.52-12.83) adjusted for demographics, comorbidities, medication and
          APOE but NOT for plasma p-tau217, amyloid status or baseline severity, and names no
          replication cohort - so "independent of pathology" is not shown. The marker also cannot
          scale (skin biopsy, weeks of cell culture, no published test-retest), and 2026 data lean
          against a causal circadian story: chronotype is null for Alzheimer's in a 443,906-person
          cohort (10.1177/13872877261498357) and rest-activity links to p-tau217 did not survive
          multiple-testing correction in a 164-person actigraphy study (10.1007/s11357-026-02645-6)
          (both as reported by tonight's review, not independently checked). Reopen only if the
          authors report the model with p-tau217 and baseline severity added (hazard ratio still
          above 2, interval excluding 1), or an independent cohort replicates.

  - id: distance-to-tipping-point-signal
    title: "A personal distance-to-tipping-point signal, fusing network reserve with pathology-accumulation rate"
    created: 2026-10-29
    lens: earliest-signal
    goal: detect
    status: new
    mechanism: >-
      Fuses two catalogue ideas - reserve-as-redundancy-threshold (a measured network-redundancy
      reserve) and clearance-threshold-onset (onset as a tipping point). Instead of a static
      biomarker, estimate how close a person is to their personal basin boundary by combining how
      much reserve/redundancy their network still has with how fast pathology is currently
      accumulating - a dynamic early signal that is closer to the disease's dynamics than any single
      snapshot marker, aimed at the question of who will NOT progress.
    novelty: >-
      Both components are catalogue ideas; fusing them into a dynamic margin-to-tipping-point score
      is new. The research shows why it is unproven: critical-slowing-down / tipping-point early-
      warning signals have essentially NO human Alzheimer's precedent (the early-warning literature
      is ecology/climate/mood), and connectome redundancy predicting non-progression is unsupported-
      but-open.
    against: >-
      Neither ingredient is validated in humans: no cohort shows rising variance/autocorrelation
      before cognitive decline (possibly because cognition is sampled too sparsely to see it), and
      no study shows a redundancy metric predicting stability at matched pathology. Worse, p-tau217
      plus a cognitive test already captures most predictable risk, and added signals buy only
      ~1-3% AUC - so a complex composite may add nothing over the cheap marker.
    falsify: >-
      In a longitudinal cohort with connectomes and serial amyloid/tau, does a redundancy-plus-rate
      composite predict cognitive stability at matched pathology BEYOND plasma p-tau217? If it adds
      no discrimination over p-tau217 on external validation, the fusion is dead.
    evidence: observational
    safety: "None; an analysis and early-signal proposal."
    next: "Define the redundancy metric and the rate estimate; check for any cohort with connectomes + serial PET to test added value over p-tau217."
    sources:
      - "10.1016/j.ynirp.2025.100255"
      - "10.1038/s41591-025-03565-2"
      - "10.1002/dad2.70321"
    history:
      - date: 2026-10-29
        note: "Created on earliest-signal night by fusing reserve-as-redundancy-threshold + clearance-threshold-onset; the research puts both components at hypothesis stage (no human tipping-point or redundancy-prediction evidence)."
      - date: 2026-11-12
        note: >-
          CORRECTION to the 2026-10-29 statement that early-warning signals have "essentially no
          human Alzheimer's precedent". More precisely: (a) generic resilience indicators have small,
          mixed-direction human precedents in ageing and frailty (Gijzel 2017, PMID 28475664; Rector
          2021, 10.1016/j.exger.2021.111341; Pyrkov 2021, 10.1038/s41467-021-23014-1); (b) STATIC
          elevated cognitive variability is a replicated human correlate of amyloid and tau - about
          10% more variable reaction times in amyloid-positive cognitively normal 70-year-olds with
          similar mean speed (Lu 2020, 10.1002/dad2.12076, checked), and month-to-month variability
          tracking tau PET (Jutten 2024, 10.1037/neu0000928); but (c) nobody has shown variance or
          autocorrelation RISING within a person before a cognitive transition, and the ADNI
          "early-warning" paper (10.1002/qub2.86) is a population-distribution mathematical method,
          not a clinical test. Two explanations now stand side by side: sampling too sparse to see it
          (quantified in scripts/resilience_probe_2026_11_12.py: autocorrelation is invisible at
          clinic-visit spacing) and the WRONG EXPECTED SIGN - ageing brains show shorter neural
          timescales (Wu & Gollo 2025, 10.1038/s42003-025-07517-x) and preclinical-model mice show
          less behavioural variability (Ehret 2023, 10.1016/j.biopsych.2023.04.009). See
          early-warning-direction-test.

  - id: passive-circadian-early-signal
    title: "A passive wearable sleep-regularity signal, validated against the intrinsic circadian-period marker"
    created: 2026-10-29
    lens: earliest-signal
    goal: detect
    status: killed
    mechanism: >-
      Fuses two catalogue ideas - sleep-regularity-vs-duration and circadian-period-enrichment. Use a
      passive, cheap, at-scale wearable sleep-regularity index as the earliest signal, and validate
      it against the expensive but prognostic intrinsic cellular circadian-period marker - the lab
      marker anchoring the wearable one. Two large UK Biobank analyses already tie low sleep
      regularity to incident dementia.
    novelty: >-
      Both components are catalogue ideas; fusing a scalable wearable signal with a lab circadian-
      period anchor, and testing it against pathology rather than diagnosis, is the contribution.
    against: >-
      The regularity-dementia link may be reverse causation (early pathology fragments rhythms),
      and the two UK Biobank analyses disagree on shape (U-shaped vs near-linear); no study runs a
      clean head-to-head showing regularity beats mean sleep duration, or shows it predicts amyloid/
      tau PET rather than a dementia diagnosis. Mendelian randomization is largely null for sleep
      traits causing AD, so the whole causal premise is shaky.
    falsify: >-
      Does the wearable regularity index predict amyloid/tau PET (not just dementia diagnosis), beat
      mean sleep duration head-to-head in one model, and track the intrinsic circadian-period marker?
      If it only tracks diagnosis (reverse causation) and does not beat duration, the fusion is dead.
    evidence: observational
    safety: "None; a passive-measurement and validation proposal."
    next: "Find a cohort with wearable regularity (SRI) plus amyloid/tau PET; run SRI vs mean duration head-to-head against pathology."
    sources:
      - "10.1212/wnl.0000000000208029"
      - "10.1186/s12889-025-21649-z"
      - "10.1073/pnas.2527236123"
    history:
      - date: 2026-10-29
        note: "Created on earliest-signal night by fusing sleep-regularity-vs-duration + circadian-period-enrichment; bounded by the no-head-to-head-vs-duration gap and the null sleep-trait MR."
      - date: 2026-11-22
        note: "KILLED on the red-team night. This idea fused two others, and both have since failed their own tests: the cell-clock marker meant to anchor it was parked on 2026-11-13 (its key result was unadjusted for the main disease markers, unreplicated and not scalable), and sleep regularity was parked on 2026-11-19 (the weakest and least consistent rhythm predictor, with the direction of cause leaning to consequence). Its own kill clause is met as far as evidence exists: in the one cohort that tested rhythm measures against later amyloid imaging, regularity and sleep duration did not predict it (10.1001/jamaneurol.2024.1755, as reported on 2026-11-19), and no study shows regularity beating duration. Nothing remains to validate against."

  - id: nonprogressor-rate-plus-synapse
    title: "A two-marker non-progressor test: where you are (synaptic integrity) plus where you are going (tau rate)"
    created: 2026-10-29
    lens: earliest-signal
    goal: detect
    status: parked
    mechanism: >-
      Fuses two catalogue ideas - synaptic-reversal-endpoint (synaptic-integrity markers, the best
      single discriminator of progressors from non-progressors) and identify-autocatalysis-rate (a
      personal tau-accumulation rate estimated from serial scans, which tonight's model shows is
      recoverable when real). Pair a static "where you are" readout (synaptic integrity, e.g. the
      CSF YWHAG:NPTX2 ratio) with a dynamic "where you are going" readout (personal tau rate) to
      identify amyloid-positive people who will stay stable.
    novelty: >-
      Each component is a catalogue idea; combining a synaptic-level snapshot with a personal
      accumulation-rate estimate as a non-progressor classifier is the contribution, and it directly
      targets the lens's hardest question (who will not progress despite amyloid).
    against: >-
      Synaptic-integrity ratios already add the most independent variance of any marker (Oh 2025),
      so the tau-rate term may add little once the synaptic marker is in; the 1-3% AUC ceiling for
      added signals applies; "non-progressor" is confounded by lead-time and circular definitions
      (Ourry 2026); and the personal tau-rate estimate needs two-plus scans, which is costly and
      noisy in practice.
    falsify: >-
      In a cohort with CSF synaptic markers and serial tau, does adding the personal tau-rate term
      improve non-progressor prediction BEYOND the synaptic marker alone, on external validation? If
      the synaptic marker alone does as well, the rate term (and the fusion) adds nothing.
    evidence: observational
    safety: "None; a risk-stratification proposal, not a treatment."
    next: "Check whether any cohort pairs CSF synaptic markers with serial tau-PET so the added value of a rate term over the synaptic marker can be tested."
    sources:
      - "10.1038/s41591-025-03565-2"
      - "10.1038/s41591-022-02049-x"
      - "10.1038/s41467-026-71732-1"
    history:
      - date: 2026-10-29
        note: "Created on earliest-signal night by fusing synaptic-reversal-endpoint + identify-autocatalysis-rate; grounded in Oh 2025 (synaptic markers best discriminator) and tonight's identifiability result (tau rate recoverable when real)."
      - date: 2026-11-21
        note: "Revisited on the resilience night: PARKED as stated; the surviving half is carried forward. The rate half is weak. In 761 amyloid-positive people, baseline tau imaging was a much stronger determinant of later decline than the change in tau imaging, whose contribution was marginal (10.1002/alz.70435, abstract checked), and blood-marker slopes did not beat baseline levels (10.1001/jamaneurol.2025.2974, as reported). Published scan precision implies a two-year personal rate is 20-60% real signal at best. Our model (scripts/nonprogressor_two_marker_2026_11_21.py) shows why: most of what a second scan adds is a better fix on the level, and unless people differ a lot in their rates the rate itself adds almost nothing. The synaptic half stands but is thin: one spinal-fluid ratio, hazard ratio 3.0 per SD for conversion in 168 unimpaired people with both pathologies (10.1038/s41591-025-03565-2, abstract checked), no reliability data, and it does not work in blood. No study has combined the two. Successors: level-twice-before-rate and slow-wave-power-reserve-marker."

  - id: down-syndrome-condensed-window-trial
    title: "Use Down syndrome's condensed, near-deterministic cascade as the fastest test of very-early amyloid lowering"
    created: 2026-10-30
    lens: frontier-scan
    goal: slow
    status: new
    mechanism: >-
      APP triplication makes amyloid near-universal in Down syndrome, and new data show the tau
      cascade is "condensed" - p-tau217 and tau-PET turn positive almost simultaneously ~4-6 years
      after amyloid, versus a longer latency in neurotypical adults. That near-deterministic,
      time-compressed trajectory makes Down syndrome the population where whether very-early amyloid
      lowering prevents the tau phase can be answered fastest and with the most statistical power.
      The first dedicated anti-amyloid trial in Down syndrome (donanemab, ALADDIN) is now registered.
    novelty: >-
      ALADDIN exists; the contribution is framing Down syndrome's condensed window as the decisive,
      fastest prevention read for the whole field, and tying the trial's value to whether amyloid
      lowering can still open space before tau co-emerges within that 4-6 year window.
    against: >-
      Cerebral amyloid angiopathy and ARIA risk are elevated in Down syndrome, raising the safety
      bar; the condensed window may mean that by the time anyone is identified, tau has already
      co-emerged and amyloid lowering is too late; and co-pathologies are common in Down syndrome
      autopsy, muddying a pure-amyloid readout. Consent and trial-design ethics are also harder.
    falsify: >-
      ALADDIN (donanemab, NCT06911944) or the ABATE anti-amyloid vaccine (NCT05462106): does
      lowering amyloid in Down syndrome delay the onset of tau-PET/p-tau217 positivity and cognitive
      decline? No delay in the tau phase despite amyloid clearance would be strong evidence that, at
      least in this near-deterministic setting, removing amyloid does not open a treatment window.
    evidence: RCT
    safety: >-
      ARIA and cerebral amyloid angiopathy risk are elevated in Down syndrome; dedicated dosing and
      safety data are needed, and this population warrants extra consent and ethics care. Not medical
      advice.
    next: "Watch NCT06911944 (ALADDIN) status and NCT05462106 (ABATE DS arm); note whether either reports a tau-phase/downstream readout, not just amyloid change."
    sources:
      - "10.1093/brain/awaf428"
      - "10.1002/alz.71404"
      - "10.1002/alz.71738"
    history:
      - date: 2026-10-30
        note: "Created on frontier-scan night (Down syndrome / autosomal-dominant constraint), from the condensed-tau-cascade finding (Brain 2026, PMID 41240365) and the first DS anti-amyloid trials now registering."

  - id: beta-synuclein-ultra-early-signal
    title: "Serum beta-synuclein as a presynaptic signal that may precede p-tau217 by ~two decades"
    created: 2026-10-30
    lens: frontier-scan
    goal: detect
    status: killed
    mechanism: >-
      In Down syndrome, serum beta-synuclein (a presynaptic protein) was reported elevated about two
      decades before symptoms, rising before p-tau217, NfL and GFAP, and linked to atrophy,
      hypometabolism and worse memory. If that ordering holds, beta-synuclein could be an
      ultra-early synaptic signal - earlier than the current blood front-runner - and a cheap blood
      readout of the synaptic dysfunction that tracks cognition.
    novelty: >-
      New (2026-09) and cross-sectional; the contribution is testing whether beta-synuclein is
      genuinely earlier than p-tau217 within individuals and adds value over the dominant predictors
      (age, p-tau217), rather than just correlating.
    against: >-
      Cross-sectional, single cohort (n=131), Down syndrome-specific; in Down syndrome, chronological
      age outperforms biomarkers as a predictor, and p-tau217 already dominates - so beta-synuclein
      may add little independent value. Beta-synuclein is also not AD-specific (a general synaptic
      marker).
    falsify: >-
      Longitudinally and in sporadic AD, does serum beta-synuclein rise before p-tau217 within the
      same individuals, and does it improve prediction beyond age plus p-tau217? If it does not
      precede p-tau217 or adds nothing over age+p-tau217, it is not the earlier signal claimed.
    evidence: observational
    safety: "None; a blood-marker hypothesis."
    next: "Check for any longitudinal beta-synuclein data (DS or sporadic) testing temporal order vs p-tau217 and added value over age+p-tau217."
    sources:
      - "10.1002/alz.71860"
      - "10.1002/alz.71661"
      - "10.1038/s41591-025-03565-2"
    history:
      - date: 2026-10-30
        note: "Created on frontier-scan night from the DS serum beta-synuclein finding (Alz&Dem 2026, PMID 42768868); bounded by the age-dominates-prediction caveat (PMID 42449194)."
      - date: 2026-11-25
        note: "KILLED on the inversion night: the claim that this marker rises before the standard tau marker does not survive. (1) In inherited Alzheimer's, where timing can be placed against expected onset, it starts to rise about 11 years before symptoms and after amyloid (10.1002/alz.70146, abstract checked); the same paper puts spinal-fluid p-tau217 about 5 years earlier still (as reported from the full text). (2) In ordinary late-onset disease it has never been timed against p-tau217, and two analyses of one cohort found no rise in amyloid-positive people without symptoms (as reported). (3) The two-decade lead came from one cross-sectional study of 131 people that dated each marker by when patient and control curves separate; the marker was already raised in patients without amyloid. Our simulation (scripts/marker_order_artifact_2026_11_25.py) shows that method reports a lead of ten years or more in 43% of studies when one marker carries such an offset and both truly rise at the same age. (4) No study shows it adds to prediction beyond p-tau217; all blood results come from one laboratory's assay, whose run-to-run variation (about 10%) is as large as a year's change. What remains - a marker of synapse or nerve-cell injury that rises with tau - is not the early signal claimed."

  - id: resilience-downstream-effector
    title: "Target the downstream glial/vascular effector of resilience variants, not the variant itself"
    created: 2026-10-30
    lens: frontier-scan
    goal: slow
    status: new
    mechanism: >-
      The 2026 mechanistic burst around the APOE3-Christchurch and RELN-COLBOS resilience variants
      points to protection acting DOWNSTREAM - through microglial, vascular and hepatic/lipid effects
      and an oligogenic combination - rather than through the rare coding change itself. If the
      protective output is a druggable cell state or pathway, mimicking that downstream effector
      could confer resilience without needing the variant.
    novelty: >-
      Night 1 logged resilience-mimicry ideas (e.g. FN1); the contribution here is the reframing that
      the DRUGGABLE node is the shared downstream effector (a microglial/vascular state), supported by
      the recent mechanism papers, not the upstream variant.
    against: >-
      "Oligogenic" and "downstream burst" mean there may be no single effector to target; the
      mechanism work is preclinical/iPSC/plasma-EV; and the human protection from the heterozygous
      Christchurch variant was only modest (a ~5-year delay in carriers), so even a faithful mimic
      might buy little.
    falsify: >-
      In a model, does reproducing the proposed downstream state (e.g. the Christchurch-like
      microglial program) confer protection WITHOUT the variant? If mimicking the effector does not
      reproduce protection, the "downstream effector is the druggable node" claim fails.
    evidence: preclinical
    safety: >-
      Manipulating microglial/vascular states carries real risk (trained immunity is double-edged;
      vascular changes can harm). Preclinical only; not medical advice.
    next: "Pull the 2026 Christchurch/RELN mechanism papers; identify whether a single downstream effector (microglial state, Wnt/Dkk1, lipid pathway) recurs across them."
    sources:
      - "10.1016/j.cell.2023.11.029"
      - "10.1038/s41591-023-02318-3"
    history:
      - date: 2026-10-30
        note: "Created on frontier-scan night from the 2026 APOE3-Christchurch / RELN-COLBOS mechanism burst (resilience looks downstream, glial/vascular, oligogenic, potentially druggable)."

  - id: trained-immunity-net-sign
    title: "Resolve whether peripheral immune training is net-protective or net-harmful for AD pathology"
    created: 2026-10-31
    lens: modeling
    goal: understand
    status: new
    mechanism: >-
      The human signal (adult vaccines associated with less dementia) and the key preclinical
      experiment point in opposite directions: peripheral innate-immune TRAINING worsened cerebral
      amyloidosis in mice while immune TOLERANCE alleviated it (Wendeln 2018). Since the whole
      vaccine-trained-immunity program and tonight's predator-prey "peripheral reinforcement helps"
      assumption both rest on peripheral immune activation being net-protective, the sign of that
      effect is the decisive go/no-go.
    novelty: >-
      The clash between Wendeln's harmful training and the protective human vaccine epidemiology is
      known but unreconciled; framing it as the single decisive test that gates both the vaccine idea
      and the clearance-reinforcement modeling is the contribution.
    against: >-
      May be irreducibly context-dependent (training dose, timing, stimulus, amyloid vs tau, mouse vs
      human), so there may be no single "sign"; mouse amyloidosis models translate poorly; and the
      human evidence is confounded (healthy-vaccinee bias), so neither side is clean.
    falsify: >-
      A preclinical study varying training stimulus, dose and timing with amyloid AND tau AND
      cognition readouts, or a human mechanistic (not epidemiological) test of whether a defined
      immune-training exposure raises or lowers pathology. A consistently harmful result kills
      vaccine-trained-immunity; a consistently protective one rescues it and fixes the model's sign.
    evidence: preclinical
    safety: >-
      Directly relevant: if training is net-harmful, immune-activating prevention strategies could
      accelerate pathology - a reason to settle the sign before any trial. Not medical advice.
    next: "Pull Wendeln 2018 and any follow-ups varying training timing/dose; map where protective vs harmful training diverge."
    sources:
      - "10.1038/nature25158"
      - "10.1038/s41586-025-08800-x"
      - "10.7554/eLife.106037"
    history:
      - date: 2026-10-31
        note: "Created on the modeling night (peripheral-immune constraint); the Wendeln-vs-vaccine-epidemiology sign clash is the crux, and it also decides the sign of the predator-prey model's peripheral term."

  - id: sargramostim-above-baseline-replication
    title: "Replicate sargramostim/GM-CSF's rare above-baseline cognitive gain, properly powered and with a durability readout"
    created: 2026-10-31
    lens: modeling
    goal: reverse
    status: parked
    mechanism: >-
      Most peripheral-immune interventions in AD failed (etanercept, IVIG), but a small phase-2 RCT of
      sargramostim (GM-CSF) produced a rare signal of genuine IMPROVEMENT above a patient's own
      baseline - MMSE rose ~1.45 points within-group over three weeks - plausibly by mobilising innate
      immunity toward clearance or trophic support. Because above-baseline improvement is almost
      unheard of in AD, this specific signal is worth a properly powered replication with a durability
      and mechanistic readout.
    novelty: >-
      The Potter trials exist; the contribution is isolating the above-baseline-improvement signal
      (not slowed decline) as the thing to replicate, and pairing it with a synaptic/mechanistic
      readout and longer follow-up to test whether the gain is real and durable.
    against: >-
      The signal is fragile: n=40, three-week dosing, a baseline MMSE imbalance that made the
      placebo-adjusted result non-significant after adjustment, a transient ADAS-Cog worsening, and no
      effect on CDR-SB/Trails - classic small-trial noise. The broader peripheral-immune trial record
      is discouraging, and GM-CSF broadly activates immunity (see the net-sign worry).
    falsify: >-
      A larger, longer sargramostim RCT: does the above-baseline MMSE gain replicate and persist
      beyond the dosing window? No replication, or a gain that vanishes after dosing stops, kills it.
    evidence: RCT
    safety: >-
      GM-CSF is immune-activating (injection-site and inflammatory effects) and, given the trained-
      immunity net-sign uncertainty, could in principle aggravate pathology - monitoring required. Not
      medical advice.
    next: "Read the Potter 2021 trial and the 2026 follow-up in full; check whether a larger sargramostim AD RCT is registered or reporting."
    sources:
      - "10.1002/trc2.12158"
      - "10.1056/NEJMoa2212948"
    history:
      - date: 2026-10-31
        note: "Created on the modeling night (peripheral-immune constraint); the one above-baseline cognitive gain in the peripheral-immune record, flagged for replication, with its fragility recorded."
      - date: 2026-11-20
        note: "PARKED 2026-11-20 after reading the trial's own posted results (registry NCT01409915, checked directly). The memory-screen gain was a fading step: 17.10 at baseline, 18.55 at the end of three weeks of treatment, 18.00 at 45 days and 17.10 at 90 days, in a drug group that started lower than placebo (17.10 versus 20.75). The fuller cognitive scale moved the wrong way on drug (43.2 to 47.7 at 45 days; placebo flat) and so did the clinical rating. That is not an above-baseline gain worth replicating as such. A six-month follow-up trial (NCT04902703, about 42 people) is due to complete at the end of November 2026; re-open only if it shows a lasting gain on more than one scale."

  - id: clearance-vs-production-rate-limiting
    title: "Settle whether amyloid clearance is even rate-limiting before betting on clearance-boosting"
    created: 2026-10-31
    lens: modeling
    goal: understand
    status: new
    mechanism: >-
      A whole family of ideas here (clearance-threshold-onset, the predator-prey model, peripheral-
      immune and glymphatic boosting) assumes that raising clearance can control pathology. But
      preclinical work shows plaques persist even when microglia are ablated (clearance may not be
      rate-limiting for plaque maintenance), while human kinetic studies show impaired clearance in
      sporadic disease - a real tension. Which step is rate-limiting, production/seeding or clearance,
      decides whether any clearance-boosting strategy can work.
    novelty: >-
      The production-vs-clearance question is old, but the specific tension between "clearance not
      rate-limiting for maintenance" (Grathwohl 2009) and "clearance deficit in sporadic AD"
      (Mawuenyega 2010) is unresolved; making it an explicit gate on the repo's clearance-centric
      ideas is the contribution.
    against: >-
      May be stage-dependent (clearance matters for onset, production for maintenance), so the
      dichotomy could be false; the mouse ablation and human kinetic studies measure different things
      (maintenance vs flux), so they may not actually conflict.
    falsify: >-
      A human stable-isotope-kinetic (SILK-type) comparison across stages: is the amyloid imbalance
      driven by production/seeding or by clearance, and does it shift with stage? If clearance is not
      rate-limiting at the stage a therapy targets, clearance-boosting (and the model's clearance
      knob) cannot help there.
    evidence: preclinical
    safety: "None; a mechanistic/kinetic question."
    next: "Reconcile Grathwohl 2009 (plaques persist without microglia) with Mawuenyega 2010 (clearance deficit); find any staged human kinetic data."
    sources:
      - "10.1038/nn.2432"
      - "10.1126/science.1197623"
    history:
      - date: 2026-10-31
        note: "Created on the modeling night; the peripheral-immune scan's point that microglia may not be rate-limiting for plaque maintenance puts the whole clearance-centric line (including tonight's model) in question."

  - id: treat-to-target-proximal-biomarker
    title: "Borrow HIV/oncology treat-to-target, but aim at a proximal biomarker (tau/p-tau217), not amyloid"
    created: 2026-11-01
    lens: cross-domain
    goal: slow
    status: parked
    mechanism: >-
      HIV turned fatal into chronic by hitting an obligate step with combinations and treating to a
      quantified target (viral load); oncology adds measure/combine/adapt. The transferable move for
      symptomatic Alzheimer's is treat-to-target with adaptive combinations - but against a PROXIMAL
      marker that tracks the lesion, namely tau/p-tau217, rather than amyloid, since clearing amyloid
      to near-zero barely changes cognition while tau tracks atrophy and decline.
    novelty: >-
      Treat-to-target is standard in HIV and lipidology; applying it to AD with p-tau217 as the
      target (explicitly not amyloid) and an adaptive combination design is the contribution. Current
      trials enrich by tau stage but do not treat-to-a-tau-target or adapt.
    against: >-
      p-tau217 is a validated READOUT, not a validated TARGET: lowering it may not change cognition,
      exactly the trap amyloid fell into (amyloid cleared, cognition barely moved). No drug reliably
      lowers tau with proven clinical benefit yet, and tonight's model shows a hard symptomatic-stage
      ceiling that no target-hitting can lift. Combination also compounds toxicity (ARIA).
    falsify: >-
      Trial-level surrogacy test: across trials, does the treatment effect on p-tau217 predict the
      treatment effect on cognition? If lowering p-tau217 does not track cognitive benefit (as
      amyloid lowering did not), treat-to-target on p-tau217 is as hollow as on amyloid and the idea
      fails.
    evidence: observational
    safety: >-
      Combination anti-amyloid/anti-tau regimens compound ARIA and bleeding risk; a treat-to-target
      rule must not push dosing past safety. Not medical advice.
    next: "Check whether treatment effects on p-tau217 and on cognition have been correlated across trials (trial-level surrogacy), the way the amyloid-cognition surrogacy was tested."
    sources:
      - "10.1056/NEJMoa2212948"
      - "10.1001/jama.2023.13239"
      - "10.1093/brain/awz321"
    history:
      - date: 2026-11-01
        note: "Created on cross-domain night (symptomatic constraint); the cross-domain scan's single most transferable principle (HIV treat-to-target + oncology measure/combine/adapt, aimed at a proximal marker)."
      - date: 2026-11-06
        note: >-
          Red-team DOWNGRADE, new -> parked. The distinctive claim - that steering a tau number
          (p-tau217) steers cognition - does not survive. p-tau217 is a validated diagnostic/prognostic
          READOUT, never a validated treatment surrogate (no trial-level surrogacy analysis exists for
          it), and the sharpest available data point the wrong way: the drug that most cleanly lowered
          tau still missed cognition with the best signal at the LOWEST dose (diranersen/CELIA; see
          evidence/claims.yaml `diranersen`), and N-terminal/aggregated-tau antibodies engaged tau with
          no cognitive benefit (gosuranemab, semorinemab/LAURIET, tilavonemab, zagotenemab). This is
          amyloid's hollow surrogacy (Ackley 2021, 10.1136/bmj.n156) recurring one marker inward. The
          winners that DID lower p-tau217 (lecanemab 10.1056/NEJMoa2212948, donanemab
          10.1001/jama.2023.13239) are anti-amyloid, confounding tau-lowering with upstream amyloid
          removal, and none shows the p-tau217 change SIZE predicts the cognition change size. Survivable
          kernel spun out as biomarker-futility-gate-platform (use the marker as an enrichment and
          go/no-go DROP rule, never to graduate an arm). The decisive prospective test (does maximal tau
          lowering help) is DIAN-TU Tau NexGen, NCT05269394, not yet read out."

  - id: reversible-ceiling-staging
    title: "Estimate each patient's reversible-vs-banked deficit and set trial endpoints to the reachable ceiling"
    created: 2026-11-01
    lens: cross-domain
    goal: reverse
    status: new
    mechanism: >-
      Hepatology, cardiology and MS reverse because the damaged tissue is in a remodellable
      compartment; symptomatic Alzheimer's also carries an irreversible compartment (lost neurons)
      with no regrowth analog. Split a patient's deficit into a reversible part (synapse, inflammation,
      perfusion, myelin) and a banked irreversible part (neuron loss), estimate the personal reversible
      ceiling, and set trial endpoints to that ceiling instead of expecting full reversal.
    novelty: >-
      The reversible/irreversible compartment split is conceptually known; computing a per-person
      reversible ceiling as an explicit trial-design and endpoint-setting tool, and powering reversal
      trials against it, is the contribution. Tonight's model (scripts/reversible_ceiling_2026_11_01.py)
      makes the ceiling concrete: achievable recovery falls the later treatment starts.
    against: >-
      No validated in-vivo way to measure the reversible fraction exists - synaptic density (SV2A-PET)
      has never been shown to rise with therapy (prior night), and separating reversible load from
      banked neuron loss may be unidentifiable from available markers. If you cannot measure the
      ceiling, you cannot set endpoints to it.
    falsify: >-
      Can the reversible fraction (e.g. synaptic/inflammatory markers) and the banked fraction (NfL,
      atrophy, neuron-loss proxies) be estimated from available biomarkers, and does the estimated
      ceiling predict the improvement actually achieved in a trial? If the split does not predict
      achievable recovery, it is not a usable design tool.
    evidence: in-silico
    safety: "None; a trial-design and endpoint-setting proposal. Must not promise patients reversal beyond the measured ceiling."
    next: "List candidate reversible-compartment markers (synaptic, perfusion, inflammation) and banked-damage markers (NfL, atrophy); check whether their ratio predicts response in any trial."
    sources:
      - "10.1523/jneurosci.16-14-04491.1996"
      - "10.1002/alz.12097"
    history:
      - date: 2026-11-01
        note: "Created on cross-domain night from the reversible-ceiling model and the cross-domain lesson that every reversal analogy fails on AD's irreversible neuron loss."
      - date: 2026-11-18
        note: "Cross-domain note 2026-11-18: eye medicine shows the same split in one organ - drugs reverse the active leaking form of macular degeneration and restore vision, while in the cell-death form they only slow spread - and fields that could not regrow tissue (hearing, movement disorders) succeeded by replacing a simple lost signal, not the cells. That suggests one way to measure the reachable ceiling: the part of a deficit carried by broadcast signals (acetylcholine, noradrenaline, arousal) is replaceable; the part carried by lost wiring is not."

  - id: fn1-staged-reversal-test
    title: "Run the missing staged experiment: does lowering fibronectin AFTER established pathology reverse it?"
    created: 2026-11-01
    lens: cross-domain
    goal: reverse
    status: new
    mechanism: >-
      The FN1-at-the-barrier work showed that preventing fibronectin rise protects the blood-brain
      barrier, but never tested lowering fibronectin once deposition is established. Borrowing the
      hepatology question (does the ECM regress when you remove the driver?), the decisive experiment
      is to lower fibronectin - genetically or with an assembly inhibitor (pUR4/FUD) - in aged
      APOE4-knock-in mice that ALREADY have established deposition, and ask whether the barrier leak
      and deposition reverse.
    novelty: >-
      This is exactly the experiment the 2026 paper did not do (its aged, chronically-affected mice
      got no FN1 intervention); it converts an open factual gap into a single decisive test, and
      imports the fibrosis-reversal framing from hepatology.
    against: >-
      Established extracellular-matrix may not remodel in the brain the way liver fibrosis does (the
      cross-domain caution: AD's defining lesion does not regrow); fibronectin is systemically
      essential, so lowering it risks bleeding/fibrosis; and pUR4/FUD CNS delivery is unproven.
    falsify: >-
      The experiment is its own test: lower fibronectin after established deposition in aged APOE4
      mice. No reversal of barrier leak/deposition means FN1 is a prevention-only lead, closing the
      reversal version of fn1-clearance-restore.
    evidence: preclinical
    safety: >-
      Preclinical; any eventual translation carries fibronectin's systemic essentiality (clotting,
      wound healing). Not medical advice.
    next: "Specify the staged protocol (establish deposition in aged APOE4-KI, then FN1-lower with pUR4/FUD or inducible knockdown, read barrier leak + deposition); check if any group has data."
    sources:
      - "10.1038/s43587-026-01204-0"
      - "10.1007/s00401-024-02721-1"
    history:
      - date: 2026-11-01
        note: "Created on cross-domain night, spun out of the fn1-clearance-restore revisit once the 2026 paper was found to test prevention only; the staged establish-then-treat test is the decisive missing experiment."

  - id: target-the-leverage-node-not-the-root
    title: "Search approved drugs by the modifiable-genetics node (microglia/immune), not the causal root (amyloid)"
    created: 2026-11-02
    lens: causal-chain
    goal: slow
    status: new
    mechanism: >-
      Common-variant genetics puts the dominant MODIFIABLE Alzheimer's signal in microglial/immune
      genes (TREM2, PLCG2, INPP5D, MS4A, ABI3, SPI1, BIN1); amyloid overproduction is the causal root
      only in autosomal-dominant disease, and APOE is the single largest effect. So the causal root
      (amyloid) is not the highest-yield drug target, which is why anti-amyloid gives real-but-capped
      benefit. The idea is to prioritise the search for approved/repurposable drugs by the modifiable
      genetic node - microglial state and lipid/APOE biology - rather than by amyloid clearance.
    novelty: >-
      The microglial-genetics story is well known; the contribution is making it the explicit SEARCH
      STRATEGY for approved-drug repurposing (screen drug targets that are microglial/immune-expressed
      and genetics-supported), rather than defaulting to the amyloid axis.
    against: >-
      The strongest microglial target (TREM2 agonism) has no approved drug and AL002 failed Phase 2;
      "microglial state" is a continuum, hard to drug cleanly, and training can worsen pathology
      (Wendeln 2018); tonight's cascade model also showed which node you hit matters far less than how
      early you start.
    falsify: >-
      Screen approved-drug targets by microglial/immune expression plus drug-target MR support; if the
      resulting candidates do not out-rank amyloid-axis candidates on causal genetic evidence, the
      node-prioritisation adds nothing over the status quo.
    evidence: observational
    safety: "None for the search strategy; any resulting drug carries its own risks (immune modulation is double-edged)."
    next: "Rank microglial/immune and lipid drug targets by drug-target MR + colocalization on open data (see drug-target-MR-pipeline)."
    sources:
      - "10.1038/s41588-022-01024-z"
      - "10.1038/nature25158"
    history:
      - date: 2026-11-02
        note: "Created on causal-chain night; genetics (Bellenguez 2022) plus tonight's cascade model both say the causal root is not the highest-yield target - the modifiable signal is microglial/immune."

  - id: ace-inhibitor-ad-pharmacovigilance
    title: "Test whether ACE-inhibitor use raises Alzheimer's risk (drug-target MR says lower ACE = higher risk)"
    created: 2026-11-02
    lens: causal-chain
    goal: understand
    status: new
    mechanism: >-
      Drug-target Mendelian randomization with colocalization reports that genetically LOWER ACE (what
      ACE inhibitors pharmacologically mimic) is associated with HIGHER Alzheimer's risk, independent
      of blood pressure, in both blood and brain. If that causal direction is real, the very common
      ACE-inhibitor class could be a modifiable risk factor, and the actionable move is a
      pharmacovigilance test, not a therapy.
    novelty: >-
      A harm signal, not a benefit one - the opposite of most repurposing hunts. The MR/coloc direction
      is published; turning it into an active-comparator pharmacovigilance test (ACE inhibitors vs
      angiotensin-receptor blockers) on claims data is the contribution.
    against: >-
      MR direction can be confounded by pleiotropy; brain and blood ACE differ, and ACE has many
      substrates (including amyloid-degrading activity) so the mechanism is not clean; observational
      ACEi-vs-dementia data are mixed, and an active-comparator analysis may show no excess.
    falsify: >-
      Active-comparator new-user claims analysis, ACE inhibitors vs angiotensin-receptor blockers,
      with negative-control outcomes, for incident Alzheimer's. No excess risk with ACEi vs ARB means
      the MR direction does not translate to the drug.
    evidence: observational
    safety: >-
      This is a safety/harm hypothesis about a widely used drug class; it must NOT be read as advice
      to start or stop any medication - only as a signal to test. Not medical advice.
    next: "Confirm the MR/coloc direction against its source, then specify the ACEi-vs-ARB active-comparator emulation; check whether published claims analyses already did this."
    sources:
      - "10.1186/s13195-025-01671-4"
      - "10.1038/s41588-022-01024-z"
    history:
      - date: 2026-11-02
        note: "Created on causal-chain night from the repurposing scan's cleanest coloc-backed drug-target MR - whose direction argues AGAINST ACE inhibition, i.e. a potential harm signal worth a pharmacovigilance test."

  - id: drug-target-mr-pipeline
    title: "Stand up an open-data drug-target MR + colocalization pipeline to screen approved drugs for AD"
    created: 2026-11-02
    lens: causal-chain
    goal: understand
    status: new
    mechanism: >-
      The one causal route this project can actually run without any restricted data is drug-target
      cis-Mendelian-randomization plus colocalization: combine an open AD GWAS with open protein/
      expression QTLs to ask, target by target, whether genetically mimicking a drug's effect raises or
      lowers Alzheimer's risk. Built as a repeatable pipeline, it screens approved-drug targets and
      flags both benefit and harm directions (as the ACE example shows).
    novelty: >-
      Drug-target MR is an established method; the contribution is making it a standing, reproducible
      capability of this open repo (the first thing here that outputs a causal estimate rather than a
      hypothesis), with APOE handling and proxy-AD controls baked in.
    against: >-
      A genetic proxy for lifelong lower protein is NOT the same as a drug given late in life
      (magnitude, timing, tissue); plasma and CSF pQTL overlap is low; the APOE region breaks MR and
      must be excluded; proxy-AD GWAS dilute effects. So the pipeline bounds plausibility, it does not
      prove a drug works.
    falsify: >-
      Validate against known controls before trusting it: does it reproduce the expected null for
      statins/HMGCR, the adverse/benefit directions already reported (e.g. ACE), and stable estimates
      with vs without the APOE region? If it cannot recover controls, it is not trustworthy.
    evidence: observational
    safety: "None; a computational capability on summary data. Respects the repo's no-participant-data rule."
    next: "Assemble the open inputs (Kunkle non-proxy + Bellenguez AD GWAS; UKB-PPP + deCODE pQTL; GTEx/eQTLGen/MetaBrain) and TwoSampleMR + coloc; run known-control validation first. Needs owner go-ahead."
    sources:
      - "10.7554/eLife.34408"
      - "10.1038/s41586-023-06592-6"
      - "10.1038/s41588-022-01024-z"
    history:
      - date: 2026-11-02
        note: "Created on causal-chain night; operationalises the open-data causal-inference capability flagged to the owner - the project's first route to an actual causal estimate, using only summary-level data."
  - id: menopause-timed-plasticity-window
    title: "Time regenerative interventions to menopausal stage, not chronological age"
    created: 2026-11-04
    lens: reversal-biology
    goal: understand
    status: new
    mechanism: >-
      Women accumulate tau faster than men at matched amyloid and carry ~2/3 of AD, and the menopausal
      transition - not chronological age - marks a measurable drop in brain glucose metabolism,
      mitochondrial ATP markers and grey-matter volume, with a partial post-menopausal rebound that
      tracks preserved cognition (Mosconi 2021, Sci Rep, 10.1038/s41598-021-90084-y). Rodent
      hippocampal plasticity and new-cell survival are estrogen-gated. Hypothesis: there is a
      menopause-anchored window in which the brain's regenerative/plasticity machinery is transiently
      reopened, and aligning a pro-regenerative intervention to menopausal STAGE would beat
      age-matched dosing - a reason women-specific timing, not just women-specific risk, matters.
    novelty: >-
      Reframes the well-known menopause-AD link as a TIMING lever for reversal/repair rather than a
      risk factor, and makes a falsifiable stage-vs-age prediction. Distinct from estrogen-replacement
      trials (which tested hormone level, not the plasticity-window hypothesis and largely failed on
      timing, e.g. WHIMS late initiation).
    against: >-
      The rebound is observational imaging, not a demonstrated plasticity window; no intervention has
      ever raised a human regenerative readout; estrogen-timing trials (WHIMS) were negative when
      started late, which could mean the window is narrow or illusory; healthy-user and
      reverse-causation confounds are heavy in menopause cohorts.
    falsify: >-
      If a plasticity/synaptic biomarker (SV2A PET, or a validated CSF plasticity marker) shows NO
      menopausal-stage dependence after adjusting for chronological age, the window is illusory and the
      idea dies. Equally, if a stage-matched vs age-matched intervention arm shows no difference.
    evidence: observational
    safety: >-
      The timing hypothesis is testable with imaging/biomarkers before any intervention; any estrogen
      or regenerative intervention carries real risk and must be gated by trial safety. Not medical
      advice.
    next: "Check whether existing menopause-imaging cohorts (open summary level) report stage-resolved plasticity markers; specify a stage-vs-age analysis."
    sources:
      - "10.1038/s41598-021-90084-y"
      - "10.1001/jamaneurol.2017.2188"
    history:
      - date: 2026-11-04
        note: "Created on the reversal-biology / women night; turns the menopause-AD link into a timing-of-repair hypothesis with a stage-vs-age falsification test."
  - id: x-escape-oligodendrocyte-reversal-triage
    title: "Triage open AD omics for X-escape / oligodendrocyte-reactivation genes as a female-specific repair lever"
    created: 2026-11-04
    lens: reversal-biology
    goal: reverse
    status: new
    mechanism: >-
      In aged female mice the normally silent second X chromosome partially reactivates in the
      hippocampus, and a reactivated X-escapee (Plp1) expressed in oligodendrocytes improved cognition
      (Gadek et al. 2025, Sci Adv - mouse); reactivating silenced maternal-X genes reversed some
      deficits (Abdulai-Saiku et al. 2025, Nature, 10.1038/s41586-024-08457-y - mouse); a second X and
      the escapee Kdm6a confer resilience in hAPP mice with a human expression association
      (Davis/Dubal 2020, Sci Transl Med - mouse + human association). Hypothesis: the female brain
      holds a latent, age-triggered regenerative reserve on the inactive X, myelin-linked, with no male
      equivalent - and the tractable first step is a purely computational triage of OPEN AD omics for
      X-escape and oligodendrocyte-reactivation genes whose female-specific expression tracks
      resilience (non-decliners) vs decliners.
    novelty: >-
      The X-escape / second-X-reserve story is new (2020-2025) and almost entirely mouse; no AI agent
      or open project has nominated a sex-specific X-escape / oligodendrocyte AD target (the 2026-11-02
      breadcrumb scan found agents converge on microglial+lipid targets only). The contribution is to
      make it an open-data, in-silico screen this repo can run.
    against: >-
      Everything load-bearing is mouse; human X-reactivation in aged brain is unproven; expression
      associations are not causal; oligodendrocyte/myelin benefits in AD may cap at imaging markers
      (prior nights: structural-marker benefit often fails to reach clinical endpoints). PLP1 is also
      an autoimmune/overexpression-toxicity antigen, so "more PLP1" is not obviously safe.
    falsify: >-
      If female resilient (non-decliner) AD brains show NO enrichment of X-escape / PLP1-axis
      oligodendrocyte expression versus matched female decliners in open datasets, drop it. If the
      signal is present in males equally, the female-specific framing is wrong.
    evidence: in-silico
    safety: >-
      The triage is computational on open summary/omic data (no participant-level data; respects the
      repo rule). Any downstream reactivation intervention is high-risk (tumorigenicity, autoimmunity)
      and far off. Not medical advice.
    next: "Scope an X-escape + oligodendrocyte-reactivation gene list against AMP-AD Agora target nominations and sex-stratified expression; define the resilient-vs-decliner contrast."
    sources:
      - "10.1038/s41586-024-08457-y"
    history:
      - date: 2026-11-04
        note: "Created on the reversal-biology / women night; the night's most surprising finding (aging reactivates the silent second X; a myelin escapee improves cognition in mice) turned into an open-data in-silico screen. Mouse-grounded; human causal data absent."
  - id: silent-engram-recoverable-window
    title: "Stage AD by silenced-but-alive vs dead engrams to define the only window reversal theory allows"
    created: 2026-11-04
    lens: reversal-biology
    goal: reverse
    status: new
    mechanism: >-
      The engram literature says memories held in neurons that are ALIVE but synaptically SILENCED can
      be recovered (optogenetic engram reactivation restores 'lost' memories and spine density in early
      AD mice; Roy/Tonegawa 2016, Nature, 10.1038/nature17172), whereas a memory whose neuron ensemble
      is DEAD is gone. So the only stage theory predicts is reversible is the pre-ensemble-loss window
      when engrams are silenced, not destroyed. Hypothesis: a human staging readout that separates
      silenced-but-recoverable from lost circuitry (e.g. SV2A-PET synaptic density paired with
      cued-retrieval paradigms) would define who is even eligible for a reversal attempt - and tonight's
      toy (scripts/silent_engram_window_2026_11_04.py) shows recoverable benefit is front-loaded and
      collapses as loss overtakes silencing.
    novelty: >-
      Imports the silent-vs-lost engram distinction as a clinical STAGING criterion for reversal
      eligibility - different from existing amyloid/tau staging, which indexes pathology not
      recoverability. Gives the field a concrete unmet endpoint (a human synaptic-density RISE, never
      yet achieved; no therapy has raised SV2A-PET signal in humans, Chen 2018, PMID 30014145).
    against: >-
      Human staging of silenced-vs-lost does not exist and may be impossible if SV2A loss and
      irreversible recall failure are already coincident at earliest detectable disease; the whole
      silent-engram construct is mouse/optogenetic and may not transfer; 'reactivation' has never been
      delivered as a human therapy.
    falsify: >-
      If, at the earliest clinically detectable AD, synaptic loss and irreversible recall failure are
      already coincident (no cue recovers performance), then the recoverable window does not exist in
      humans and the staging idea is moot.
    evidence: none
    safety: "A staging/biomarker concept; no intervention. Not medical advice."
    next: "Specify a silenced-vs-lost staging readout (SV2A-PET + cued retrieval) and check whether any open imaging cohort could test whether the two collapse together at onset."
    sources:
      - "10.1038/nature17172"
    history:
      - date: 2026-11-04
        note: "Created on the reversal-biology / women night and modelled tonight (silent_engram_window toy): recoverable gain is front-loaded and capped by the surviving-neuron ceiling - the 'treat early' wall derived from alive-vs-dead rather than reversible-vs-banked damage."
      - date: 2026-11-20
        note: "2026-11-20: a human readout exists. The free-and-cued recall staging system separates people whose recall is rescued by cues (storage intact) from those whose recall is not. Among amyloid-positive, clinically normal people in a large prevention trial, about 50% sat in the cue-rescued stages and only about 4% in the storage-loss stages (10.1016/j.tjpad.2026.100641, as reported from the full text), so the window this idea asked about does exist in people. No study has linked the stages to synapse imaging or used them to predict treatment response. Continued as cue-rescue-recoverable-window."
  - id: resilience-is-growth-not-topology
    title: "Against an autocatalytic tau spreader, resilience lives in the growth term, not in network firebreaks"
    created: 2026-11-05
    lens: resilience
    goal: understand
    status: investigating
    mechanism: >-
      Borrowed from outside medicine (wildfire firebreaks, power-grid islanding, percolation theory):
      the hypothesis was that a resilient brain arrests a prion-like tau front at network bottlenecks
      (bridge edges), so WHERE pathology can travel, not just how much, sets resilience. Tonight's toy
      (scripts/firebreak_percolation_2026_11_05.py) tests it on the repo's FKPP reaction-diffusion vs
      linear NDM spreading models and reframes it: a containment/"resilience" threshold exists ONLY
      because tau growth is autocatalytic (FKPP has an invasion threshold in the growth rate; linear
      diffusion floods every connected node and has none), so the real resilience lever is the GROWTH
      term (the GSK3-beta / lithium-buffer and disease-tolerance axes), not edge topology.
    novelty: >-
      Imports a percolation/firebreak frame and then KILLS its naive form with a model, converting a
      borrowed analogy into a sharp claim: topology-based resilience (islanding, firebreaks,
      sub-threshold hub-loading) is mechanistically empty against a supercritical self-amplifying
      spreader. Distinct from the repo's reserve-as-redundancy idea (spare capacity) - this is about
      where the controllable lever is (growth vs wiring), and it ties resilience to the open
      autocatalysis question.
    against: >-
      In the toy, down-weighting even the top bottleneck (effective-resistance) edges did NOT contain
      an above-threshold front; only a full cut did, and that merely disconnects the epicenter node
      (and contains linear diffusion equally) - trivial disconnection a brain cannot do. So the
      firebreak mechanism fails here. Caveat: this is one synthetic connectome with assumed rates; a
      real small-world brain network with different hub structure, or a near-critical growth regime,
      could behave differently, and the whole claim is conditional on tau being autocatalytic in
      humans (unresolved; see identify-autocatalysis-rate).
    falsify: >-
      On real tau-PET + connectome data: if targeted weakening of bottleneck/hub edges predicts slower
      tau-front advance beyond total connectivity and baseline tau (i.e. topology DOES buy resilience),
      the growth-not-topology claim is wrong. Conversely, if human tau growth is shown to be
      non-autocatalytic (alpha ~ 0), the percolation/firebreak family is void regardless.
    evidence: in-silico
    safety: "A modeling/conceptual result on synthetic networks; no intervention. Not medical advice."
    next: "Rerun the toy on an open group connectome (e.g. an HCP-derived matrix) and at a near-critical growth rate to see whether partial bottleneck weakening ever contains without full disconnection; link to identify-autocatalysis-rate."
    sources:
      - "10.1016/j.neuron.2011.12.040"
      - "10.1038/s41467-020-15701-2"
      - "10.1103/PhysRevLett.86.3200"
    history:
      - date: 2026-11-05
        note: "Created and tested the same night on the resilience lens (outside-medicine constraint). The firebreak/islanding/percolation analogy's topological form was killed by the toy; the surviving claim - resilience against an autocatalytic spreader is a growth-term property - is kept as investigating and ties to the lithium/GSK3-beta buffer and the disease-tolerance idea."
  - id: disease-tolerance-slope-endpoint
    title: "Measure cognitive resilience as disease tolerance - the per-person slope of cognition vs tau, not low tau"
    created: 2026-11-05
    lens: resilience
    goal: understand
    status: new
    mechanism: >-
      Borrowed from the ecology/immunology of host defence (Medzhitov, Schneider & Soares 2012,
      10.1126/science.1214935): hosts survive a pathogen by RESISTANCE (lower burden) or TOLERANCE
      (less damage per unit burden, read off the slope of the health-vs-burden reaction norm). Mapped
      to AD: resilience = tolerance = a flat cognition-vs-tau slope, distinct from resistance = low
      tau. The decisive quantity is the between-person random slope of cognition regressed on tau-PET;
      resilience variants that act downstream (APOE3-Christchurch, RELN-COLBOS) are tolerance
      mechanisms (they lower tau's cognitive cost), aligning the construct with real human biology.
    novelty: >-
      Reframes "cognitive reserve" (usually education/IQ proxies) as a measurable tolerance slope with
      a clean statistical test, and separates a tolerance therapeutic axis (preserve function per
      tangle) from the clearance axis (remove tangles) that dominates trials.
    against: >-
      Phenomenological - it names the slope without a spreading mechanism and gives no topology
      prediction; it may not cleanly separate "less damage per tangle" from "fewer functionally
      relevant tangles" (resistance in disguise); and a stable between-person slope must exceed
      measurement error to be real.
    falsify: >-
      Fit cognition ~ tau with a per-person random slope in a tau-PET + cognition cohort (ADNI-style
      summary stats suffice). If, after accounting for measurement error, there is no stable
      between-person slope component (all variance is in the intercept = baseline ability), there is
      nothing to "tolerate" and the frame is wrong.
    evidence: observational
    safety: "A measurement/endpoint concept; no intervention. Not medical advice."
    next: "Specify the random-slope model and a noise floor; check whether an open tau-PET + cognition summary dataset can estimate a between-person slope component."
    sources:
      - "10.1126/science.1214935"
      - "10.1038/s41591-019-0611-3"
      - "10.1038/s41591-023-02318-3"
    history:
      - date: 2026-11-05
        note: "Created on the resilience / outside-medicine night; the disease-tolerance frame gives the single sharpest already-measurable resilience readout and complements resilience-is-growth-not-topology (resilience off the spread axis, onto the tolerance axis)."
  - id: response-diversity-not-redundancy
    title: "Resilience is decorrelated circuit vulnerability (response diversity), not spare capacity (redundancy)"
    created: 2026-11-05
    lens: resilience
    goal: understand
    status: new
    mechanism: >-
      Borrowed from ecology's insurance hypothesis (Yachi & Loreau 1999, 10.1073/pnas.96.4.1463;
      response diversity, Elmqvist 2003, 10.1890/1540-9295(2003)001[0488:RDECAR]2.0.CO;2): functional
      redundancy buffers a system only if the redundant components have RESPONSE DIVERSITY - they fail
      under different stresses, so they do not collapse together. Mapped to AD: resilience is not spare
      circuit capacity (the repo's reserve-as-redundancy-threshold) but redundancy x (1 - cross-circuit
      tau-susceptibility correlation). A brain with many parallel circuits that are all equally
      tau-vulnerable (correlated failure) is NOT resilient; one whose parallel circuits have
      decorrelated vulnerability is.
    novelty: >-
      Explicitly distinct from the repo's redundancy (Fiedler/algebraic-connectivity) metric - it is
      about the correlation structure of vulnerability across redundant paths, a claim the redundancy
      metric cannot make. Closest formalism is Edelman & Gally degeneracy (10.1073/pnas.131216798).
    against: >-
      AD presents essentially one chronic stressor (tau), so "diversity of responses to different
      stresses" barely applies; per-circuit response curves are unmeasured (we have at best
      cross-sectional vulnerability rankings), so the construct may be untestable with current data and
      could collapse back into plain redundancy.
    falsify: >-
      Build a response-diversity index (variance in regional/cell-type tau-vulnerability across the
      circuits serving one cognitive function, from open Allen/Agora cell-type maps x a connectome) and
      test whether it predicts cognition-at-matched-tau BEYOND the Fiedler redundancy metric and
      education. If it adds nothing, the construct is redundant with redundancy and dies.
    evidence: observational
    safety: "A modeling/metric concept on open summary and atlas data; no participant-level data; no intervention. Not medical advice."
    next: "Prototype the decorrelated-vs-correlated vulnerability contrast in-silico on the synthetic connectome, then scope the Allen/Agora cell-type vulnerability maps needed for a real index."
    sources:
      - "10.1073/pnas.96.4.1463"
      - "10.1890/1540-9295(2003)001[0488:RDECAR]2.0.CO;2"
      - "10.1073/pnas.131216798"
    history:
      - date: 2026-11-05
        note: "Created on the resilience / outside-medicine night; deliberately carved apart from reserve-as-redundancy-threshold (spare capacity) - this is decorrelated vulnerability, the insurance-hypothesis reading."
  - id: biomarker-futility-gate-platform
    title: "Use p-tau217/tau as an adaptive drop-rule and enrichment gate, never to graduate an arm"
    created: 2026-11-06
    lens: red-team
    goal: understand
    status: new
    mechanism: >-
      The survivable kernel of the parked treat-to-target idea. Keep the HIV/oncology
      measure-combine-adapt borrowing but change what the tau marker does: use plasma p-tau217 (or
      CSF MTBR-tau243) for trial ENRICHMENT and as a go/no-go FUTILITY GATE - an arm that fails to
      move the marker is dropped early - while REQUIRING a cognitive/functional endpoint to graduate.
      This exploits the marker's real strength (target engagement, prognosis) without betting that
      lowering it causes benefit, which tonight's red-team found unsupported.
    novelty: >-
      Reframes a proximal biomarker from surrogate-endpoint (discredited by amyloid's hollow surrogacy
      and diranersen's inverse dose-response) to a pure adaptive-design control variable; the testable
      twist is a retrospective validation of the drop-rule against known winners and losers.
    against: >-
      A futility gate that drops arms failing to move tau would have been correct only if tau movement
      is necessary for benefit - but if a beneficial mechanism acts without moving tau, the gate
      wrongly kills it; and enrichment on p-tau217 narrows generalisability. The gate is a bet that
      target engagement is necessary, which is weaker than surrogacy but still a bet.
    falsify: >-
      Retrospective in-silico test on the Alzforum Therapeutics tau-drug table: would a "drop if the
      arm does not lower tau" rule have dropped the known cognitive failures (gosuranemab, semorinemab,
      tilavonemab) while KEEPING the winners (lecanemab, donanemab)? If it mis-sorts the known
      winners/losers, the gate is worthless.
    evidence: in-silico
    safety: "A trial-design/analysis concept; no intervention. Not medical advice."
    next: "Tabulate tau-lowering vs cognitive outcome for each approved/failed tau or anti-amyloid arm (Alzforum Therapeutics, open) and test whether a tau drop-rule separates winners from losers."
    sources:
      - "10.1136/bmj.n156"
      - "10.1056/NEJMoa2212948"
      - "10.1001/jama.2023.13239"
    history:
      - date: 2026-11-06
        note: "Spun out of the parked treat-to-target-proximal-biomarker on the red-team night; the biomarker as a drop-rule/enrichment gate, not a graduation surrogate."
  - id: practice-curve-deviation-endpoint
    title: "Score cognitive improvement as normalization of the practice-learning curve, not raw change"
    created: 2026-11-06
    lens: red-team
    goal: detect
    status: new
    mechanism: >-
      At-home-only. The retest (practice) effect both mimics improvement (~0.2 SD, the size of a
      plausible treatment gain) and is itself an AD signal - its ATTENUATION tracks amyloid and
      entorhinal tau (Tort-Merino 2025, 10.1002/alz.087332). So instead of raw endpoint-minus-baseline
      (which a practice effect fakes), score each person against their own EXPECTED practice-learning
      trajectory: a treatment that restores the normal practice gain is the readout. Tonight's toy
      (scripts/improvement_detectability_2026_11_06.py) shows naive change reads a false ~+0.25 SD
      "improvement" under a true null while the practice-curve-deviation estimator recovers ~0.
    novelty: >-
      Turns the central confounder of improvement measurement into the measurement itself; distinct
      from existing decline-validated endpoints and from raw within-person change.
    against: >-
      Needs dense pre-onset repeated measures to estimate each person's practice curve (feasible only
      with at-home high-frequency sampling) and assumes the curve's shape is modelled correctly -
      mis-specifying it reintroduces the bias; and if genuine within-person gains essentially never
      occur in AD there is nothing to detect.
    falsify: >-
      If restoring a reversible deficit (recovery sleep after deprivation; treated depression) does not
      move the practice-curve-deviation metric beyond its retest CI, the reframing fails and raw change
      is no worse.
    evidence: observational
    safety: "A measurement concept on at-home digital data; no intervention; no participant-level data. Not medical advice."
    next: "Prototype the estimator against an open high-frequency at-home dataset (M2C2/Mobile Toolbox is open-source) using a reversible-cause positive control."
    sources:
      - "10.1002/alz.087332"
      - "10.1002/dad2.12283"
      - "10.1016/j.trci.2017.08.010"
    history:
      - date: 2026-11-06
        note: "Created on the red-team / at-home night from the finding that the practice effect is both the threat and an AD signal; modelled tonight."
  - id: ptau217-athome-slope-coupling
    title: "Test whether within-person change in plasma p-tau217 tracks change in an at-home cognition slope"
    created: 2026-11-06
    lens: red-team
    goal: detect
    status: new
    mechanism: >-
      At-home-feasible necessary-condition test for the parked treat-to-target claim. Using serial
      finger-prick/venous plasma p-tau217 (not PET or CSF) plus a passive at-home cognitive slope
      (remote smartphone memory and passive connected-speech proper-name recall), test WITHIN
      individuals whether a change in p-tau217 tracks a change in the at-home slope. If the marker and
      the at-home readout do not move together within a person, the marker cannot be a steerable target.
    novelty: >-
      Most p-tau217 work is cross-sectional or clinic-based; this is a within-person, at-home coupling
      test, and it is the cheapest partial kill of the treat-to-target idea.
    against: >-
      It tests only the NECESSARY condition (marker tracks cognition), not the sufficient causal step
      (lowering it CAUSES improvement), which needs an interventional arm; passive at-home slopes are
      noisy (see the detectability toy); and a coupling could be driven by shared upstream decline
      rather than a steerable link.
    falsify: >-
      If within-person delta-p-tau217 does not predict delta(at-home slope) - especially if banked
      remote-assessment arms of tau/anti-amyloid trials show the marker and the slope decoupled by dose
      - the marker-as-steerable-target claim is dead cheaply.
    evidence: observational
    safety: "Observational; a finger-prick blood test and passive at-home measures; not medical advice; nothing self-dosed."
    next: "Find an open cohort or banked trial arm with serial plasma p-tau217 plus any repeated at-home cognitive/speech measure and specify the within-person coupling analysis."
    sources:
      - "10.1136/bmj.n156"
      - "10.1002/dad2.12283"
    history:
      - date: 2026-11-06
        note: "Created on the red-team night as the cheapest at-home partial kill of treat-to-target-proximal-biomarker (necessary-condition, within-person, no scanner)."
  - id: vascular-bistability-hysteresis
    title: "A cerebrovascular tipping point with a reversal window that requires over-correcting the driver"
    created: 2026-11-07
    lens: inversion
    goal: reverse
    status: investigating
    mechanism: >-
      The two-hit vascular loop (amyloid-beta -> pericyte constriction -> hypoperfusion -> more
      amyloid and worse clearance) is a positive feedback that a published model formalises as a
      saddle-node with an S-shaped hysteresis: healthy and collapsed perfusion states can coexist
      (Ahern/Goriely, Proc R Soc A 2025, 10.1098/rspa.2024.0548). The loop's first arm is empirically
      real in HUMAN tissue (amyloid-beta ~halves cortical CBF via pericytes, reversibly;
      Nortley/Attwell 2019, 10.1126/science.aav9518). If this bistability is real, reversal has two
      consequences modelled tonight (scripts/vascular_hysteresis_2026_11_07.py): a latest point (the
      upper saddle-node) past which removing the driver no longer helps, and a hysteresis gap meaning
      you must push the driver well BELOW where perfusion collapsed, not just below the collapse point
      (an over-correction).
    novelty: >-
      Reframes the vascular-AD story as a reversal problem with a quantified over-correction
      requirement, and - crucially - separates the one place the bistability hypothesis is NOT metaphor
      (vessels, where a derived saddle-node and an empirical first arm exist) from the trial-signature
      version just parked. The contribution is to pair the model with the empirical discriminator it
      implies, not to assert the brain is bistable.
    against: >-
      The bistability is model-structural, not a measured basin; the toy shows it exists only for
      strong-enough feedback (weak feedback gives a smooth, fully reversible decline), and the model
      cannot say which regime a real brain is in. Even a full perfusion recovery is capped by neuron
      loss (~60% entorhinal layer-II gone by very-mild dementia, Gomez-Isla 1996, PMID 8699259), so the
      vascular route still caps at "freeze" past that stage. Much of the pro-causal BBB data is
      single-cohort and correlational.
    falsify: >-
      Empirical, not modeling: in a cohort with amyloid PET + ASL-CBF (and/or DCE-MRI Ktrans,
      sPDGFRbeta), at MATCHED amyloid load, is the vascular readout BIMODAL across individuals (two
      basins) or unimodal? And in anti-amyloid responders, does CBF recovery show path-dependence / a
      baseline-CBF threshold (hysteresis) rather than a single-valued graded return? Unimodal and
      single-valued kills the bistability rationale.
    evidence: in-silico
    safety: "A modeling/measurement hypothesis on summary and imaging data; no intervention; no participant-level data. Not medical advice."
    next: "Run the amyloid-matched vascular-bimodality test on any open aggregate/imaging summary (ADNI-style); digitise published CBF-vs-amyloid distributions if person-level data are unavailable (DUA-gated)."
    sources:
      - "10.1098/rspa.2024.0548"
      - "10.1126/science.aav9518"
      - "10.1523/ENEURO.0319-23.2024"
    history:
      - date: 2026-11-07
        note: "Spun out of the parked regime-shift-trial-signatures on the inversion/vascular night; the vascular lane is where bistability stops being metaphor (Ahern 2025 saddle-node + Nortley 2019 empirical first arm). Modelled tonight as a reduction of Ahern 2025."
  - id: capillary-stall-transit-time-readout
    title: "Capillary stalls / transit-time heterogeneity as a reversible-flow lever and an early readout"
    created: 2026-11-07
    lens: inversion
    goal: reverse
    status: new
    mechanism: >-
      The minimal vascular change that could restore function is relieving reversible capillary
      hypoperfusion in tissue whose neurons are still alive. In mice, neutrophil plugging stalls
      capillaries and clearing the stalls (anti-Ly6G) rapidly restores CBF and improves memory within
      hours-days (Cruz Hernandez 2019, Nat Neurosci, 10.1038/s41593-018-0329-4); the human analog is
      relieving amyloid/pericyte-mediated constriction (Nortley 2019, human tissue). Capillary transit-
      time heterogeneity (CTH, from DSC-MRI) is the candidate human readout of this reversible deficit.
    novelty: >-
      Vascular-AD consortia (MarkVCID) validate WMH/PSMD/cerebrovascular reactivity but not capillary-
      stall burden / CTH as an AD readout; the mouse stall-clearing rescue has no human translation.
    against: >-
      The stall-clearing rescue is mouse-only; CTH is noisy and not validated against AD outcomes; and
      the reversible-flow benefit is still capped by neuron loss, so it is an early-window lever at best.
    falsify: >-
      In a cohort with DSC-MRI CTH + amyloid/tau-PET, does baseline CTH predict cognitive decline
      INDEPENDENT of amyloid and tau? If it adds nothing, drop it.
    evidence: preclinical
    safety: "An imaging-readout and mechanism hypothesis; no intervention. Not medical advice."
    next: "Check whether any open imaging cohort reports DSC-MRI transit-time heterogeneity alongside amyloid/tau, and specify the independent-prediction test."
    sources:
      - "10.1038/s41593-018-0329-4"
      - "10.1126/science.aav9518"
    history:
      - date: 2026-11-07
        note: "Created on the vascular-inversion night; the 'smallest change that restores function' answer (flow to surviving neurons) turned into a reversible-flow readout. Mouse-grounded rescue; human CTH test undone."
  - id: stage-indexed-vascular-point-of-no-return
    title: "Map the latest stage a perfusion rescue can still work by coupling vascular load to neuron loss"
    created: 2026-11-07
    lens: inversion
    goal: reverse
    status: new
    mechanism: >-
      Working backwards from reversal: the durable floor is not vascular but neuronal. Vascular states
      (CBF, BBB leak, pericyte constriction, WMH penumbra) are functionally reversible, yet a perfusion
      rescue has nothing to rescue once the neurons are gone (~60% of entorhinal layer-II neurons lost
      by very-mild dementia, Gomez-Isla 1996, PMID 8699259). Formally couple a vascular-burden axis
      (capillary rarefaction, WMH, CBF) to residual neuron/synapse count to define, per stage, the
      latest point at which restoring perfusion could still recover function.
    novelty: >-
      Turns the recurring 'irreversibility = neuron loss' finding into an explicit, stage-indexed
      point-of-no-return map specific to the vascular route; extends clearance-threshold-onset and the
      reversible-ceiling work rather than duplicating them.
    against: >-
      Needs paired vascular-burden and residual-neuron data (largely autopsy or scarce imaging proxies);
      the neuron-count threshold for 'recoverable' is itself uncertain; and the map is only as good as
      the surrogate used for surviving substrate.
    falsify: >-
      In autopsy/imaging cohorts, does residual neuron/synapse count at a given vascular burden predict
      whether function is recoverable (or was preserved)? If residual substrate adds nothing over
      vascular burden alone, the coupling is not the right framing.
    evidence: in-silico
    safety: "A staging/modeling concept on summary and autopsy-derived data; no participant-level data; no intervention. Not medical advice."
    next: "Scope published stage-wise neuron-loss and vascular-burden summaries that could be coupled into a point-of-no-return curve; sanity-check in-silico against the reversible-ceiling toy."
    sources:
      - "10.1523/JNEUROSCI.16-14-04491.1996"
      - "10.1098/rspa.2024.0548"
    history:
      - date: 2026-11-07
        note: "Created on the vascular-inversion night; makes the 'latest reversal point is set by surviving neurons, not vessels' finding into an explicit stage-indexed map."
  - id: maoa-dopegal-wrong-isoform-repurposing
    title: "Trial a MAO-A inhibitor (not MAO-B) at the locus coeruleus DOPEGAL step the field skipped"
    created: 2026-11-08
    lens: repurposing
    goal: slow
    status: parked
    mechanism: >-
      The earliest tau seed is in the locus coeruleus, and the human-grounded mechanism there is
      MAO-A deaminating noradrenaline to the reactive aldehyde DOPEGAL, which activates asparagine
      endopeptidase (AEP/legumain) to cleave tau at N368 and seed spread (Kang/Ye, J Clin Invest
      2020, 10.1172/JCI130513; mouse/cell). The pathway implicates MAO-A specifically, yet the only
      completed MAO-inhibitor AD biomarker RCT used MAO-B (rasagiline), which met an FDG-PET endpoint
      but moved no tau marker (10.1002/trc2.12106). A safe, approved, cheap reversible MAO-A
      inhibitor (e.g. moclobemide) aimed at DOPEGAL has, as far as can be sourced, never been trialed
      in AD - the right isoform at the right place.
    novelty: >-
      The contribution is isoform correction: matching the drug (MAO-A) to the mechanism (MAO-A ->
      DOPEGAL) rather than repeating the MAO-B trial. Tonight's toy (scripts/lc_why_there_2026_11_08.py)
      makes the point that MAO-A/DOPEGAL is the one DRUGGABLE accelerant on top of the LC's undruggable
      structural vulnerability.
    against: >-
      All causal DOPEGAL-AEP data are rodent/cell; human DOPEGAL-lowering by a MAO-A inhibitor is
      untested; MAO-A inhibitors carry tyramine/serotonin-syndrome caution (reversible ones less so);
      and boosting functional NE while blocking its toxic branch is a delicate balance. The LC-seeding
      genes are also genetically cold for AD, so this is a timing/modifier bet, not an etiologic one.
    falsify: >-
      In amyloid-positive MCI, a >=12-week reversible MAO-A inhibitor should lower CSF/plasma DOPEGAL
      and AEP-cleaved tau-N368 versus placebo (target engagement). If it moves neither, the DOPEGAL-at-
      the-LC repurposing rationale is dead cheaply, before any cognitive trial.
    evidence: preclinical
    safety: >-
      MAO-A inhibitors are approved (depression) but need dietary/interaction caution; a reversible
      agent reduces risk. Research hypothesis; not medical advice; nothing self-dosed.
    next: "Spec a biomarker-endpoint (DOPEGAL, tau-N368) target-engagement study of a reversible MAO-A inhibitor; check for any existing banked samples from MAO-A-inhibitor users."
    sources:
      - "10.1172/JCI130513"
      - "10.1002/trc2.12106"
      - "10.1038/s41594-022-00745-3"
    history:
      - date: 2026-11-08
        note: "Created on the repurposing / LC 'why there' night; the night's most interesting finding was that the field trialed the wrong MAO isoform (MAO-B) for a MAO-A mechanism."
      - date: 2026-11-22
        note: "PARKED on the red-team night, leaning to kill. (1) The mechanism rests on one research group; no independent laboratory has measured the toxic breakdown product in the locus coeruleus and shown it drives tau clipping (as reported). (2) An independent industry study found the clipped tau fragment at similar levels in Alzheimer's and control brain and only in trace amounts in tangles (10.1186/s40478-019-0831-2, abstract checked). (3) In spinal fluid the fragment ratio falls in Alzheimer's and tracks late tangle load, so it cannot serve as the early target-engagement marker our test relied on (10.1093/brain/awz346, as reported). (4) No human signal: a 542-person trial of the sister-enzyme inhibitor was null, and a drug blocking both enzymes did not reduce progression in 210 people (as reported). Several papers from the originating group carry unresolved public comments whose content we have not read; no retraction or formal finding was found. A cheap decisive test is carried forward as stored-sample-dopegal-test."
  - id: atomoxetine-lc-mri-enrichment
    title: "Repurpose atomoxetine for tau, enriching responders by locus-coeruleus neuromelanin-MRI"
    created: 2026-11-08
    lens: repurposing
    goal: slow
    status: parked
    mechanism: >-
      Atomoxetine (a noradrenaline-reuptake inhibitor that raises synaptic NE) has the cleanest human
      target-engagement signal at the LC step: a 12-month biomarker RCT in MCI-due-to-AD raised CSF NE,
      lowered CSF total-tau and pTau181 (~5-6%), and raised temporal FDG-PET, with no cognitive effect
      in an underpowered sample (Levey et al., Brain 2021, 10.1093/brain/awab452; NCT01522404). The
      idea is to repurpose the drug AND a biomarker: enrich a trial to patients with preserved-but-
      stressed LC on neuromelanin-sensitive MRI (tracer-free, cheap, and declining before MTL tau,
      Bueicheku/Jacobs 2024, PMID 38664576), where an NE-restoring drug has the most substrate to act on.
    novelty: >-
      Uses LC neuromelanin-MRI as a predictive enrichment biomarker for an existing drug - a
      drug-plus-biomarker repurposing - rather than treating unselected patients; the prior RCT did
      not stratify by LC integrity.
    against: >-
      Atomoxetine's biomarker effect is modest and cognition-unproven; LC-MRI has a non-monotonic
      lifespan curve and only 'minor' sex content; enrichment narrows generalisability; and raising NE
      also feeds the MAO-A/DOPEGAL toxic branch (a reason to consider the combined lever below).
    falsify: >-
      In a cohort with baseline LC neuromelanin-MRI, does the LC signal moderate atomoxetine's tau-
      lowering effect? If there is no interaction (the drug helps regardless of LC integrity, or not at
      all), the enrichment premise is wrong.
    evidence: observational
    safety: "Atomoxetine is approved and broadly safe; a research hypothesis about enrichment, not medical advice."
    next: "Check whether the banked atomoxetine-RCT or any ADNI-adjacent cohort has baseline LC neuromelanin-MRI to test the moderation; spec the interaction analysis."
    sources:
      - "10.1093/brain/awab452"
      - "10.1038/s43587-024-00626-y"
    history:
      - date: 2026-11-08
        note: "Created on the repurposing / LC night; pairs the drug with the cleanest human LC engagement signal to an LC-integrity enrichment biomarker."
      - date: 2026-11-21
        note: "Cross-reference 2026-11-21: a cheaper enrichment marker may exist. Better locus coeruleus integrity went with more slow-wave activity (58 people) and poorer integrity with shorter, more broken sleep (39 people), as reported from abstracts, so at-home sleep physiology might stand in for specialised imaging. See brainstem-sparing-sleep-readout."
      - date: 2026-11-22
        note: "PARKED on the red-team night. (1) The drug is now in a 1,200-person platform trial with clinical endpoints (NCT07724132, results around 2031, as reported), so the unenriched question will be answered without us. (2) A 70,367-person health-record emulation found starting the drug was not associated with Alzheimer's risk at 5 or 10 years (10.1002/trc2.70345, abstract checked). (3) An independent mouse study found that a drug of the same class increased tau aggregates and caused memory deficits (10.1111/acel.14420, abstract checked). (4) The earlier human signal was a 5-6% fall in spinal-fluid tau on an unadjusted secondary outcome in 39 people, with no cognitive effect and more side effects (as reported). (5) The one study linking brainstem imaging to drug response, in Parkinson's disease, found people with LESS intact nuclei responded more - the opposite of enriching for intact ones. Re-open if the platform trial adds brainstem imaging."
  - id: perimenopausal-maoa-window
    title: "Test whether female tau excess peaks in a perimenopausal MAO-A window, not monotonically with age"
    created: 2026-11-08
    lens: repurposing
    goal: understand
    status: parked
    mechanism: >-
      Women accumulate tau faster than men at matched amyloid, at the amyloid->tau coupling step
      (Coughlan 2025, PMID 40029638). Brain MAO-A activity (which feeds the LC DOPEGAL->AEP->tau
      pathway) is not simply higher with low estrogen: human PET shows MAO-A binding is HIGHEST in
      perimenopause (driven by estrogen fluctuation, ~+34% vs reproductive; Rekkas, JAMA Psychiatry),
      then falls. Hypothesis: if the LC/DOPEGAL step contributes to the female tau excess, that excess
      should be concentrated in a narrow peri-/early-post-menopausal age band and attenuate later -
      not increase monotonically with age.
    novelty: >-
      Turns a contradictory estrogen-MAO-A story into a sharp, falsifiable NON-MONOTONIC prediction
      keyed to menopausal stage, distinct from the generic 'women accumulate tau faster' claim and from
      the amyloid-chronicity clock.
    against: >-
      The MAO-A -> tau-seeding link is rodent/cell, not human; menopause timing is hard to date in
      retrospective cohorts; the perimenopause MAO-A peak is from psychiatric PET, not AD; and the
      female tau excess may simply track amyloid-positivity timing rather than a hormonal window.
    falsify: >-
      In longitudinal tau-PET stratified by menopause-proximate age, if the female-minus-male tau-
      accumulation excess at matched amyloid is FLAT across age (not peaked peri-/early-post-menopause),
      the window hypothesis is falsified.
    evidence: observational
    safety: "An observational analysis hypothesis; no intervention. Not medical advice."
    next: "Scope whether an open tau-PET cohort records menopause-proximate age (or a usable proxy) to test the non-monotonic female-excess prediction."
    sources:
      - "10.1001/jamaneurol.2025.0013"
      - "10.1172/JCI130513"
    history:
      - date: 2026-11-08
        note: "Created on the repurposing / LC night; the honest resolution of the contradictory estrogen-MAO-A data (a perimenopausal peak, not estrogen loss) became a non-monotonic falsification test."
      - date: 2026-11-22
        note: "PARKED 2026-11-22 with its parent idea: the enzyme-to-tau mechanism it depends on is unreplicated outside one research group and contradicted at a key step (see maoa-dopegal-wrong-isoform-repurposing)."
  - id: remyelination-nonmonotone-trial-design
    title: "Design remyelination trials for an inverted-U dose-response, never a monotone one"
    created: 2026-11-09
    lens: trial-design
    goal: understand
    status: new
    mechanism: >-
      Remyelination has a mechanistically expected NON-MONOTONE (inverted-U) dose-response - there is
      an optimal OPC-differentiation window and over-drive is harmful - and the clearest human case is
      opicinumab (anti-LINGO-1): SYNERGY (Cadavid, Lancet Neurol 2019, PMID 31285147) had its best
      signal at an intermediate dose with benefit falling off at the top dose, so the pre-specified
      LINEAR dose-trend was null (p ~ 0.89) and it missed; AFFINITY then bet on a single fixed dose,
      the wrong move for a bell. The idea is to make non-monotonicity the design assumption for the
      whole remyelination class: >=4 doses, a curvature-aware primary (quadratic/umbrella contrast or
      MCP-Mod), and a responder-mixture endpoint, instead of two-arm or monotone-trend tests.
    novelty: >-
      Treats the inverted-U as a class property to design around, not an exception; tonight's toy
      (scripts/nonmonotone_dose_trial_2026_11_09.py) quantifies that a two-arm top-dose or monotone-
      trend analysis is near-powerless for an interior-peak drug while a quadratic contrast recovers
      it, and - honestly - that the machinery costs power when the drug is truly monotone.
    against: >-
      Multi-dose designs cost sample size and need to bracket an unknown optimum; if the true curve is
      monotone or saturating, the curvature machinery just dilutes power (shown in the toy); and the
      whole concern is moot if no remyelination agent reaches a clinical endpoint at any dose (none has
      yet - benefit has stopped at the myelin imaging surrogate).
    falsify: >-
      In silico, if a multi-dose + non-monotonicity analysis fails to beat two-arm/monotone-trend power
      across the plausible region (interior optimal dose, modest peak effect), the lesson is void. In a
      real trial, if the remyelination dose-response turns out monotone, the simpler design wins.
    evidence: in-silico
    safety: "A trial-design and analysis proposal; no intervention. Not medical advice."
    next: "Extend the toy with MCP-Mod and a responder-mixture (dip-test) endpoint; sweep the optimal-dose location and peak size to map where the design pays."
    sources:
      - "10.1016/S1474-4422(19)30137-1"
      - "10.1016/S0140-6736(17)32346-2"
    history:
      - date: 2026-11-09
        note: "Created and modelled on the trial-design / oligodendrocyte night; the opicinumab inverted-U made concrete as a design rule."
      - date: 2026-11-19
        note: "Cross-reference 2026-11-19: a second human case of an upside-down dose response - the tau antisense drug's best clinical signal was at its lowest dose in two readouts (company and funder reports, not significant) - see tau-antisense-dose-inversion. The design rule (never make the top dose or a rising trend the primary test) may generalise beyond myelin repair."
  - id: remyelination-amyloid-factorial-gonogo
    title: "A 2x2 factorial in a humanized knock-in to settle whether remyelination raises or lowers amyloid"
    created: 2026-11-09
    lens: trial-design
    goal: understand
    status: new
    mechanism: >-
      The oligodendrocyte-amyloid-source question (does remyelination raise or lower amyloid?) leans
      LOWER on current evidence but is unresolved because no study has remyelinated a humanized model
      and measured amyloid. A single add-on arm cannot separate a cognitive benefit from an amyloid
      penalty. The decisive, cheapest design is a 2x2 factorial - remyelination {yes/no} x anti-amyloid
      {yes/no} - in a humanized knock-in (APP-NL-G-F, not an overexpression line), with an
      oligodendrocyte-specific Bace1 control arm, reading cortical plaque load + soluble Abeta42 and the
      interaction (does anti-amyloid erase a remyelination gain = penalty real, or additive/synergistic).
    novelty: >-
      Turns the mouse-level raise-vs-lower uncertainty into a single human-relevant contrast a single
      add-on arm cannot resolve, and isolates the oligodendrocyte source term with a Bace1 arm.
    against: >-
      Interaction contrasts need ~4x the n of a main effect, so the interaction may be unpowerable at
      feasible scale (power it in-silico first; fall back to co-primary cognition + amyloid non-
      inferiority); and it is a preclinical model, so translation to humans is not guaranteed.
    falsify: >-
      Run the factorial: if the combined arm clears LESS amyloid than anti-amyloid alone, remyelination
      carries a penalty (NO-GO for co-administration); if equal-or-greater, combining is safe (GO). A
      flat or absent interaction answers the go/no-go either way.
    evidence: preclinical
    safety: "A preclinical design to prevent a harmful human drug combination before it is tried. Not medical advice."
    next: "Power the interaction in-silico (a factorial power toy) before proposing the wet experiment; scope whether any lab runs APP-NL-G-F x remyelination."
    sources:
      - "10.1038/s41586-023-06120-6"
      - "10.1038/s41593-024-01730-3"
    history:
      - date: 2026-11-09
        note: "Created on the trial-design / oligodendrocyte night; operationalises the oligodendrocyte-amyloid-source-test go/no-go as a factorial with an oligo-Bace1 control arm."
  - id: surrogate-gated-myelin-trial
    title: "Use myelin imaging as a go/no-go gate, not an endpoint, to beat the benefit-stops-at-imaging failure"
    created: 2026-11-09
    lens: trial-design
    goal: slow
    status: new
    mechanism: >-
      No remyelination trial has translated a myelin imaging/electrophysiology surrogate (myelin-water
      fraction, g-ratio, MTR, VEP latency) into a clinical endpoint - benefit stops at the imaging
      marker, the same failure mode as BP control slowing WMH but not dementia (SPRINT-MIND, PMID
      30688979/31408137). The design encodes 'imaging is necessary, not sufficient': enroll only
      confirmed myelin-deficit, amyloid-positive patients; make a prespecified change in the myelin
      surrogate a GO/NO-GO GATE that must move before a cognitive sub-study opens - so target engagement
      is proven before spending on a clinical endpoint, but the surrogate is never the endpoint.
    novelty: >-
      Flips the surrogate from endpoint (discredited) to an explicit interim gate, directly attacking
      the benefit-stops-at-imaging failure that has sunk every remyelination program so far.
    against: >-
      Needs the myelin-surrogate-to-cognition link to exist (if a myelin-water-fraction change does not
      predict processing-speed change, the gate is uninformative); gating adds cost and delay; and the
      cognitive readout still faces the unsolved improvement-endpoint problem (practice effects).
    falsify: >-
      In an observational cohort, test whether change in the myelin surrogate predicts change in a
      processing-speed/myelin-weighted composite. If it does not, the gate is uninformative and the
      design collapses.
    evidence: observational
    safety: "A trial-design proposal; no intervention. Not medical advice."
    next: "Find an open cohort with longitudinal myelin imaging + processing speed to test the surrogate->cognition link that the gate depends on."
    sources:
      - "10.1001/jama.2019.0855"
      - "10.1001/jama.2019.10551"
    history:
      - date: 2026-11-09
        note: "Created on the trial-design / oligodendrocyte night; turns the recurring 'benefit stops at the imaging marker' finding into a gate-not-endpoint design."
  - id: epileptiform-gated-lev-prevention
    title: "A low-dose levetiracetam prevention trial gated on amyloid-positive AND sleep-epileptiform-positive"
    created: 2026-11-10
    lens: prevention-population
    goal: slow
    status: parked
    mechanism: >-
      Subclinical epileptiform activity is present in ~42% of AD and ~90% of its discharges occur in
      sleep (Vossel, Ann Neurol 2016, PMID 27696483); low-dose levetiracetam normalises hippocampal
      hyperactivity in aMCI (Bakker, Neuron 2012, PMID 22578498). Every cognitive-endpoint trial so
      far was UNSELECTED or sub-grouped post hoc and was null (HOPE4MCI CDR-SB null, NCT03486938;
      LEV-AD overall null, PMID 34570177 - only the epileptiform-positive subgroup improved). The idea
      is a PREVENTION-stage trial that prospectively enriches on BOTH amyloid-positivity AND
      sleep-EEG epileptiform-positivity - the ~subset in which the mechanism is actually present -
      rather than treating everyone.
    novelty: >-
      No trial has used excitability (sleep-EEG epileptiform load) as the PRIMARY enrichment gate at
      the preclinical stage; prior trials enriched on amyloid/MCI and found the excitability signal
      only post hoc. Generic levetiracetam is ~$4-15/month, so the molecule is population-affordable.
    against: >-
      The causal case is weak: Mendelian randomization runs mainly AD -> epilepsy with the reverse
      near-null (Fang 2023, PMID 37225432), and three LEV trials were null on cognition, so
      hyperexcitability may be a downstream accelerant you can measure but not treat for prevention.
      Benefit has so far stopped at the EEG/fMRI marker (the repo's recurring failure mode). AD GWAS
      heritability is microglial, not neuronal, so the interneuron axis is not genetically upstream.
    falsify: >-
      In an amyloid-positive AND epileptiform-positive preclinical cohort, if 24-month low-dose
      levetiracetam shows no slowing of a sensitive cognitive composite (PACC) or CDR-SB vs placebo,
      the gated-prevention rationale is dead - the strongest test the axis can get.
    evidence: none
    safety: >-
      Low-dose levetiracetam is generally well tolerated but has neuropsychiatric side effects; a
      prevention trial in cognitively unimpaired people needs a high safety bar. Not medical advice.
    next: "Scope whether any open preclinical-AD cohort has overnight/sleep EEG + amyloid + longitudinal cognition to size the enriched subgroup and the effect it would need."
    sources:
      - "10.1002/ana.24794"
      - "10.1016/j.neuron.2012.03.023"
      - "10.1212/WNL.0000000000011355"
    history:
      - date: 2026-11-10
        note: "Created on the prevention-population / interneuron night; makes excitability the enrichment gate the null trials lacked, while recording that the causal MR runs the other way."
      - date: 2026-11-22
        note: "PARKED on the red-team night. The gate cannot yet be measured reliably: careful multi-expert review found sleep discharges in 3 of 30 people with early Alzheimer's and 1 of 30 controls, not a significant difference (10.1002/ana.78135, abstract checked), while other methods report anything from 18% to 54% in patients and up to 47% in healthy controls (as reported). The unselected trial of the low-dose drug in mild impairment was null (difference -0.10 points, 95% range -0.85 to 0.58, 164 people, 10.1002/trc2.12446, abstract checked) and the sponsor withdrew its follow-up trial. Genetic studies favour Alzheimer's causing over-excitability, not the reverse (as reported). Continued as epileptiform-marker-agreement-first."
  - id: sleep-eeg-hyperexcitability-screen
    title: "At-home overnight sleep-EEG as a cheap population screen for network hyperexcitability"
    created: 2026-11-10
    lens: prevention-population
    goal: detect
    status: parked
    mechanism: >-
      ~90% of AD epileptiform discharges occur in sleep and routine awake EEG misses them (Vossel,
      Ann Neurol 2016, PMID 27696483), so a consumer/clinical OVERNIGHT sleep-EEG could triage the
      high-excitability subgroup at population scale far more cheaply than the MEG + inpatient video-EEG
      used in research. This is a screening idea (find the subgroup), not a drug - it would feed a gated
      trial or a monitoring programme.
    novelty: >-
      Reframes the expensive research detection pipeline as a scalable at-home screen keyed to the
      sleep timing of discharges; distinct from drug-centric excitability ideas.
    against: >-
      Consumer EEG is noisy and epileptiform detection is hard to automate reliably; and the screen is
      only worth running if excitability adds predictive value - which, given the null MR and trials,
      is unproven. It may simply re-identify people a plasma marker already flags.
    falsify: >-
      In a general older cohort, if sleep-EEG epileptiform load adds no incident-decline prediction
      beyond plasma p-tau217 (and amyloid), the screen is uninformative and should be dropped.
    evidence: observational
    safety: "A screening-tool hypothesis; no intervention. Not medical advice; nothing identifies a real person."
    next: "Check whether any open sleep-EEG + plasma-biomarker + longitudinal-cognition cohort could test the incremental-prediction question."
    sources:
      - "10.1002/ana.24794"
      - "10.1212/WNL.0000000000011355"
    history:
      - date: 2026-11-10
        note: "Created on the prevention-population / interneuron night from the finding that ~90% of discharges are in sleep, so a cheap sleep-EEG could replace MEG for triage."
      - date: 2026-11-22
        note: "PARKED 2026-11-22: a population screen cannot rest on a marker whose prevalence ranges from 3% to 47% in healthy people depending on method and reader (see epileptiform-gated-lev-prevention). Re-open when a fixed, validated detection method exists."
  - id: metformin-benefit-concentrates-in-high-wmh
    title: "Test whether metformin's dementia signal concentrates in the high-white-matter-burden subgroup"
    created: 2026-11-10
    lens: prevention-population
    goal: slow
    status: new
    mechanism: >-
      Metformin (non-anticholinergic, cheap) shows a lower dementia hazard vs sulfonylurea in
      active-comparator target-trial emulation and a ~14% lower AD odds in drug-target MR via
      mitochondrial complex I (Charpignon 2022, 10.1038/s41467-022-35157-w; Diabetologia 2022,
      10.1007/s00125-022-05743-0). If that benefit runs through a vascular/myelin mechanism rather than
      a global one, it should be concentrated in people with high small-vessel/white-matter-hyperintensity
      burden. Testing that interaction is both a mechanism probe and an enrichment strategy for the
      unread metformin RCT (MAP, NCT04098666).
    novelty: >-
      Turns the metformin-dementia debate into a testable treatment-by-baseline-WMH interaction, which
      also tells a prevention trial whom to enrich; most metformin-dementia work estimates a single
      average effect.
    against: >-
      Metformin's dementia signal may be confounding (healthy-initiator / channeling bias) that an
      active comparator does not fully remove; the interaction needs a large EHR+imaging cohort and is
      underpowered otherwise; and if the mechanism is global (AMPK/metabolic), there is no WMH interaction
      to find even if the drug works.
    falsify: >-
      In an EHR+imaging cohort (e.g. diabetics with brain MRI), if the metformin-vs-sulfonylurea
      dementia hazard shows NO treatment-by-baseline-WMH interaction, the vascular/myelin mechanism is
      wrong and metformin's effect (if real) is not myelin-mediated.
    evidence: observational
    safety: "An observational-analysis hypothesis; no intervention. Not medical advice."
    next: "Scope whether an open diabetic cohort links metformin-vs-sulfonylurea use, baseline WMH, and incident dementia; specify the interaction test."
    sources:
      - "10.1038/s41467-022-35157-w"
      - "10.1007/s00125-022-05743-0"
    history:
      - date: 2026-11-10
        note: "Created on the prevention-population night from the remyelination revisit's metformin pivot; makes the metformin-dementia question a WMH-interaction test."
      - date: 2026-11-22
        note: "Watch dates added 2026-11-22 (as reported from registries): the 326-person metformin trial in mild impairment reached primary completion in April 2026 and has not reported, and the drug is one arm of a 1,200-person platform trial. Every other insulin-pathway drug tested at scale has failed. This idea's interaction test should be read against that prior."
  - id: reserve-indexed-titration-rate
    title: "Set the anti-amyloid titration slope per patient from baseline microbleed burden, not one schedule"
    created: 2026-11-11
    lens: combination-timing
    goal: slow
    status: new
    mechanism: >-
      ARIA is governed by the clearance RATE, not the total dose: a gentler titration cut donanemab
      ARIA-E 24% -> ~14% at equal cumulative exposure and equal amyloid/p-tau217 lowering
      (TRAILBLAZER-ALZ6, 10.1002/alz.70062). Tonight's control toy
      (scripts/aria_titration_control_2026_11_11.py) shows the safe clearance rate scales with vascular
      reserve. The idea: set the per-patient titration SLOPE from a cheap baseline reserve readout
      (microbleed count + superficial siderosis + APOE4), so lower-reserve patients escalate slower and
      higher-reserve patients clear faster - a feed-forward, biomarker-free refinement of ALZ6's single
      gentler schedule.
    novelty: >-
      Current titration is one-size or at most genotype-tiered; indexing the escalation slope to measured
      baseline vascular reserve (microbleed burden), without any fluid biomarker, is the contribution.
    against: >-
      ALZ6's single gentler schedule may already capture most of the benefit, leaving little for
      per-patient tuning; the microbleed->ARIA-H link is solid but the interaction with titration rate is
      untested; and over-slowing clearance in low-reserve patients could cost efficacy/time.
    falsify: >-
      In banked or future trial data, if ALZ6-style modified titration does NOT reduce ARIA-E more in
      high-microbleed patients than in low-microbleed patients (no titration-by-reserve interaction), the
      buffer-overflow rationale for per-patient slope is wrong.
    evidence: RCT
    safety: >-
      Aimed at reducing iatrogenic ARIA; a mis-set slope could under-treat or expose a misclassified
      patient. Any rule needs prospective validation. Not medical advice.
    next: "Check whether ALZ6 or a pivotal trial reports ARIA-E by baseline microbleed stratum to test the titration-by-reserve interaction retrospectively."
    sources:
      - "10.1002/alz.70062"
      - "10.1001/jamaneurol.2025.0065"
    history:
      - date: 2026-11-11
        note: "Created on the combination-timing / engineer night; the biomarker-free, microbleed-indexed version of vascular-reserve-aria-dosing after that idea's fluid-marker form was downgraded."
  - id: bp-cotreatment-aria-brake
    title: "Intensive blood-pressure control during anti-amyloid therapy as a co-treatment ARIA brake"
    created: 2026-11-11
    lens: combination-timing
    goal: slow
    status: new
    mechanism: >-
      In the donanemab ARIA risk model, higher mean arterial pressure independently raised ARIA-E risk
      and baseline antihypertensive use independently LOWERED it (Zimmer 2025, 10.1001/jamaneurol.2025.0065).
      That suggests a "protect-then/while-clear" combination: intensive BP control co-administered with an
      anti-amyloid antibody could stabilise the vessel wall and reduce ARIA without blunting amyloid
      clearance - a timing/combination lever distinct from slowing the dose.
    novelty: >-
      Reframes an observational antihypertensive signal as a prospectively testable co-treatment ARIA
      brake; a registered open-label RCT of intensive SBP (<120) vs usual care during anti-amyloid now
      exists (design published 2025), so this is an adjudicable hypothesis, not just a correlation.
    against: >-
      The antihypertensive signal is observational and sponsor-authored (confounding by indication/
      healthy-user bias not excluded); aggressive BP lowering in older adults has its own harms (falls,
      hypoperfusion), and SPRINT-MIND showed BP control slows WMH but not dementia, so the vascular lever
      may again stop at an imaging marker.
    falsify: >-
      If the registered intensive-SBP-vs-usual-care RCT during anti-amyloid shows no reduction in ARIA-E,
      the co-treatment brake is dead.
    evidence: observational
    safety: >-
      BP management is standard but intensive control carries hypotension/fall risk in older adults; this
      is a research hypothesis, not medical advice.
    next: "Track the registered intensive-BP-during-anti-amyloid RCT for its ARIA-E readout; check whether any banked trial can test the MAP-by-ARIA relationship with a causal design."
    sources:
      - "10.1001/jamaneurol.2025.0065"
      - "10.1001/jama.2019.0855"
    history:
      - date: 2026-11-11
        note: "Created on the combination-timing / engineer night; the one protect-then-clear lever with real (if observational) human support and a registered RCT."
  - id: factorial-synergy-not-backbone-addon
    title: "Measure combination synergy with a 2x2 factorial, not another add-on to an anti-amyloid backbone"
    created: 2026-11-11
    lens: combination-timing
    goal: understand
    status: new
    mechanism: >-
      Modern AD combination trials (anti-amyloid + anti-tau platforms such as DIAN-TU Tau NexGen,
      NCT05269394) are ADD-ON designs: drug B on an anti-amyloid backbone present in every arm. An add-on
      can show "B helps on an A backbone" but CANNOT identify the A x B interaction, because there is no
      B-without-A or A-without-B cell - so it cannot measure SYNERGY (whether A+B beats A-alone plus
      B-alone). The only true AD factorial precedent is old and cautionary: selegiline x alpha-tocopherol
      (Sano 1997, NEJM, PMID 9110909), where the COMBINATION did not beat either monotherapy - exactly the
      sub-additive interaction you only see with a factorial. The idea: for an independent-axis pair
      (e.g. amyloid clearance x tau-spread blockade), run a 2x2 (or a response-surface dose design) powered
      for the interaction term.
    novelty: >-
      Names a structural blind spot - the field cannot currently measure combination synergy because it
      uses backbone add-on designs - and proposes the factorial/response-surface fix with the historical
      cautionary precedent.
    against: >-
      Factorials need ~4x the sample size of a main effect for the interaction, so they are expensive and
      often underpowered; a true placebo/placebo cell is ethically hard once a backbone is standard of
      care; and if the two agents act on coupled rather than independent nodes, synergy may be small or
      negative (as Sano found).
    falsify: >-
      Retrospective/in-silico: if, across mechanistically independent pairs, add-on designs and factorial
      designs would reach the same conclusion (the interaction term is reliably ~0), the factorial buys
      nothing and the add-on is sufficient. A single real factorial showing a non-zero interaction refutes
      that.
    evidence: observational
    safety: "A trial-design argument; no intervention. Not medical advice."
    next: "Pick one independent-axis pair and simulate the power/sample-size gap between a 2x2 factorial and an add-on design for detecting a plausible interaction (a factorial-power toy)."
    sources:
      - "10.1056/NEJM199704243361704"
      - "10.1056/NEJMoa2212948"
    history:
      - date: 2026-11-11
        note: "Created on the combination-timing / engineer night; the lens asked whether any trial was even designed to measure synergy, and the answer (almost none, only add-on) is the idea."
  - id: natural-pulse-recovery-rate
    title: "Measure resilience as recovery rate after a person's own bad nights and ill days"
    created: 2026-11-12
    lens: earliest-signal
    goal: detect
    status: new
    mechanism: >-
      Ecology's most direct measure of resilience is how fast a system returns after a disturbance;
      variance and autocorrelation are only proxies (Scheffer 2018, 10.1073/pnas.1810630115). Use
      each person's own spontaneous disturbances - worst-decile sleep nights from a wearable, febrile
      or ill days, travel - as natural pulses, and estimate the half-life of the return of
      burst-sampled smartphone cognition to that person's baseline. Hypothesis: the recovery
      half-life lengthens in preclinical Alzheimer's before mean performance changes.
    novelty: >-
      The catalogue holds dense burst sampling, sleep and circadian signals separately; treating them
      as disturbance and response to estimate a recovery RATE is new, and the literature review found
      purpose-built cognitive "stress tests" (LASSI-L) that score recovery within one session but no
      one measuring recovery time after a standard disturbance, repeated at home.
    against: >-
      Natural pulses are not randomised - bad nights travel with mood, pain and illness - and are
      small: in tonight's model a 1-SD disturbance gives only AUC ~0.67 from 30 measurements, versus
      ~0.97 for a 4-SD one. The expected direction is also contested (see
      early-warning-direction-test), and p-tau217 may already carry the prognostic information.
    falsify: >-
      In cognitively unimpaired people, if recovery half-life after worst-decile sleep nights does
      not differ between p-tau217-positive and -negative groups, or adds less than 0.02 AUC over
      p-tau217 for later decline, the idea is dead.
    evidence: observational
    safety: "Passive monitoring and brief self-testing only; no intervention. Not medical advice."
    next: "Specify the estimator (impulse-response fit per person) and the number of natural pulses needed per person for a usable half-life estimate; simulate it with the resilience-probe model."
    sources:
      - "10.1073/pnas.1810630115"
      - "10.1037/neu0000928"
      - "10.1016/j.jagp.2016.02.056"
    history:
      - date: 2026-11-12
        note: "Created on the earliest-signal / ecologist night; the ecologist's recovery-rate measure applied to at-home burst cognition, with the model's small-kick weakness recorded as the main argument against."
  - id: surgery-recovery-curve-stress-test
    title: "Read elective surgery as a standard stress test: the shape of cognitive recovery, not delirium yes/no"
    created: 2026-11-12
    lens: earliest-signal
    goal: detect
    status: new
    mechanism: >-
      Major elective surgery is a large, scheduled disturbance with a known date - the closest thing
      to a deliberate pulse experiment in older adults. The field scores it as delirium yes/no; in
      the SAGES cohort delirious patients looked recovered at two months and then declined faster
      over six years (Inouye 2016, 10.1016/j.jalz.2016.03.005). The idea: brief daily cognition on
      postoperative days 1-7 and at one month, fit the recovery RATE, and test whether a slow rate
      (alone, or with pre-operative p-tau217 / GFAP) predicts three-year decline beyond
      pre-operative cognition and p-tau217.
    novelty: >-
      Replaces a binary outcome with the ecologist's actual resilience metric (recovery rate) on a
      large standard disturbance, which tonight's model says is where a probe becomes efficient.
    against: >-
      Delirious patients already had lower pre-operative cognition, so delirium may be a marker and
      not a cause; operations, anaesthesia and opioids vary; people fit for surgery are a selected
      group; and blood-marker prediction of delirium is inconsistent (a p-tau217 AUC of 0.97 came
      from 18 events and is almost certainly overfit, while the larger SAGES analysis found p-tau217
      predicted severity, not incidence).
    falsify: >-
      If postoperative recovery rate adds less than 0.02 to the C-index for three-year cognitive
      decline over pre-operative p-tau217 plus baseline cognition, the stress-test reading adds
      nothing.
    evidence: observational
    safety: "Observational measurement around surgery that is happening anyway; no change to care. Not medical advice."
    next: "Check whether any perioperative cohort already has daily postoperative cognitive scores plus stored pre-operative plasma; it would be access-controlled participant data, so this is a question for published analyses, not something to download."
    sources:
      - "10.1016/j.jalz.2016.03.005"
      - "10.1093/brain/aws190"
      - "10.1097/SLA.0000000000005487"
    history:
      - date: 2026-11-12
        note: "Created on the earliest-signal / ecologist night; surgery as the one large, dated disturbance where a recovery-rate probe is efficient."
  - id: early-warning-direction-test
    title: "Settle which way the signal points before building an early-warning detector"
    created: 2026-11-12
    lens: earliest-signal
    goal: understand
    status: investigating
    mechanism: >-
      Critical-slowing-down theory predicts that a system losing resilience shows LONGER timescales
      and MORE variance. But a brain losing neurons and synapses may instead drift away from
      criticality, giving SHORTER intrinsic timescales (ageing human brains: Wu & Gollo 2025,
      10.1038/s42003-025-07517-x) and LESS behavioural variability (preclinical-model mice: Ehret
      2023, 10.1016/j.biopsych.2023.04.009), while human reaction-time variability is HIGHER with
      amyloid (Lu 2020, 10.1002/dad2.12076) and frailty activity data ran opposite to theory (Rector
      2021, 10.1016/j.exger.2021.111341). The sign plausibly depends on the signal and the stage. The
      idea is to measure the direction first - per signal - instead of assuming it.
    novelty: >-
      Early-warning proposals for dementia assume the ecology sign; this makes the sign itself the
      first empirical question, with an open dataset able to give a first (symptomatic-stage) answer.
    against: >-
      The open resting-EEG set is symptomatic Alzheimer's and frontotemporal dementia (88 people),
      not preclinical, so it can only show the method works; EEG slowing by itself lengthens
      autocorrelation, so peak frequency must be controlled; and a stage-dependent sign could make a
      single answer misleading.
    falsify: >-
      On open resting EEG, after controlling for alpha-peak frequency: if Alzheimer's and controls
      show no difference in intrinsic timescale or variance (|d| < 0.2), there is no direction to
      exploit in that signal; a clear shift in either direction settles which detector to build.
    evidence: in-silico
    safety: "Analysis of already-public, de-identified recordings; no intervention. Not medical advice."
    next: "First pass done (see history). Next: a sleep or task EEG signal with a preclinical sample is needed to say anything about the years before symptoms; on this dataset, one pre-declared sensitivity check remains (broadband window after removing activity below 2 Hz, which currently dominates it)."
    sources:
      - "10.1038/s42003-025-07517-x"
      - "10.1016/j.biopsych.2023.04.009"
      - "10.1002/dad2.12076"
    history:
      - date: 2026-11-12
        note: "Created on the earliest-signal / ecologist night from the review's most interesting finding: real data disagree on whether variance and timescales should rise or fall."
      - date: 2026-11-12
        note: "Project owner approved registering and analysing the open CC0 resting-EEG dataset (OpenNeuro ds004504); scheduled for the next nightly run."
      - date: 2026-11-13
        note: >-
          First pass run on the open CC0 resting-EEG dataset (OpenNeuro ds004504; registry id
          openneuro-ds004504; scripts/eeg_direction_test_2026_11_13.py), with owner approval. The
          method works: the known EEG slowing is recovered (4-13 Hz centre of gravity lower in
          Alzheimer's than controls, d = -0.76, 95% interval -1.52 to -0.23; n = 36 vs 29). But the
          three resilience-type measures show NO direction: after adjusting for age, sex and peak
          frequency, Alzheimer's minus controls is d = -0.14 for the broadband autocorrelation
          window, +0.17 for envelope persistence and +0.07 for envelope variability - all under the
          pre-stated 0.2 threshold, and all with intervals wide enough (roughly -0.9 to +0.9) to hide
          a moderate effect either way. So at the dementia stage, in resting eyes-closed EEG, neither
          the critical-slowing-down sign nor the opposite sign shows up; with 65 people this is
          "no detectable direction", not proof of none. Limits: symptomatic, single site, and the
          broadband window is dominated by activity below 2 Hz. Status new -> investigating.
  - id: autoregulation-gated-bp-lowering
    title: "Blood-pressure lowering may help cognition only while the brain can still regulate its own blood flow"
    created: 2026-11-12
    lens: earliest-signal
    goal: slow
    status: new
    mechanism: >-
      An ecologist's reading of the blood-pressure trials: in a degraded habitat, removing one
      stressor does not restore function, and the intervention can become a stressor itself. Heavy
      white-matter damage and advanced cardio-kidney-metabolic disease mark loss of autoregulation;
      below that floor, intensive lowering risks under-perfusion. In SPRINT, intensive treatment was
      associated with MORE cognitive impairment in the high-white-matter-lesion half (HR 2.36,
      1.20-4.66; interaction p=0.09; Reddy 2025, PMID 40586237) and its dementia benefit was confined
      to people without advanced cardio-kidney-metabolic disease (reported interaction p=0.009; Wang
      2026, 10.1002/alz.71623 - not independently checked here, and the paper's own sections are
      said to give differing numbers). So the cognitive benefit may follow an inverted U across baseline damage,
      and the group to enrich is moderate damage with intact autoregulation - not the most damaged.
    novelty: >-
      Turns the parked wmh-enriched-prevention-trial on its head: enrich away from the most damaged,
      and gate on an autoregulation readout. Lines up three independent post hoc signals.
    against: >-
      All three signals are post hoc subgroups; the SPRINT one rests on about 60 events. PRESERVE
      found no fall in cerebral blood flow with intensive lowering in severe small-vessel disease
      (PMID 29507944), INFINITY found no cognitive harm in over-75s with white-matter lesions (PMID
      31607143), and the same high-lesion SPRINT group had fewer cardiovascular events - so
      withholding treatment has a real cost.
    falsify: >-
      If SPRINT MIND's extended follow-up shows a probable-dementia hazard ratio below 1 in the top
      white-matter-lesion third, with no trend across thirds, the inverted-U reading is wrong.
    evidence: observational
    safety: >-
      Nothing here supports changing anyone's blood-pressure treatment: intensive control reduced
      cardiovascular events in the same subgroup. Research hypothesis only; not medical advice.
    next: "Watch for a published treatment-by-white-matter-lesion analysis on SPRINT MIND's extended outcomes; check whether orthostatic or pulse-pressure proxies of autoregulation were reported by subgroup."
    sources:
      - "10.1097/HJH.0000000000004093"
      - "10.1002/alz.71623"
      - "10.1212/WNL.0000000000213334"
    history:
      - date: 2026-11-12
        note: "Spun out of the parked wmh-enriched-prevention-trial on the earliest-signal / ecologist night."
  - id: hypnotic-plasma-ptau-bias
    title: "Sleep drugs may shift plasma p-tau against the brain signal and misclassify people near a cutoff"
    created: 2026-11-13
    lens: frontier-scan
    goal: detect
    status: new
    mechanism: >-
      A secondary analysis of the randomised suvorexant study (preprint, 5 Nov 2026,
      10.64898/2026.11.03.26367196; 25 people, one night) reports that the drug RAISED the plasma
      p-tau181 ratio while LOWERING it in cerebrospinal fluid (the fall in CSF was already published:
      10.1002/ana.26641). If sleep drugs move plasma and brain-side p-tau in opposite directions,
      people taking them could be pushed across a plasma p-tau cutoff without any change in
      pathology - a hidden source of error for blood-based screening and trial enrolment.
    novelty: >-
      Drug effects on the plasma-versus-brain agreement of p-tau markers are essentially unexamined;
      the catalogue's detection ideas all assume plasma p-tau217 is a stable yardstick.
    against: >-
      One night, 25 people, a preprint, and the effect is on p-tau181 - p-tau217 did not change in
      CSF in the original report. It may not generalise to chronic use, to other hypnotics, or to the
      marker actually used for enrolment.
    falsify: >-
      By 2027-11-13: in any published or released cohort with medication records plus paired plasma
      p-tau217 and amyloid PET or CSF, if hypnotic users show no excess plasma-versus-PET/CSF
      discordance, the concern is dead.
    evidence: RCT
    safety: "A measurement-validity hypothesis; nothing here is a reason for anyone to change a medication. Not medical advice."
    next: "Watch for peer review of the preprint and for any p-tau217 result; look for published discordance analyses stratified by sleep-medication use."
    sources:
      - "10.64898/2026.11.03.26367196"
      - "10.1002/ana.26641"
    history:
      - date: 2026-11-13
        note: "Created on the frontier-scan night from a preprint posted eight days earlier; graded RCT because the source is a randomised study, but it is a small, single-night secondary analysis not yet peer reviewed."
      - date: 2026-11-18
        note: "Sharpened on 2026-11-18: as reported by a registry scan, all three recruiting orexin-antagonist prevention trials use a blood p-tau ratio as the primary endpoint (NCT04629547, NCT06274528, NCT07213349), the same kind of marker that moved opposite to spinal fluid in the preprint. A fall in the blood marker in those trials therefore cannot be read as less brain pathology unless spinal fluid or PET agrees; only one of the three lists spinal-fluid secondary endpoints as far as the scan could tell."
  - id: amplitude-is-volume
    title: "Test whether rest-activity rhythm strength predicts outcomes beyond how much a person moves"
    created: 2026-11-13
    lens: frontier-scan
    goal: understand
    status: new
    mechanism: >-
      Wearable rest-activity measures (relative amplitude, day-to-day stability) are linked to
      cognition and dementia, but a person who moves more has a larger amplitude almost by
      construction, and one large cohort's Alzheimer's association reportedly weakened after
      adjusting for total activity. Hypothesis: most of the "rhythm" signal is activity volume. If
      so, the catalogue's sleep and circadian early-signal ideas are measuring fitness, not timing.
    novelty: >-
      A direct, cheap test of a confound that sits under two of our own ideas
      (passive-circadian-early-signal, sleep-regularity-vs-duration), runnable on fully public data.
    against: >-
      Some published rhythm associations partly survive adjustment for activity; volume and rhythm
      are biologically entangled, so "adjusting away" volume may remove real signal.
    falsify: >-
      By 2027-11-13, on public wrist-accelerometer survey data with cognitive tests (US NHANES
      2011-14): if relative amplitude keeps at least half of its association with processing speed
      and mortality after adjusting for total activity, the confound claim is wrong.
    evidence: observational
    safety: "Analysis of public survey data; no intervention. Not medical advice."
    next: "Owner decision needed first: NHANES public-use files need no application but are participant-level records, so analysing them is a policy call like the EEG dataset."
    sources:
      - "10.1001/jamaneurol.2017.4719"
      - "10.1002/ana.22468"
    history:
      - date: 2026-11-13
        note: "Created on the frontier-scan night from the circadian revisit; a 12-month, open-data test of a confound under two existing ideas."
      - date: 2026-11-19
        note: "Partly answered by others (found 2026-11-19). In the public US survey data a rhythm-alignment measure lost its link to processing speed once sleep duration and total activity were adjusted for (10.1038/s41598-024-64309-9, abstract checked), and in a large UK analysis rhythm strength's link to Alzheimer's weakened after adjusting for activity volume while its link to all-cause dementia held (10.1186/s13195-026-02088-3, as reported). Both point the way this idea predicted. The planned open-data analysis is now a replication with the standard amplitude measure, not a first test, so it is less urgent."
  - id: cxcr3-tolerance-lever
    title: "Blocking T-cell entry may protect tissue without lowering tau - a disease-tolerance lever"
    created: 2026-11-13
    lens: frontier-scan
    goal: slow
    status: new
    mechanism: >-
      A mouse study (Neuron, Sept 2026, 10.1016/j.neuron.2026.08.030; reported by tonight's review,
      not independently checked) found that blocking the CXCR3 receptor in tau mice roughly halved
      brain T cells and preserved substantially more tissue while tau itself was unchanged, with an
      antibody that stays outside the brain. That is the profile of a TOLERANCE mechanism - less
      damage per unit of pathology - which is what disease-tolerance-slope-endpoint proposes to
      measure. Human genetics can give a first check: do variants that lower the ligand CXCL10 in
      blood associate with lower Alzheimer's risk?
    novelty: >-
      Connects a new preclinical result to the catalogue's tolerance framing and gives it a
      genetics test that needs only summary statistics.
    against: >-
      Mouse only; tau-transgenic models translate poorly; CXCR3 blockade risks suppressing useful
      immunity; a blood protein level may not reflect the brain-border signal; and a new 2026 GWAS
      again places Alzheimer's heritability mainly in microglia, not T cells.
    falsify: >-
      By 2027-09-30: if cis-Mendelian-randomisation and colocalisation of plasma CXCL10 protein
      variants against open Alzheimer's GWAS summary statistics is null (interval includes no
      effect, or colocalisation probability below 0.5), there is no human genetic support.
    evidence: preclinical
    safety: "Immune blockade carries infection risk; this is a hypothesis for genetic testing only. Not medical advice."
    next: "Add to the drug-target-mr-pipeline queue once that pipeline has passed its known-control validation."
    sources:
      - "10.1016/j.neuron.2026.08.030"
      - "10.1126/science.1214935"
    history:
      - date: 2026-11-13
        note: "Created on the frontier-scan night; source paper taken from the review's report and flagged as not independently checked."
  - id: astrocyte-gate-or-artifact
    title: "Test whether the 'amyloid links to tau only with reactive astrocytes' finding is a gate or a cutoff artifact"
    created: 2026-11-17
    lens: modeling
    goal: understand
    status: investigating
    mechanism: >-
      In 1,016 cognitively unimpaired people, amyloid was associated with p-tau only in those with
      elevated blood GFAP, an astrocyte-reactivity marker (slope 0.34 vs 0.04; interaction 0.31;
      Bellaver 2023, 10.1038/s41591-023-02380-x). The causal reading is that reactive astrocytes
      GATE the amyloid-to-tau step. But GFAP rises with amyloid, falls when plaque is removed
      (10.1001/jamaneurol.2022.3392), and tau responds to amyloid only above a threshold - so
      splitting people on GFAP piles the high-amyloid range into the GFAP-positive group and can
      produce a steep slope there and a flat one elsewhere even if astrocytes do nothing. Tonight's
      model (scripts/astrocyte_gate_or_marker_2026_11_17.py) confirms it: in a synthetic world with
      NO gating, the stratified comparison and the plain interaction term "find a gate" in 97-100% of
      cohorts; only an interaction that lets amyloid's own effect be non-linear, or a longitudinal
      interaction, tells the two worlds apart (false-positive rate 1-2%).
    novelty: >-
      The literature review found no published test of the gate finding against this artifact, and
      replications so far use the same stratified or plain-interaction form.
    against: >-
      The original paper also reported a continuous-GFAP interaction and a small longitudinal tau-PET
      analysis (71 people), which the artifact explains less easily; and the model's effect sizes are
      assumed, so it shows what the analysis CAN be fooled by, not that it was.
    falsify: >-
      If, in the published cohorts, the amyloid-by-GFAP interaction on tau survives a flexible
      (spline or threshold) amyloid term - or baseline GFAP modifies LATER tau change given baseline
      amyloid and tau - the gate reading stands and this idea is wrong.
    evidence: in-silico
    safety: "A statistical-validity question; no intervention. Not medical advice."
    next: "Extend the model to match the published slopes, cutoff and GFAP-amyloid correlation; the real-data check needs the authors (data are on request to academic investigators only)."
    sources:
      - "10.1038/s41591-023-02380-x"
      - "10.1001/jamaneurol.2022.3392"
      - "10.1093/brain/awab223"
    history:
      - date: 2026-11-17
        note: "Created and modelled the same night (modeling lens, astrocyte as the starting cell). An earlier, stricter version of the stratified test never fired at this sample size, so a fairer version was added and both are reported."
  - id: reaccumulation-slope-readout
    title: "Use each person's amyloid re-growth rate after clearance as a readout of their production-clearance balance"
    created: 2026-11-17
    lens: modeling
    goal: detect
    status: new
    mechanism: >-
      After an antibody clears plaque and dosing stops, amyloid re-grows at a few Centiloids per
      year. That slope integrates a person's production minus clearance with the plaque burden reset
      to near zero - a cleaner view of the imbalance than the natural curve, where burden-dependent
      growth is mixed in. It could set re-dosing intervals per person and test proposed clearance
      factors (APOE type, sleep, vascular health) against a hard number.
    novelty: >-
      Published work reports population medians; treating the individual slope as a biomarker of
      clearance capacity, and comparing it with the same person's pre-treatment slope, is new.
    against: >-
      Two to three Centiloids a year is close to the repeatability of an amyloid PET scan, so
      individual slopes may be mostly noise for several years; blood markers may show rebound sooner
      and more cheaply; and the available rates are sponsor-modelled.
    falsify: >-
      If individual re-accumulation slopes do not differ by APOE type, age or any clearance proxy
      beyond scan test-retest noise, there is no personal signal to use.
    evidence: observational
    safety: "An analysis of scans taken anyway in trial extensions; no change to care. Not medical advice."
    next: "Look for published per-person or subgroup re-accumulation rates in the antibody trial extensions; individual data are access-controlled."
    sources:
      - "10.1002/alz.078175"
      - "10.1002/ana.24454"
    history:
      - date: 2026-11-17
        note: "Created on the modeling night from the revisit of clearance-threshold-onset; also the one test that could revive a capacity-threshold reading."
  - id: plaque-gfap-ptau-lag-test
    title: "Under plaque-removing treatment, does the astrocyte marker fall before the tau marker?"
    created: 2026-11-17
    lens: modeling
    goal: understand
    status: new
    mechanism: >-
      If reactive astrocytes sit between amyloid and tau, then when an antibody removes plaque the
      astrocyte marker (GFAP) should fall first and the tau marker (p-tau217) should follow, with
      GFAP change predicting p-tau change beyond what plaque change explains. If GFAP is only a
      readout of amyloid, both simply track plaque. Trial blood samples at fixed weeks make this a
      natural experiment on ordering.
    novelty: >-
      Uses a randomised perturbation of amyloid to test ordering, instead of cross-sectional
      association; the literature review found the gate question argued only from observational data.
    against: >-
      In the published donanemab data both markers had already fallen by week 12, so the sampling may
      be too coarse to see an order; and group means cannot show person-level mediation.
    falsify: >-
      If GFAP change adds nothing to predicting p-tau217 change once plaque change is in the model,
      or the two fall together at the earliest sample, the ordering test gives no support for a gate.
    evidence: RCT
    safety: "Secondary analysis of published trial biomarker data; no intervention. Not medical advice."
    next: "Fit a simple lagged chain (plaque to GFAP to p-tau) to the published week-12/24/76 means and see whether the data can distinguish any ordering at all."
    sources:
      - "10.1001/jamaneurol.2022.3392"
      - "10.1038/s41591-023-02380-x"
    history:
      - date: 2026-11-17
        note: "Created on the modeling night; graded RCT because the perturbation is randomised, though the analysis would be secondary and may be underpowered by coarse sampling."

  - id: driver-passenger-removal-ledger
    title: "A driver-or-passenger ledger: score every proposed cause by its human removal experiment"
    created: 2026-11-18
    lens: cross-domain
    goal: understand
    status: investigating
    mechanism: >-
      Restoration ecology settles whether a suspect is a driver of decline or a passenger of it with
      one experiment: remove it and see whether the community recovers (10.1890/04-0669). Applied to
      Alzheimer's, every proposed cause gets one ledger row - was it ever removed or boosted in a
      randomised human trial, did the target move, and what share of downstream decline stopped -
      so that amyloid (removed, about a quarter to a third of decline slowed), tau, microglial states
      (TREM2 agonist: target engaged, no benefit, vascular side effects) and others are compared on
      the same scale instead of by how often they correlate with disease.
    novelty: >-
      Reviews list failed trials by mechanism, but we found no table that scores each proposed
      cause by removal fraction with an explicit third category for a back-seat driver (a passenger
      that later reinforces the damage, 10.1007/s10530-011-0165-x). Checked against our own
      catalogue: it would give several ideas a common test they currently lack.
    against: >-
      A failed removal does not prove a passenger. In a review of 151 ecological removal studies
      about 31% showed no recovery or net harm even for real invaders (10.1007/s10530-017-1542-x),
      because of wrong timing, lingering damage or a second invader moving in. Trials differ in
      stage, dose and duration, so a single removal fraction per cause may be false precision.
    falsify: >-
      Build the ledger for ten proposed causes from published trial results. If it does not change
      the ranking of at least two ideas in this catalogue, or if every row ends as "cannot tell:
      wrong stage", the ledger adds nothing and is killed.
    evidence: RCT
    safety: "A reading discipline for published trials; no intervention. Not medical advice."
    next: "Draft the first ten rows from trials already graded in evidence/claims.yaml and see whether any catalogue idea moves."
    sources:
      - "10.1890/04-0669"
      - "10.1007/s10530-011-0165-x"
      - "10.1007/s10530-017-1542-x"
      - "10.3389/fnagi.2025.1576020"
    history:
      - date: 2026-11-18
        note: "Created on the cross-domain night under the ecosystem constraint. The ecology sources were read as abstracts by a research assistant; the TREM2-agonist result is from company and press reports plus a review, not a results paper."
      - date: 2026-11-19
        note: "First twelve rows drafted in the log of 2026-11-19 from graded trials. Early yield: three causes have never had a true removal experiment (sleep irregularity, co-pathology, tau at a low dose), two removals moved the target with no clinical benefit, and the one partial driver (plaque) behaves like a fixed slice. It changed two catalogue entries the same night (sleep-regularity-vs-duration parked; a dose-inversion idea added), so the kill criterion is not met and the ledger continues."

  - id: donor-liver-apoe-natural-experiment
    title: "Liver transplants as a natural experiment: does a donor liver's APOE type change the recipient's Alzheimer's markers?"
    created: 2026-11-18
    lens: cross-domain
    goal: understand
    status: new
    mechanism: >-
      Blood APOE is made by the liver and brain APOE by the brain, and after a liver transplant the
      recipient's blood APOE switches to the donor's type while the brain's stays their own
      (10.1172/JCI115288). Recipients of an APOE4 liver versus an APOE3 liver are therefore a human
      test of whether APOE4 in the blood alone is a driver of Alzheimer's changes, as mice that carry
      APOE4 only in the liver suggest (10.1038/s41593-022-01127-0), or only a marker of brain risk.
    novelty: >-
      Two searches (a research assistant's and ours) found no human study of dementia, cognition or
      Alzheimer's blood markers by donor-liver APOE type; the nearest work is in mice with humanised
      livers (10.1038/s41380-022-01548-0). A funded study of cognition after liver transplant exists
      (about 2,000 recipients planned), so the cohort is being assembled without this question.
    against: >-
      Donor APOE type is not routinely recorded, so stored donor tissue or DNA would be needed.
      Recipients are few, ill, on immune-suppressing drugs that may themselves alter dementia risk,
      and often have liver-related confusion; follow-up is short against a decades-long disease.
      Blood APOE also changes blood marker levels directly, so a marker difference could be
      chemistry, not brain disease. The mouse result is from one laboratory.
    falsify: >-
      In a transplant cohort with donor genotype, compare recipients of APOE4 and non-APOE4 livers,
      adjusting for the recipient's own type: no difference in the change of blood p-tau217 or in
      amyloid imaging over five or more years, with a confidence interval excluding a modest effect,
      means blood APOE4 is not a driver on that timescale.
    evidence: preclinical
    safety: "Observational; uses transplant-registry data that need an approved application and are not handled in this repository. Not medical advice."
    next: "Find out whether any liver-transplant cognition cohort stores donor DNA or donor APOE type; this is a question for the investigators."
    sources:
      - "10.1172/JCI115288"
      - "10.1038/s41593-022-01127-0"
      - "10.1038/s41380-022-01548-0"
    history:
      - date: 2026-11-18
        note: "Created on the cross-domain night. The 1991 transplant observation was confirmed through later reviews, not the original paper. A blood-stem-cell-transplant version was considered and set aside: ordinary transplants replace only about 1-25% of brain immune cells (10.1182/bloodadvances.2023010409), too little exposure for a clean test."

  - id: census-closure-absolute-count-audit
    title: "Audit brain-atlas claims that a glial cell type expands: shares of a census cannot show it"
    created: 2026-11-18
    lens: cross-domain
    goal: understand
    status: investigating
    mechanism: >-
      Single-nucleus atlases report each cell type as a share of the nuclei sequenced, and when
      neurons are lost every other share rises although no cell was added - the closure problem
      ecologists met in species censuses (10.3389/fmicb.2017.02224). Any claim that a glial state
      increases with disease therefore needs either a reference cell type shown to be stable or an
      absolute count per unit of tissue; our simulation shows what each analysis concludes when
      neurons are lost and glia do not change.
    novelty: >-
      The statistical remedy exists (10.1038/s41467-021-27150-6) and the best-known atlas confirmed
      its early interneuron loss against spatial imaging (10.1038/s41593-024-01774-5, agreement
      R = 0.84 as reported). What we did not find is the same absolute-count check for the claimed
      glial expansions, or a statement of which reference type each atlas assumed stable.
    against: >-
      The atlases may already handle this in their methods sections, which we did not read; the
      spatial check they did publish compares shares with shares in part. If oligodendrocytes or
      astrocytes are themselves lost, no reference is safe, and absolute counts are noisier and
      depend on tissue shrinkage. Our simulation's effect sizes are assumed.
    falsify: >-
      Read the methods of the three large atlases. If each glial-expansion claim is already backed
      by an absolute density or a justified stable reference, the audit is redundant and is killed.
      If not, the open atlas's spatial counts per unit area can test one claim directly.
    evidence: in-silico
    safety: "Re-analysis question about published donor-level atlases; no intervention. Not medical advice."
    next: "Read the three atlases' methods for the abundance model and reference type; list which glial claims have an absolute-count check."
    sources:
      - "10.3389/fmicb.2017.02224"
      - "10.1038/s41467-021-27150-6"
      - "10.1038/s41593-024-01774-5"
      - "10.1016/j.cell.2023.08.039"
    history:
      - date: 2026-11-18
        note: "Created and modelled on the cross-domain night (scripts/ecosystem_census_closure_2026_11_18.py): with neurons lost and glia unchanged, raw shares reported a microglial increase in 76% of simulated studies (apparent +20%); a ratio to oligodendrocytes was correct unless oligodendrocytes were also lost (then 75% false); a ratio to a stable type and absolute counts stayed quiet (1-3%), with absolute counts detecting a real 30% increase in 65% of studies against 85% for the ratio."

  - id: build-before-lock-sequencing
    title: "In a system that both builds and removes, the order of drugs matters: test build-first for synapses"
    created: 2026-11-18
    lens: cross-domain
    goal: reverse
    status: new
    mechanism: >-
      Bone is rebuilt and removed by coupled cells, and bone medicine found that order matters: a
      building drug given first and then locked in with a removal-blocking drug gained far more hip
      bone than the reverse order (at least 6% gain in 69% versus 15% of patients,
      10.1007/s00198-021-06174-0), because blocking removal also damps building. Synapses are
      likewise built and pruned by coupled processes - immune cells that prune also support
      learning-driven synapse formation in mice (10.1016/j.cell.2013.11.030) - so a pruning blocker
      given first might blunt any synapse-building treatment given after it.
    novelty: >-
      Combination proposals for synapse protection discuss which agents, not their order. We found
      no animal study comparing build-then-block with block-then-build for synapses; this is a
      prediction carried over from bone, not an observed brain effect.
    against: >-
      The bone result comes from comparisons across trials, not a randomised test of order, and
      part of it reflects rebound after one drug is stopped. Adult cortex has no remodelling unit
      like bone, synapse loss in Alzheimer's is driven by toxic proteins more than by normal
      turnover, and no drug has yet been shown to raise synapse density in people. Pruning blockade
      protects synapses in mouse models (10.1126/science.aad8373), which may simply outweigh any
      order effect.
    falsify: >-
      A four-arm mouse study (builder then blocker, blocker then builder, both together, neither)
      with synapse density as the readout: if order makes no difference beyond the sum of the two
      drugs, the bone analogy does not transfer and the idea is killed.
    evidence: none
    safety: "Hypothesis for an animal experiment only; blocking immune pruning carries infection and autoimmunity risks in people. Not medical advice."
    next: "Search for any published animal study that varied the order of a plasticity-promoting and a pruning-blocking treatment."
    sources:
      - "10.1007/s00198-021-06174-0"
      - "10.1016/j.cell.2013.11.030"
      - "10.1126/science.aad8373"
    history:
      - date: 2026-11-18
        note: "Created on the cross-domain night. Graded none: an analogy from bone medicine with mouse support for each half but no test of the order itself. The two mouse papers are cited from memory and were not re-read on this night."

  - id: fixed-slice-not-fixed-share
    title: "Plaque removal may subtract a fixed slice of decline, not a fixed share"
    created: 2026-11-19
    lens: causal-chain
    goal: understand
    status: new
    mechanism: >-
      In the donanemab trial the absolute benefit on the main clinical scale was the same in people
      with low-to-medium tau (0.67 points) and, post hoc, in people with high tau (0.69 points),
      although the high-tau group declined much faster (10.1001/jama.2023.13239). That pattern fits
      a decline made of two parts: an amyloid-dependent slice of roughly constant size that the
      drug removes, and a tau-linked part that grows with stage and that the drug does not touch.
      "Percent slowing" then shrinks with stage by arithmetic, not because the drug works less.
    novelty: >-
      The high-tau result is usually reported as "less benefit in advanced disease". Reading it as
      an equal absolute slice, and using that to size what a tau-directed add-on must do at each
      stage, is our framing; we have not found it stated as a testable decomposition.
    against: >-
      On the trial's other main scale the absolute benefit at high tau was much smaller and not
      significant (1.26 versus 3.25 points), so the equality may be a quirk of one scale. The
      high-tau analysis is post hoc with a wide interval (0.20 to 1.19). Scales have floor and
      ceiling effects that distort absolute comparisons across stages.
    falsify: >-
      Tabulate absolute benefit by baseline tau level for every scale in both antibody trials. If
      absolute benefit falls with tau on most scales, the fixed-slice reading is dead and benefit
      really does shrink with stage.
    evidence: RCT
    safety: "Re-reading of published trial results; no intervention. Not medical advice."
    next: "Collect the published by-tau-level absolute differences for both antibodies on every reported scale."
    sources:
      - "10.1001/jama.2023.13239"
      - "10.1056/NEJMoa2212948"
    history:
      - date: 2026-11-19
        note: "Created on the causal-chain night. The two subgroup figures were re-checked against published summaries of the paper; the comparison between subgroups is ours and was not a planned trial analysis."

  - id: benefit-timing-shape-test
    title: "Read the shape of benefit over time to tell plaque mass from a fast switch"
    created: 2026-11-19
    lens: causal-chain
    goal: understand
    status: investigating
    mechanism: >-
      If decline tracks the amount of plaque still present, benefit should start small and grow as
      plaque clears over many months; if the drug instead turns off a fixed part of decline within
      weeks (for example by neutralising a soluble toxic form), benefit should appear at full
      strength early. The two accounts fit the same 18-month result but differ at 6 months and
      imply very different answers to how much of the decline amyloid is driving (27% versus 57%
      in our model).
    novelty: >-
      The plaque-versus-soluble-form debate is old, but it is argued from biochemistry and
      marketing claims. We found no independent analysis that fits the published visit-by-visit
      differences of the antibody trials to competing time-shapes; the visit data are in the
      papers' figures.
    against: >-
      The 6-month interval (0.05 to 0.29) includes both accounts. Early differences could come
      from unblinding by side effects, and later ones from who stays in the trial. Our clearance
      time constant is assumed, and long-term numbers come from an uncontrolled extension.
    falsify: >-
      Fit both shapes to every randomised visit (3 to 18 months) of the lecanemab and donanemab
      trials, using each drug's own clearance curve. If neither shape is favoured once the visit
      intervals are respected, the published data cannot answer the question and the idea is parked.
    evidence: RCT
    safety: "Analysis of published group-level trial results; no intervention. Not medical advice."
    next: "Extract the visit-by-visit differences and intervals from the two trial papers and repeat the fit; add the antibody that cleared plaque slowly and failed as a third case."
    sources:
      - "10.1056/NEJMoa2212948"
      - "10.1002/alz70861_108905"
      - "10.1001/jama.2023.13239"
    history:
      - date: 2026-11-19
        note: "Created and modelled on the causal-chain night (scripts/residual_decline_decomposition_2026_11_19.py). Calibrated to 0.45 points at 18 months, a fast switch predicts 0.15 at 6 months, plaque-tracking 0.08 and a nine-month downstream lag 0.03; the trial reported 0.17 (0.05 to 0.29). The lagged account is excluded (it would also need amyloid to drive more than 100% of decline); the other two are not separated by the public numbers."

  - id: copathology-pooled-interaction-test
    title: "Does a second brain disease blunt antibody benefit? Only a pooled, whole-trial test can say"
    created: 2026-11-19
    lens: causal-chain
    goal: understand
    status: new
    mechanism: >-
      About a fifth to nearly half of amyloid-positive symptomatic people also carry Lewy-body
      disease, and many carry TDP-43 or vessel damage; these speed decline and are untouched by
      plaque removal (10.1038/s41591-023-02449-7; 10.1186/s13024-025-00822-3). If that is why
      benefit is modest, marker-positive trial participants should show smaller benefit. Our model
      shows the test needs far more people than a spinal-fluid substudy holds, so it has to use a
      marker every participant has (the baseline scan) and pool trials.
    novelty: >-
      No published antibody trial has been analysed by co-pathology; the first such analysis, in a
      spinal-fluid substudy, was scheduled for a conference on the day this was written (as
      reported; results not seen). Our contribution is the power statement made in advance and the
      pooled, scan-based design.
    against: >-
      Measured brain diseases together explain only about 43% of the variation in late-life
      decline (10.1093/brain/awab092), so co-pathology cannot be the whole story. Trials excluded
      people with heavy vessel damage or Lewy-type symptoms, narrowing the range. There is no
      validated test for TDP-43 disease in living people, and sponsors may not pool data.
    falsify: >-
      A pooled analysis of two or more antibody trials with a whole-trial co-pathology marker and
      about 90% power to detect "no benefit in marker-positive people": if benefit is the same in
      both groups, co-pathology is not what limits the drugs.
    evidence: observational
    safety: "Secondary analysis of existing trial data held by sponsors; no intervention. Not medical advice."
    next: "Read the conference result when published and compare it with the power we computed; check whether any sponsor has announced a scan-based analysis."
    sources:
      - "10.1038/s41591-023-02449-7"
      - "10.1186/s13024-025-00822-3"
      - "10.1093/brain/awab092"
      - "10.1002/ana.25123"
    history:
      - date: 2026-11-19
        note: "Created and modelled on the causal-chain night. With the spread implied by the lecanemab trial (SD 2.34 points) and 25% marker-positive, a test for zero benefit in marker-positive people has about 15-20% power in a substudy of 281-410 people, 64% in one whole trial and 91% in two pooled. Prediction recorded before seeing the conference result: a substudy finding of no difference by marker status is uninformative."

  - id: tau-antisense-dose-inversion
    title: "The tau antisense drug's upside-down dose response: look for dose-related harm and test lower doses"
    created: 2026-11-19
    lens: causal-chain
    goal: slow
    status: new
    mechanism: >-
      In the phase 2 trial of the tau-lowering antisense drug, tau fell more at higher doses but
      the clinical signal was strongest at the lowest dose, at 76 weeks and again at 96 weeks
      (company and funder reports). One explanation is that benefit from lowering tau saturates
      early while a cost rises with dose - either loss of tau's normal function or a harm of the
      drug class given into the spinal fluid. The same class showed this in Huntington's disease,
      where the more frequent dosing did worse than placebo with rising markers of nerve injury
      and enlarging brain ventricles (10.1056/NEJMc2300400, as summarised).
    novelty: >-
      The sponsor reads the result as support for advancing the drug; commentators call it
      unexplained. We have not seen the specific proposal to test the two cost explanations
      against each other with dose-ordered injury markers, or to carry a dose below the phase 2
      minimum into the next trial with a curvature test as primary.
    against: >-
      The simplest reading is noise: the primary endpoint was missed, the low-dose group was small
      and the differences were not significant, and the placebo group crossed over before 96
      weeks. Adverse events were reported as similar across doses. The Huntington's drug hits a
      different target in a different disease.
    falsify: >-
      If nerve-injury markers and ventricle size in the phase 2 data show no ordering by dose, and
      a lower dose in the next trial does no better than the higher ones, the inversion was chance.
    evidence: RCT
    safety: "Concerns a drug given by spinal injection in trials only; nothing here is a dosing suggestion. Not medical advice."
    next: "When the phase 2 paper appears, read the dose-by-dose tables for nerve-injury markers and ventricle volume; check the phase 3 dose arms on the registry."
    sources:
      - "10.1056/NEJMc2300400"
      - "NCT05399888"
    history:
      - date: 2026-11-19
        note: "Created on the causal-chain night. The trial figures are from press releases and funder statements, not a peer-reviewed paper; the Huntington's comparison was checked only against secondary summaries. Links to remyelination-nonmonotone-trial-design, whose simulation shows a top-dose or rising-trend test has almost no power for this shape."
      - date: 2026-11-20
        note: "2026-11-20, new detail (conference coverage and a reader's digitised figures, not sponsor tables): spinal-fluid tau fell about 52%, 59% and 65% across the three arms while scan signal fell in all three; confusion was reported in 13% at the lowest dose versus 25-28% at the higher ones and 5% on placebo, with more drop-outs and serious events at the top dose. Earlier, the first trial reported slightly larger ventricles on drug than placebo (10.1038/s41591-023-02326-3, as reported). A second way to split the two cost explanations now exists: an injectable RNA drug given under the skin lowered spinal-fluid tau by 40-73% in healthy volunteers (press coverage). If harm at high knock-down appears with that route too, it is loss of tau; if not, it is the spinal-injection drug class."

  - id: step-slope-stop-signature
    title: "Classify every benefit claim as fading step, lasting step or slope - and require a randomised stop before calling it reversal"
    created: 2026-11-20
    lens: reversal-biology
    goal: reverse
    status: investigating
    mechanism: >-
      Combines benefit-timing-shape-test with reversible-ceiling-staging. A quick gain that fades is
      what placebo and practice produce; a quick gain that lasts while decline continues is restored
      function or a symptomatic lift; no quick gain but slower decline is slowing. The first two
      separate only when treatment is stopped: restored function stays, a symptomatic lift goes
      (as it did within six weeks of stopping donepezil, PMID 9443470, and over a year in the
      DOMINO trial, 10.1056/NEJMoa1106668). The size of the lasting step is a direct measure of the
      reversible ceiling for that treatment.
    novelty: >-
      Delayed-start and randomised-withdrawal designs are established for telling symptomatic from
      disease-modifying drugs. Using the same shapes as a reading rule for reversal claims, and
      the fitted step as an estimate of how much function a treatment can restore, is our
      combination; we found no report that fits a step to the antibody trials.
    against: >-
      Two randomised visits are too few to separate a small step from a slope, and the two
      estimates are correlated. A treatment could restore function slowly, which would look like a
      slope. Stopping a treatment that may be working raises ethical and practical problems.
    falsify: >-
      Apply the rule to every claim in evidence/claims.yaml with visit-by-visit data. If it cannot
      classify most of them, or classifies a known symptomatic drug as reversal, the rule is not
      usable and is killed.
    evidence: RCT
    safety: "A reading rule and trial-design suggestion; no intervention. Not medical advice."
    next: "Extract visit-by-visit differences for both antibodies and the cholinesterase-inhibitor washout trials, and fit step and slope with proper intervals."
    sources:
      - "10.1056/NEJMoa2212948"
      - "10.1056/NEJMoa1106668"
      - "NCT01409915"
    history:
      - date: 2026-11-20
        note: "Created and modelled on the reversal-biology night (scripts/step_or_slope_2026_11_20.py). From the two randomised visits in the public record, the lecanemab benefit splits into a step of +0.03 CDR-SB points (95% range -0.18 to +0.24) and a slope of 0.28 points per year: all slowing, with at most about 8% of the existing deficit restored. The sargramostim trial's posted results show a fading step on one scale only. A new uncontrolled stem-cell report shows a gain at 12 weeks that faded within a year: the fading-step shape."

  - id: cue-rescue-recoverable-window
    title: "Use cue-rescued recall as the human readout of memories that are silenced, not lost"
    created: 2026-11-20
    lens: reversal-biology
    goal: reverse
    status: new
    mechanism: >-
      Combines silent-engram-recoverable-window with improvement-endpoint-validation. In a
      free-and-cued recall test, people whose recall becomes normal when given cues still hold the
      memory and cannot retrieve it; people whose recall stays low with cues have lost storage.
      The staging system built on this predicts progression and tracks tau and hippocampal size
      (10.1016/j.dadm.2017.12.004; PMID 35197359). A reversal treatment should first raise free
      recall in the cue-rescued stages, and only a rise in cued recall would mean storage rebuilt.
    novelty: >-
      The staging is used for prognosis and trial enrichment. A research assistant's search found
      no study using cue rescue to predict or measure response to any treatment, and none linking
      it to synapse imaging; the one large trial that collected it pooled its arms.
    against: >-
      Cue rescue may reflect attention or strategy, not silenced memory traces; the mouse work
      reactivated cells directly, which a verbal cue does not do. The test has a ceiling and
      practice effects, the stages have fuzzy edges, and its developer receives royalties on it.
      Movement back to a lower stage could be noise unless alternate forms and a reliable-change
      threshold are used.
    falsify: >-
      In any randomised trial that collected this test, compare stage movement between arms. If
      no treatment, including a symptomatic drug that demonstrably lifts other scores, ever moves
      free recall in the cue-rescued stages more than placebo, the readout does not capture
      recoverable memory.
    evidence: observational
    safety: "A measurement proposal; the test is a standard paper-and-pencil memory task. Not medical advice."
    next: "Find which completed randomised trials collected the free-and-cued test and whether stage movement by arm was ever reported."
    sources:
      - "10.1016/j.dadm.2017.12.004"
      - "10.1016/j.tjpad.2026.100641"
      - "10.1038/nature17172"
    history:
      - date: 2026-11-20
        note: "Created on the reversal-biology night. Stage shares in amyloid-positive, clinically normal people (as reported from the full text, n=911): no impairment 45%, cue-rescued 37% and 14%, storage loss about 4%. Hazard of progression roughly 1.5, 1.8 and 3.0 times across those groups."

  - id: tau-halting-dose-ladder
    title: "Find the smallest cut in tau production that halts build-up, instead of the largest that is tolerated"
    created: 2026-11-20
    lens: reversal-biology
    goal: stop
    status: new
    mechanism: >-
      Combines identify-autocatalysis-rate with tau-antisense-dose-inversion. Tau build-up has a
      slow net growth rate (about 0.11-0.14 per year), which means growth and clearance are nearly
      balanced, so a modest cut in production could tip the balance. Every trial arm with scans so
      far cut spinal-fluid tau by about half or more and scan signal fell in all of them, while
      side effects rose with dose. The useful dose is therefore the smallest one at which scan
      signal stops rising, which a ladder of two or three lower doses would locate.
    novelty: >-
      The development programme tested doses from about 50% lowering upward and is advancing them.
      We found no proposal to locate the halting dose below that range; a crude straight-line
      reading of digitised conference figures puts it near 30-35% lowering, which no arm with scans
      has tested.
    against: >-
      The extrapolation rests on a reader's digitised figures and assumes a straight line. Scan
      signal can fall because tissue shrinks, and ventricles were slightly larger on drug, so a
      fall is not proof of less tau. Halting tau did not translate into clear clinical benefit, and
      spinal-fluid tau may not track what neurons make.
    falsify: >-
      A trial arm with 25-35% lowering and tau scans: if scan signal keeps rising at close to the
      placebo rate, the halting dose is not below the tested range and the idea is dead.
    evidence: RCT
    safety: "Concerns drugs given by injection in trials only; nothing here is a dosing suggestion. Not medical advice."
    next: "When the phase 2 paper appears, take the sponsor's per-dose scan and spinal-fluid values and redo the interpolation with intervals."
    sources:
      - "10.1001/jamaneurol.2023.3861"
      - "10.1038/s41591-023-02326-3"
      - "10.1371/journal.pbio.3003241"
      - "10.1126/sciadv.abh1448"
    history:
      - date: 2026-11-20
        note: "Created and modelled on the reversal-biology night (scripts/tau_knockdown_ladder_2026_11_20.py). In a self-amplifying model with a five-year doubling time, the halting dose is about one minus the share of amplification that clearance already cancels; if scan signal falls at 50% lowering, that share is at least half. The same ladder locates a halting dose if tau instead comes from fixed regional sources, so the practical answer does not depend on settling the mechanism."

  - id: half-improved-means-halted
    title: "When half of a treated group 'improves', decline has stopped on average - a testable claim for the low-tau window"
    created: 2026-11-20
    lens: reversal-biology
    goal: stop
    status: new
    mechanism: >-
      Combines fixed-slice-not-fixed-share with practice-curve-deviation-endpoint. A group whose
      average does not change has about half its members score better and half worse, so "51%
      improved" in people with little tau on lecanemab at three years means the average stood
      still, not that function returned. If plaque removal subtracts a fixed slice of decline, and
      in people with little tau that slice is about the whole of their decline, treatment would
      halt the disease in that window while only slowing it later.
    novelty: >-
      The improvement percentages are quoted by the sponsor as signs of benefit. Converting them
      into the implied average change, and tying a "halted in the low-tau window" prediction to
      the fixed-slice idea, is our combination.
    against: >-
      The low-tau group is a post hoc subgroup of about 41 people, followed open-label with no
      concurrent placebo after 18 months and only among those who stayed. The implied average at
      three years has a wide range (-0.36 to +0.43 SD). Coarse scales with many unchanged scores
      blur the conversion.
    falsify: >-
      The placebo-controlled prevention trials now running in people with amyloid and little tau:
      if treated groups still decline measurably on average, plaque removal does not halt disease
      even in that window.
    evidence: RCT
    safety: "Re-reading of published trial summaries; no intervention. Not medical advice."
    next: "Get the low-tau group sizes and mean changes by arm at 18 months, and compare the treated mean change with zero directly."
    sources:
      - "10.1056/NEJMoa2212948"
      - "10.1002/alz70861_108905"
    history:
      - date: 2026-11-20
        note: "Created and modelled on the reversal-biology night (scripts/step_or_slope_2026_11_20.py, part 4). Reported shares improved convert to implied average changes of +0.25 SD (low-tau, treated, 18 months), -0.58 SD (low-tau, placebo, 18 months) and +0.03 SD (low-tau, treated, three years). The 18-month figures are from conference coverage and the three-year figure from a company release."

  - id: brainstem-sparing-sleep-readout
    title: "Resilience may live in spared brainstem nuclei, with sleep physiology as their readable output"
    created: 2026-11-21
    lens: resilience
    goal: understand
    status: new
    mechanism: >-
      In people with the heaviest cortical tau stage, those who never became demented had much
      less tau in the locus coeruleus and raphe nuclei than those who did (15 versus 15,
      10.1186/s40478-025-02167-w), and more surviving locus coeruleus neurons predict slower
      decline independent of other pathology (10.1212/WNL.0b013e3182897103). These nuclei also
      shape deep sleep and spindles. So deep sleep may look like a tolerance factor because it
      reads out the state of the brainstem nuclei that actually confer tolerance.
    novelty: >-
      Sleep is argued to be either a reserve factor or a readout of damage. Treating it as the
      readout of a specific resilience organ reconciles the two and makes a test: the apparent
      buffering by deep sleep should vanish once brainstem integrity is measured. A research
      assistant found no study of sleep or sleep nuclei in resilient brains.
    against: >-
      The autopsy comparison is 15 people per group and measured tau deposits, not neuron counts,
      with no sleep data. The imaging links between brainstem integrity and sleep come from
      samples of 39 to 58. A pooled analysis of five cohorts found no link between sleep
      architecture and later dementia (4,657 people, 10.1093/sleep/zsaf129). The imaging
      correlations are as reported from abstracts and were not checked by us.
    falsify: >-
      In a cohort with brainstem imaging, sleep recordings, tau level and cognition: if deep-sleep
      measures still buffer the effect of tau on cognition after brainstem integrity is in the
      model, sleep is not merely its readout and the idea is dead.
    evidence: observational
    safety: "An analysis proposal; no intervention. Not medical advice."
    next: "Find any cohort with both locus coeruleus imaging and overnight EEG in amyloid-positive people, and whether the mediation was tested."
    sources:
      - "10.1186/s40478-025-02167-w"
      - "10.1212/WNL.0b013e3182897103"
      - "10.1093/sleep/zsaf129"
    history:
      - date: 2026-11-21
        note: "Created on the resilience night under the sleep constraint. The autopsy comparison and the five-cohort null were checked against their abstracts; the neuron-count study and the imaging links are as reported by a research assistant. A candidate sibling idea - that longer sleep and napping are the cost of coping - was dropped before entry: napping rises after diagnosis and genetic studies point from disease to napping (10.1002/alz.12636; 10.3233/JAD-220497, as reported)."

  - id: slow-wave-power-reserve-marker
    title: "Test at-home slow-wave power as the cheap 'reserve' half of a stay-well test"
    created: 2026-11-21
    lens: resilience
    goal: detect
    status: new
    mechanism: >-
      Predicting who stays well needs a measure of reserve alongside the amount of tau. The best
      current one needs spinal fluid. Slow-wave power from a headband recording is stable from
      night to night and tracks cognition in older adults (10.1093/sleep/zsaf129 for the pooled
      null on architecture; 10.1093/sleep/zsaf329 for stability), and in one study more of it went
      with better memory only in amyloid-positive people (10.1186/s12916-023-02811-z). Our model
      says a reserve marker must correlate about 0.5 with true reserve to add a useful 0.03-0.04
      to prediction, and about 0.7 to add as much as a perfect rate measurement.
    novelty: >-
      No study has tested whether deep sleep at baseline predicts who stays well among unimpaired
      people with both amyloid and tau (as reported). Framing it as one half of a two-part test
      with a stated validity bar is ours.
    against: >-
      The supporting study had 62 people, one night, no tau adjustment, and its amyloid-positive
      group had more slow-wave activity, which fits compensation or over-excitability as well as
      reserve. Tau itself produces abnormal slow waves, so the marker may only re-measure tau.
      The five-cohort pooled analysis was null for delta power and dementia.
    falsify: >-
      In a cohort with at-home sleep EEG, a tau measure and three or more years of follow-up: if
      slow-wave power adds less than 0.02 AUC to tau level for predicting who stays unimpaired,
      it is not a usable reserve marker.
    evidence: observational
    safety: "A measurement proposal using a consumer-style headband; no intervention. Not medical advice."
    next: "List cohorts that have overnight EEG plus a tau measure in unimpaired amyloid-positive people; watch the registered sound-stimulation trial that stratifies by blood p-tau217 (NCT07529015), the first design able to test whether benefit depends on pathology."
    sources:
      - "10.1186/s12916-023-02811-z"
      - "10.1093/sleep/zsaf329"
      - "10.1093/sleep/zsaf129"
    history:
      - date: 2026-11-21
        note: "Created on the resilience night. Validity bar from scripts/nonprogressor_two_marker_2026_11_21.py (assumed parameters): level plus a marker of validity 0.3, 0.5, 0.7 gives AUC 0.84, 0.87, 0.90 when people differ little in rate, against 0.83 for level alone."

  - id: level-twice-before-rate
    title: "For prognosis, measure the level twice now before waiting years for a rate"
    created: 2026-11-21
    lens: resilience
    goal: detect
    status: investigating
    mechanism: >-
      A personal rate of tau build-up needs two scans years apart, and at published scan precision
      a two-year rate is mostly noise. Our model shows that most of the predictive gain from the
      second scan comes from pinning down the level better, which an immediate repeat measurement
      gives without the wait. For a blood marker that varies 6-10% within a person from week to
      week (10.1002/alz.13518), averaging two or three draws should sharpen prognosis the same way.
    novelty: >-
      Studies report that baseline levels beat slopes, and repeat-sampling studies report
      within-person variation, but we found no proposal to use immediate repeat measurement as a
      deliberate substitute for a slope, or a head-to-head test of the two.
    against: >-
      If people differ a lot in their true rates, the rate carries real extra information and
      this shortcut loses it; our model shows a gain of 0.05-0.07 AUC from the rate in that case.
      Scan errors on the same day may be correlated, so a repeat may sharpen less than assumed,
      and a second scan costs money and radiation.
    falsify: >-
      In any dataset with three or more visits: if level plus slope predicts decline clearly
      better than the average of the first two measurements, the personal rate matters and the
      shortcut fails.
    evidence: in-silico
    safety: "A measurement-design suggestion; repeat scans add radiation dose, repeat blood draws do not. Not medical advice."
    next: "Look for published analyses that compare an averaged baseline with a slope for blood p-tau217; several cohorts have the visits."
    sources:
      - "10.1002/alz.70435"
      - "10.1002/alz.13518"
      - "10.1093/brain/awy059"
    history:
      - date: 2026-11-21
        note: "Created and modelled on the resilience night (scripts/nonprogressor_two_marker_2026_11_21.py). With scan error 0.04 SUVR and little true spread in rates: one scan AUC 0.825, an immediate repeat 0.841, a scan two years later 0.848, level and rate known perfectly 0.872. With a wide spread in rates the two-year scan reaches 0.855 against 0.797 for the repeat."

  - id: short-sleeper-variant-natural-experiment
    title: "Natural short sleepers as a test of whether less sleep, by itself, harms the brain"
    created: 2026-11-21
    lens: resilience
    goal: understand
    status: new
    mechanism: >-
      A few families carry variants that let them sleep four to six hours with no apparent cost.
      If short sleep itself drove Alzheimer's changes, carriers should fare worse; in mouse models
      two of these variants instead reduced tau and plaque (10.1016/j.isci.2022.103964), and a
      third restored dream sleep and cut tau spread (10.1073/pnas.2221686120). That points to
      sleep quality or efficiency, not hours, as what matters, and to these genes as candidate
      resilience mechanisms.
    novelty: >-
      The mouse work is published; no human evidence on dementia in carriers was found. Gene-level
      look-ups in two open, no-login portals were run for us tonight and showed nothing, but those
      tests pool all damaging variants in a gene and cannot see these specific alleles.
    against: >-
      The variants are very rare, so there may never be enough carriers to test. The mouse groups
      were small (3 to 17 per group) and one variant raised insoluble amyloid at an early age. All
      the mouse work comes from one research group. Carriers may differ in many other ways.
    falsify: >-
      If the specific alleles can be counted in an open variant browser and carriers show the same
      or higher dementia rates than non-carriers, or if a second laboratory fails to reproduce the
      mouse protection, the idea is dead.
    evidence: preclinical
    safety: "A genetic natural experiment; not a suggestion to sleep less. Not medical advice."
    next: "Check allele counts for the specific variants in an open population-frequency browser to see whether any human test is possible at all."
    sources:
      - "10.1016/j.isci.2022.103964"
      - "10.1073/pnas.2221686120"
    history:
      - date: 2026-11-21
        note: "Created on the resilience night under the sleep constraint. The mouse paper was checked against its abstract. Portal look-ups (as reported by a research assistant, not independently checked): no burden signal below p = 0.01 for the four short-sleep genes against dementia codes in one portal; nothing near significance in the other."

  - id: stored-sample-dopegal-test
    title: "Use stored samples from a finished noradrenaline-drug trial to test the enzyme-to-tau chain cheaply"
    created: 2026-11-22
    lens: red-team
    goal: understand
    status: new
    mechanism: >-
      One theory holds that a breakdown product of noradrenaline in the locus coeruleus triggers
      an enzyme that clips tau and starts tangles. A finished randomised trial of an approved
      noradrenaline-raising drug already lowered the downstream breakdown marker in spinal fluid
      (p < 0.0001) and lowered tau markers by about 5% (10.1093/brain/awab452). If the chain is
      real, people whose breakdown marker fell most should show the largest fall in tau, and the
      clipped-tau fragment should move with it. The samples exist; no new patients are needed.
    novelty: >-
      The trial reported the two changes separately. We found no analysis linking them person by
      person, or measuring the clipped fragment in those samples; it would test a mechanism that
      no independent laboratory has yet reproduced.
    against: >-
      Only 36 people, with a crossover design and no washout, so person-level correlations will be
      noisy. The fragment in spinal fluid reflects late tangle load, not early enzyme activity
      (10.1093/brain/awz346), so a null would not be decisive. The drug works on reuptake, not on
      the enzyme, and a same-class drug worsened tau in mice (10.1111/acel.14420).
    falsify: >-
      If the fall in the breakdown marker does not correlate with the fall in tau markers across
      people, and the clipped fragment does not move, the chain has no support in the only human
      perturbation data available and the parent idea is killed.
    evidence: RCT
    safety: "Secondary analysis of stored trial samples held by the trial's investigators; no intervention. Not medical advice."
    next: "Check whether the trial's stored samples and per-person marker changes are available to outside researchers; this is a question for its investigators."
    sources:
      - "10.1093/brain/awab452"
      - "10.1093/brain/awz346"
      - "10.1186/s40478-019-0831-2"
    history:
      - date: 2026-11-22
        note: "Created on the red-team night as the cheapest way to settle a parked idea. The trial figures are as reported by a research assistant from the abstract and an automated full-text summary; not independently checked."

  - id: epileptiform-marker-agreement-first
    title: "Before any trial gated on silent brain discharges, fix how they are detected and show readers agree"
    created: 2026-11-22
    lens: red-team
    goal: detect
    status: new
    mechanism: >-
      Reported rates of silent epileptic discharges during sleep in Alzheimer's run from 10% to
      54%, and in healthy older people from 3% to 47%, depending on the recording method and who
      reads it. A trial that selects people on this marker inherits that uncertainty. The first
      step is a blinded re-scoring of existing overnight recordings by three or more readers, and
      by a fixed automated detector, to measure prevalence and agreement in amyloid-positive
      people without symptoms.
    novelty: >-
      A recent case-control study ended with a call for a consensus method
      (10.1002/ana.78135). We found no reader-agreement study specific to small sleep discharges
      in this population, and no trial that pre-registered a detection rule before selecting
      people on it.
    against: >-
      Even a reliable marker may be a consequence of the disease, as genetic studies suggest, so
      perfect detection would not rescue the treatment idea. Automated detectors trained on
      epilepsy may not transfer. Recordings sit in cohorts that need data applications.
    falsify: >-
      If blinded readers agree poorly (kappa below about 0.4) or prevalence in amyloid-positive
      unimpaired people is under about 5%, a prevention trial cannot be enriched this way and the
      gated-treatment idea is dead.
    evidence: observational
    safety: "A measurement-validation proposal using existing recordings; no intervention. Not medical advice."
    next: "Look for any open overnight EEG dataset in older adults on which a fixed automated detector could be benchmarked without a data application."
    sources:
      - "10.1002/ana.78135"
      - "10.1002/ana.24794"
      - "10.1212/WNL.0000000000010612"
    history:
      - date: 2026-11-22
        note: "Created on the red-team night from the kill attempt on epileptiform-gated-lev-prevention. Prevalence figures other than the 2026 case-control study are as reported by a research assistant from abstracts."

  - id: prediction-scorecard-before-readout
    title: "Score health-record and AI drug predictions prospectively: write down what each predicts before the trial reads out"
    created: 2026-11-22
    lens: red-team
    goal: understand
    status: new
    mechanism: >-
      Health-record comparisons and computer models keep nominating approved drugs for
      Alzheimer's, and their record is judged after the fact, when failures are easy to explain
      away. The one clean prospective case failed: a prediction of 40-70% fewer diagnoses was
      followed by two null trials of about 1,900 people each. Recording each prediction with its
      size and source before the randomised result arrives turns a stream of claims into a
      measured hit rate that can discount the next one.
    novelty: >-
      Reviews tabulate failed trials, and one study emulated trials for drugs already in the
      pipeline, but we found no running scorecard that fixes predictions in advance. Several
      tests are imminent: a metformin trial has completed and not reported, and a platform trial
      is testing two more nominated drugs.
    against: >-
      Few predictions ever reach a randomised test, so the hit rate will stay imprecise for years.
      Trials test different doses, stages and outcomes from the ones the health records describe,
      so a miss may not be a fair test. Keeping the list complete takes sustained effort.
    falsify: >-
      If after the next five readouts the recorded predictions do no better and no worse than the
      base rate for all repurposing trials, the scorecard adds nothing to the base rate and can
      be dropped.
    evidence: observational
    safety: "A record-keeping proposal using published predictions and trial results; no intervention. Not medical advice."
    next: "Write the first entries: what the published health-record comparison predicts for the completed metformin trial, with its size, before the result appears."
    sources:
      - "10.1002/alz.14313"
      - "10.1002/trc2.70193"
      - "10.1038/s41467-022-35157-w"
    history:
      - date: 2026-11-22
        note: "Created on the red-team night. Score so far, as compiled by a research assistant: of computational or health-record predictions later tested prospectively in a randomised trial, none succeeded; several were made after the drug had already failed."

  - id: bp-benefit-vascular-not-alzheimer
    title: "Blood-pressure lowering is the one repurposing success - test whether its benefit sits in people without Alzheimer's markers"
    created: 2026-11-22
    lens: red-team
    goal: understand
    status: new
    mechanism: >-
      Across 65 sizeable trials of approved medicines, the only benefit confirmed in independent
      trials is a class effect: lowering blood pressure reduces all-cause dementia (risk ratio
      0.85 in a trial of 33,995 people, 10.1038/s41591-025-03616-8). The endpoint is dementia of
      any cause, and no trial shows an effect on Alzheimer's pathology. If the benefit works by
      preventing vessel injury, it should concentrate in people with low Alzheimer's blood
      markers, and be small or absent in those with high ones.
    novelty: >-
      The class effect is established. Splitting it by an Alzheimer's blood marker in the trials'
      stored samples, to learn which disease is being prevented, is the proposal; we have not
      found that analysis, though we have not searched the largest trial's biomarker papers.
    against: >-
      The largest positive trial was open-label and randomised by village, and the
      placebo-controlled trials each missed on dementia. Vessel and Alzheimer's damage interact,
      so a clean split may not exist. In one trial's imaging subset, intensive lowering went with
      more impairment in people with heavy white-matter damage (noted here on 2026-11-12).
    falsify: >-
      If the benefit of blood-pressure lowering is the same in people with high and low
      Alzheimer's blood markers, it is not specific to vessel disease and the split is wrong.
    evidence: RCT
    safety: "Secondary analysis of trial samples; blood-pressure targets are a matter for a person's own doctor. Not medical advice."
    next: "Search for published blood-marker analyses of the large blood-pressure trials; if one exists, read whether benefit differed by marker level."
    sources:
      - "10.1038/s41591-025-03616-8"
      - "PMID 30688979"
    history:
      - date: 2026-11-22
        note: "Created on the red-team night from the scoreboard. The large trial's result was checked against its abstract; the second source is the earlier intensive-treatment trial, as listed in the night's scoreboard and not re-read."

  - id: months-per-dollar-ledger
    title: "Put every low-cost option on one scale: expected months of decline deferred per 100 dollars"
    created: 2026-11-25
    lens: inversion
    goal: slow
    status: investigating
    mechanism: >-
      Effects are published as hazard ratios, standard-deviation gains, points on different scales
      and percent slowing, which cannot be compared. Each can be converted into months of decline
      or of dementia onset deferred, multiplied by a stated chance that the effect is real, and
      divided by cost. Doing so shows which cheap options carry real weight (blood-pressure
      lowering, a generic symptomatic drug) and which rest mostly on hope, and it makes each
      pending trial's importance visible as the amount the table would move.
    novelty: >-
      Cost-effectiveness analyses exist for single interventions in formal health-economic units.
      A plain common scale across cheap options with an explicit probability that each effect is
      real, kept current as trials report, is what we did not find.
    against: >-
      The rows are measured in different people - healthy older adults, people with high blood
      pressure, people with diagnosed disease - so the ranking is not a choice any one person
      faces. The conversion from hazard ratio to months assumes dementia incidence doubles every
      five years. The chances of being real are our assumptions. Product cost ignores visits,
      monitoring and side effects.
    falsify: >-
      If reasonable changes to the assumed chances or the conversion reverse the order of the top
      and bottom rows, the table carries no information beyond the raw results and is dropped.
    evidence: RCT
    safety: "A way of comparing published group-level results; not a recommendation to take or stop anything. Not medical advice."
    next: "Run the sensitivity test in the kill clause; add rows as trials report (deprescribing, metformin, the vaccine trials)."
    sources:
      - "10.1038/s41591-025-03616-8"
      - "10.1002/14651858.CD001190.pub3"
      - "10.1016/j.ajcnut.2023.12.011"
      - "10.1002/trc2.70197"
    history:
      - date: 2026-11-25
        note: "Created and modelled on the inversion night (scripts/low_cost_ladder_2026_11_25.py). Expected months per 100 dollars over five years: blood-pressure lowering 22.5, generic symptomatic drug 6.5, multivitamin 3.7, speed training 1.9, shingles vaccination 1.2, plaque-removing antibody 0.01. Different populations; assumed chances of 80%, 95%, 35%, 15%, 30% and 95%."

  - id: multivitamin-responder-subset
    title: "The multivitamin effect may be a real gain in a minority with a correctable shortfall"
    created: 2026-11-25
    lens: inversion
    goal: reverse
    status: new
    mechanism: >-
      A daily multivitamin gave a small average gain in global cognition (+0.07 SD, 0.03 to 0.11)
      that appeared within a year and then held, the shape of a one-time gain and not of slower
      decline (10.1016/j.ajcnut.2023.12.011). A twelve-year trial in well-nourished male doctors
      found nothing. Both fit one explanation: a minority of older adults have a correctable
      shortfall in some nutrient, they gain a lot, and everyone else gains nothing. If so, the
      average hides a genuine reversal of a reversible deficit in an identifiable subgroup.
    novelty: >-
      The trial reported a larger effect in people with heart disease. We have not found an
      analysis of the effect by baseline blood nutrient levels or diet quality, which the trial's
      stored samples would allow; that analysis may exist in papers we did not read.
    against: >-
      The three positive analyses are substudies of one trial, so the effect itself is not
      independently confirmed, and by our base-rate model it has perhaps a one-in-three chance of
      being real. Trials of single nutrients (B vitamins, vitamin D) in unselected people were
      null. A subgroup search after the fact invites a false positive.
    falsify: >-
      In the trial's stored baseline samples, if the cognitive effect is no larger in people with
      low nutrient levels than in those with adequate levels, there is no responder subset and
      the average effect, if real, is something else.
    evidence: RCT
    safety: "A question about a published trial's stored samples; not a suggestion to take supplements. Not medical advice."
    next: "Search the trial's publications for any analysis by baseline nutrient status or diet quality."
    sources:
      - "10.1016/j.ajcnut.2023.12.011"
      - "10.1002/alz.12767"
      - "PMID 24490265"
    history:
      - date: 2026-11-25
        note: "Created on the inversion night. The pooled result was checked against its abstract; the null twelve-year trial and the heart-disease subgroup are as reported by a research assistant."

  - id: symptomatic-step-positive-control
    title: "Use the known gain from a generic symptomatic drug as the positive control for any 'improvement' readout"
    created: 2026-11-25
    lens: inversion
    goal: detect
    status: new
    mechanism: >-
      Several catalogue ideas need a readout that can detect a person getting better, and none has
      been checked against a real improvement. One exists: starting a generic cholinesterase
      inhibitor in diagnosed Alzheimer's produces a gain of about one point on a 30-point screen
      (2.7 points on the fuller scale) that lasts while the drug is taken and is lost on stopping
      (10.1002/14651858.CD001190.pub3; 10.1056/NEJMoa1106668). A new readout - an at-home test,
      a practice-corrected score, a cue-rescue measure - should detect that gain and that loss
      before it is trusted to detect anything subtler.
    novelty: >-
      The drug effect is old. Using it deliberately as a calibration standard for new improvement
      measures, with the withdrawal as a second check, is what we did not find; digital cognitive
      tests are usually validated against diagnosis, not against a known within-person change.
    against: >-
      The gain is small and varies between people, so many patients would be needed. Starting
      treatment is not randomised in routine care, and a placebo response would be mixed in. A
      readout tuned to this drug's effect on attention might miss other kinds of improvement.
    falsify: >-
      If a candidate readout cannot distinguish people starting the drug from people not starting
      it over three months, at a sample size where the standard scale can, it is not sensitive
      enough to serve as an improvement endpoint.
    evidence: RCT
    safety: "A measurement-validation design using treatment decisions made in ordinary care; not a suggestion to start or stop a medicine. Not medical advice."
    next: "Check whether any at-home or digital cognitive test has published data from people before and after starting a cholinesterase inhibitor."
    sources:
      - "10.1002/14651858.CD001190.pub3"
      - "10.1056/NEJMoa1106668"
    history:
      - date: 2026-11-25
        note: "Created on the inversion night. Links to practice-curve-deviation-endpoint, cue-rescue-recoverable-window and step-slope-stop-signature, each of which needs a positive control. The review figures were checked against its abstract."

  - id: turning-point-not-divergence
    title: "Date a marker's rise by its fitted turning point, never by when patient and control curves separate"
    created: 2026-11-25
    lens: inversion
    goal: detect
    status: investigating
    mechanism: >-
      Claims that one blood marker rises years before another often rest on the age at which each
      marker's patient curve separates from the control curve. That age depends on how noisy the
      marker is, how many people were sampled at each age, and whether patients carry a constant
      offset unrelated to the disease process - none of which is timing. Fitting each marker's
      turning point directly, with an interval, or using repeat samples within people, measures
      what the claim is about.
    novelty: >-
      Statisticians know that threshold crossings confound timing with sensitivity, but
      marker-ordering papers still use curve separation. We found no published check of how often
      the method invents a lead at realistic sample sizes; tonight's simulation is one.
    against: >-
      Real marker trajectories are not "flat, then rising", so a fitted turning point can also
      mislead. With around 100 people the turning point is known only to within several years,
      which may be too coarse to order markers at all. Our effect sizes are assumed.
    falsify: >-
      Re-analyse a published ordering claim with fitted turning points. If the ordering is
      unchanged and the intervals do not overlap, curve separation was adequate there and the
      warning is overstated.
    evidence: in-silico
    safety: "A statistical-method proposal; no intervention. Not medical advice."
    next: "Add a within-person version to the simulation (repeat samples) and report how many people and visits are needed to order two markers five years apart."
    sources:
      - "10.1002/alz.71860"
      - "10.1002/alz.70146"
    history:
      - date: 2026-11-25
        note: "Created and modelled on the inversion night (scripts/marker_order_artifact_2026_11_25.py). With two markers rising at the same age in 88 patients and 43 controls, curve separation reported a lead of ten years or more in 4% of studies for identical markers, 11% when one marker was less noisy, and 43% when one carried a constant offset; matched cut-offs showed the same bias; fitted turning points showed none."
