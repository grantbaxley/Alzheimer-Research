# Idea catalogue for the nightly research loop (research/nightly/PROGRAM.md).
# Ideas are research hypotheses, not recommendations. Never delete an idea: kill it with a reason.
#
# Fields:
#   id            kebab-case, unique
#   title         one line
#   created       YYYY-MM-DD
#   lens          lens id it came from
#   goal          detect | slow | stop | reverse | understand
#   status        new | investigating | promising | parked | killed | tested
#   mechanism     two sentences
#   novelty       what was found when searching for prior work (trials, reviews)
#   against       strongest evidence against
#   falsify       cheapest test that could kill it
#   evidence      in-silico | preclinical | observational | RCT | none
#   safety        obvious risks, or "none identified"
#   next          next step
#   sources       list of URLs or DOIs
#   history       list of {date, note}
ideas:
  - id: detection-vs-biological-resilience
    title: "Women's verbal-memory reserve is a detection artifact, not extra biological resilience"
    created: 2026-10-19
    lens: resilience
    goal: understand
    status: killed
    mechanism: >-
      Women outperform men on verbal-memory tests at the same level of pathology, which
      is read as cognitive reserve; but per unit of autopsy pathology, pathology is far
      more often clinically expressed as dementia in women than in men. The hypothesis is
      that the verbal-memory advantage delays diagnosis (a measurement effect) while the
      brain is, if anything, under-protected at the synapse for its tau load, so at matched
      tau women should show equal or lower synaptic-integrity markers, not higher.
    novelty: >-
      Sex-specific memory norms and the female verbal advantage are documented (Sundermann
      2016, 2019); the clinical-expression gap is old (Barnes 2005). Framing the advantage as
      a detection artifact to be separated from biological (synaptic) resilience, and
      predicting lower synaptic markers at matched tau in women, is not something the night's
      sources stated directly.
    against: >-
      The female advantage could be genuine functional reserve (richer verbal networks) rather
      than a measurement bias, in which case synaptic markers at matched tau would be equal or
      higher in women, not lower. Off-target tau-PET binding in women inflates apparent tau and
      could confound any matched-tau comparison.
    falsify: >-
      In a cohort with tau-PET (or plasma p-tau217) and a CSF synaptic panel, regress a
      synaptic-integrity marker on tau with a sex term. If women show equal or higher synaptic
      markers at matched tau, the "under-protected synapse" reading is killed.
    evidence: observational
    safety: >-
      None for the hypothesis. If acted on clinically, sex-specific norms risk over-diagnosing
      men or re-diagnosing women; a biomarker study is needed before any norm change.
    next: >-
      Check whether published CSF synaptic-marker studies (YWHAG:NPTX2, NPTX2, NRN1, VGF)
      report sex-stratified marker-vs-tau slopes; list cohorts that could test it.
    sources:
      - "10.1212/wnl.0000000000003288"
      - "10.1212/wnl.0000000000008467"
      - "10.1001/archpsyc.62.6.685"
      - "10.1038/s41591-025-03565-2"
    history:
      - date: 2026-10-19
        note: "Created under resilience lens, women constraint. Unifies the reserve-vs-vulnerability contradiction both research scans flagged."
      - date: 2026-10-21
        note: >-
          Killed on red-team night. Both halves fail. The pure detection-artifact framing is
          refuted by its own cornerstone datum (equal hippocampal atrophy, better female verbal
          memory, Sundermann 2016 PMID 27029635), which is at least as consistent with genuine
          reserve and is read that way by the group that found it (PMID 39951912). The
          "under-protected at the synapse" half is contradicted by the largest CSF synaptic study
          (Oh 2025 Nat Med, n=3,397, PMID 40164724): the synapse-to-cognition axis shows no sex
          interaction, so women do not show lower synaptic markers at matched pathology. Surviving
          kernel, kept as a separate observation not this idea: women decline faster per unit tau
          once symptomatic (PMID 37641484, PMID 41540505) - cognitive vulnerability, not synaptic
          under-protection. Genuine gap remains: no study reports sex-stratified
          synaptic-marker-vs-tau slopes.

  - id: synaptic-reversal-endpoint
    title: "A sex-normed synaptic-integrity fluid panel as a reversal (not just slowing) endpoint"
    created: 2026-10-19
    lens: resilience
    goal: reverse
    status: parked
    mechanism: >-
      Across autopsy and single-cell cohorts, preserved synapses and neurons track preserved
      cognition better than plaque or tangle load, and synaptic proteins (NPTX2, NRN1, VGF,
      the YWHAG:NPTX2 ratio) are the strongest fluid correlates of cognition beyond amyloid and
      tau. If synaptic loss is partly reversible, a rise in these markers over time could be an
      early, objective signal of restored function, read against sex-specific norms because the
      female verbal advantage masks decline.
    novelty: >-
      These markers are established as cross-sectional correlates and decline predictors (Nat Med
      2025; Ann Neurol 2023). Using an upward change as a reversal readout, and pairing it with
      sex-specific norms, was not stated in the sources; most work treats them as decline markers.
    against: >-
      The markers may be downstream readouts that never rise with any current intervention, or
      rise without cognitive benefit; measurement noise could swamp small upward changes. No
      intervention has yet been shown to raise them.
    falsify: >-
      In any interventional cohort with serial CSF or plasma synaptic markers, test whether a
      marker ever rises above its own measurement error and whether a rise precedes cognitive
      improvement. If markers only ever fall or plateau, the reversal-endpoint claim is killed.
    evidence: observational
    safety: "None; this is a biomarker/endpoint proposal, not a treatment."
    next: >-
      Reframe to marker-specific directions, then re-assay the full panel in banked samples from
      a positive anti-amyloid trial (or sabirnetug ALTITUDE-AD, NCT06335173) to see whether the
      protective markers rise, plus a 2-6 week repeatability substudy to fix the minimal
      detectable change.
    sources:
      - "10.1038/s41591-025-03565-2"
      - "10.1002/ana.26725"
      - "10.1016/j.mcpro.2023.100542"
      - "10.1001/jamaneurol.2024.0991"
      - "10.1016/j.tjpad.2025.100082"
      - "10.1186/s13024-024-00755-3"
    history:
      - date: 2026-10-19
        note: "Created under resilience lens, women constraint."
      - date: 2026-10-21
        note: >-
          Parked on red-team night: not killed, but wrong as written. The panel is directionally
          incoherent for an "up = good" readout - neurogranin, YWHAG and VAMP2 RISE with damage
          while NPTX2, NRN1 and VGF fall, and the YWHAG:NPTX2 ratio rises with both decline and
          normal aging (PMID 39380095, PMID 40164724). In the only interventional CSF data,
          anti-amyloid therapy moved damage markers DOWN (gantenerumab lowered neurogranin,
          DIAN-TU, PMID 38683602; sabirnetug lowered neurogranin and VAMP2, PMID 39955261); no
          human trial has driven the protective markers UP (only a preclinical mouse Nptx2 boost).
          Markers are also non-specific (Lewy-body disease, acute injury) with no established
          test-retest reliability for this use. A reframed, marker-specific version survives; the
          simple upswing endpoint does not.

  - id: sex-amyloid-tau-window
    title: "Use each person's amyloid-to-tau interval, not age, to time an anti-seeding therapy"
    created: 2026-10-19
    lens: resilience
    goal: detect
    status: investigating
    mechanism: >-
      The resilience variants that most clearly protect (APOE3-Christchurch, PLCG2 P522R) act by
      suppressing amyloid-induced tau seeding and spread via microglia, so the leverage point is
      the amyloid-to-tau coupling step. Women traverse that step faster (shorter amyloid-to-tau
      interval, faster tau accumulation when amyloid-positive), so the hypothesis is that the
      useful window for an anti-seeding drug is set by time since amyloid onset and runs out
      sooner in women, arguing for enrichment and timing by a personal amyloid clock rather than
      by chronological age.
    novelty: >-
      The amyloid-to-tau interval is described (J Prev Alzheimers Dis 2026) and faster female tau
      is well supported (JAMA Neurol 2025). Using the interval as a sex-aware enrichment clock
      for an anti-seeding therapy, rather than age or amyloid status alone, was not stated in the
      sources.
    against: >-
      Tonight's toy FKPP model did not reproduce the naive "faster growth = narrower window"
      intuition: raising the local tau-growth rate pulled both first-detection and widespread tau
      earlier together, rather than shrinking the gap between them, so "faster" may mean "earlier
      and still detectable", not "no window". The clinical interval also needs two scans, which is
      costly and may be a surrogate for amyloid burden rather than an independent clock.
    falsify: >-
      In a cohort with serial amyloid and tau PET, test whether time since amyloid positivity
      predicts tau accumulation rate better than chronological age, and whether a sex term adds
      anything once the interval is in the model. If sex adds nothing beyond the interval, the
      "sex-specific window" part is killed.
    evidence: observational
    safety: >-
      None for the analysis. Any resulting trial-timing rule would need prospective validation
      before use.
    next: >-
      In a serial amyloid+tau PET cohort (ADNI, BioFINDER), test whether the amyloid-to-tau
      interval predicts tau-accumulation rate and cognitive decline AFTER removing amyloid burden
      and age, and whether a sex-by-interval term survives. If it adds nothing, the enrichment
      premise dies cheaply; if a residual effect survives, re-cut an existing tau-stage-enriched
      trial by estimated interval and sex before proposing anything bespoke.
    sources:
      - "10.1001/jamaneurol.2025.0013"
      - "10.1016/j.tjpad.2026.100622"
      - "10.1016/j.cell.2023.11.029"
      - "10.1007/s00401-020-02138-6"
      - "10.1002/alz.71064"
      - "10.1007/s00259-026-07934-y"
    history:
      - date: 2026-10-19
        note: "Created under resilience lens, women constraint. Toy FKPP run (scripts/window_2026_10_19.py) complicated the premise; recorded as evidence against, idea kept for the cohort test."
      - date: 2026-10-21
        note: >-
          Advanced to investigating on red-team night. One objection fell, one got sharper. The
          off-target tau-PET worry (that female tau excess is a meningeal/vascular artifact) is
          largely defeated by an off-target-immune fluid tau marker tracking tau-PET with no sex
          interaction (MTBR-tau243, Robinson 2026, PMID 42191949), so the "faster female tau"
          premise stands. But the real kill is that the amyloid-to-tau interval is confounded with
          age at amyloid onset and amyloid burden, and adds little after tau positivity (PMID
          42309020); a reframing (PMID 41485137) describes it better as an amyloid-level x age x
          sex threshold. So "time by interval, not age" largely collapses into "amyloid burden +
          age", which existing enrichment already approximates. The cheapest decisive test is now
          in `next`.
      - date: 2026-10-24
        note: >-
          Trial-design night adds a sobering constraint on the sex half. AD trials are essentially
          never powered for a sex-by-treatment interaction (detecting one needs ~4x the sample of a
          main effect), and the existing sex subgroups point in opposite directions across drugs
          (male-favoring for lecanemab/aducanumab, female-favoring for donanemab; Lim 2025, PMID
          41551731) - a pattern consistent with underpowered noise, not a real sex effect on
          response. So the testable value of this idea sits in the interval-enrichment half, not
          the sex half: run the interval test first (see `next`), and treat sex as a hierarchical
          sub-analysis borrowing strength across a platform rather than a standalone powering
          demand. Status stays investigating.

  - id: fsh-blockade-women
    title: "Blocking follicle-stimulating hormone to slow post-menopausal Alzheimer's"
    created: 2026-10-19
    lens: resilience
    goal: slow
    status: parked
    mechanism: >-
      In mice, FSH acts on hippocampal and cortical neurons to accelerate amyloid and tau
      deposition through a C/EBP-beta / delta-secretase pathway, and blocking FSH reportedly
      abrogates the phenotype. FSH rises sharply at menopause, so FSH blockade is proposed as a
      female-specific way to slow the disease.
    novelty: >-
      Not novel as a target: a humanized FSH-blocking antibody (MS-Hu6) is described as
      IND-enabling. Logged to record the skeptical assessment, not to claim the idea.
    against: >-
      All the mechanistic and therapeutic FSH work traced tonight comes from a single
      collaborating group with no independent replication found. Human data are small,
      cross-sectional and contradictory (one cohort found higher FSH associated with worse
      cognition, another found higher FSH associated with better cognition in cognitively normal
      women). Hormone therapy, which lowers FSH, does not prevent dementia in RCTs.
    falsify: >-
      An independent lab repeating the mouse FSH to delta-secretase result, or a human study that
      separates FSH from estradiol (for example GnRH-agonist users), showing no FSH effect once
      estradiol is accounted for, would sink it.
    evidence: preclinical
    safety: >-
      FSH blockade would perturb reproductive endocrinology; bone and metabolic effects are
      plausible. Not a candidate for anything but carefully controlled study.
    next: "Watch for independent replication; do not pursue without it."
    history:
      - date: 2026-10-19
        note: "Logged as parked: single-group preclinical program, contradictory human data, HT (which lowers FSH) null in RCTs."

  - id: clearance-threshold-onset
    title: "Model onset as a clearance-capacity tipping point, not a seeding event - and test for hysteresis"
    created: 2026-10-21
    lens: red-team
    goal: understand
    status: new
    mechanism: >-
      Perivascular and blood-brain-barrier routes continuously clear amyloid and tau, and
      clearance (not overproduction) is impaired in sporadic disease. Model the brain as
      normally holding small seeds below a threshold set by clearance capacity: when vascular
      aging drops clearance below the local aggregation rate the same pre-existing seed takes
      off, and because the system is bistable, restoring clearance after onset may not pull it
      back - predicting that late clearance-restoring therapy fails even when early would have
      worked.
    novelty: >-
      The clearance-deficit view of sporadic disease is established (Mawuenyega 2010) and CAA is
      framed as clearance failure (Greenberg 2020). The specific, testable additions are the
      bistability/hysteresis framing - a tipping point with a no-return region - and tonight's
      toy model (scripts/clearance_2026_10_21.py) showing a sharp clearance threshold at fixed
      seed. A search did not find this cast as a hysteresis prediction for therapy timing.
    against: >-
      Tonight's model only shows that adding a linear clearance term gives a threshold near
      clearance = growth rate, which is close to tautological, not evidence about the brain.
      Autosomal-dominant disease is driven by amyloid overproduction, so seeding clearly matters
      independently of clearance; and clearance proxies (CSF sPDGFR-beta, DCE-MRI leakage) are
      single-cohort and may be confounded by age and small-vessel disease rather than measuring a
      causal clock.
    falsify: >-
      In a serial-PET cohort, test whether a baseline clearance proxy (sPDGFR-beta or DCE-MRI
      Ktrans) predicts tau take-off independent of baseline amyloid burden and age. For the
      hysteresis claim, test in a model system whether restoring clearance after aggregation is
      established reverses burden or only slows it. If clearance adds nothing beyond amyloid
      burden, or if restoration reverses burden freely, the tipping-point framing is wrong.
    evidence: in-silico
    safety: "None; this is a modeling and analysis hypothesis."
    next: >-
      The hysteresis half is answered (no, in this model family). Next, test the tipping-point
      half on data: in a serial-PET cohort, does a clearance proxy (sPDGFR-beta or DCE-MRI
      leakage) predict tau take-off independent of amyloid burden and age? Separately, note that
      irreversibility likely sits in neuron loss, not clearance dynamics.
    sources:
      - "10.1126/science.1197623"
      - "10.1038/s41582-019-0281-2"
      - "10.1038/s41586-020-2247-3"
      - "10.1523/jneurosci.16-14-04491.1996"
    history:
      - date: 2026-10-21
        note: "Created on red-team night under the blood-vessel/BBB constraint, seeded by the clearance-threshold toy model."
      - date: 2026-10-22
        note: >-
          Hysteresis corollary falsified in-silico. scripts/hysteresis_2026_10_22.py ran the
          clearance model two ways - fixed clearance, and clearance impaired by pathology (a
          positive-feedback failure loop) - and NEITHER showed hysteresis: restoring clearance
          collapsed burden back to the never-ill baseline both times. Reason: the logistic growth
          term is zero at saturation, so any positive clearance drains the high state; this model
          family is reversible by construction. Implication for the inversion lens: the
          irreversibility of real disease cannot come from clearance/aggregation dynamics here -
          it must come from loss of substrate (neuron death), which the model does not represent
          and which the reversibility scan puts at ~60% entorhinal layer-II loss by very-mild
          dementia (Gomez-Isla 1996, PMID 8699259). The tipping-point (onset) half of the idea is
          untouched by this and still needs the cohort test in `next`; the "no way back" half is
          reattributed from clearance bistability to neuron loss.
      - date: 2026-10-28
        note: >-
          Two advances on the combination-timing / sleep night. (1) Timing of clearance matters,
          not just its average: scripts/intermittent_clearance_2026_10_28.py shows that at an equal
          daily-average clearance, delivering it in a short window with long low-clearance gaps
          (sleep-like) leaves more burden near the threshold than constant clearance, because the
          gaps let the seed regrow - a nonlinear-averaging (Jensen) effect of the concave growth
          term. So the model says regularity/consolidation of the clearance window could matter,
          not just total clearance. (2) The physiological analog is shakier than the model's clean
          term suggests: sleep is the proposed clearance mechanism, but the glymphatic bulk-flow
          account is contested (Smith/Verkman vs Nedergaard/Mestre), Mendelian randomization is
          largely null for sleep traits causing AD (Anderson 2021, PMID 33150399), and the best
          controlled sleep-improvement trials (CPAP/APPLES, CBT-I/Siengsukon 2026 PMID 42298279)
          are null on cognition and amyloid. Only the worsening direction (acute deprivation) and an
          acute suvorexant biomarker drop are randomized. So: keep the model as an abstraction, but
          do not read it as "improve sleep clearance to slow AD" - that causal claim is unproven.

  - id: vascular-reserve-aria-dosing
    title: "Stratify anti-amyloid dose by a pre-treatment vascular-integrity readout to widen the ARIA-limited window"
    created: 2026-10-21
    lens: red-team
    goal: slow
    status: new
    mechanism: >-
      The dominant neurovascular event in the clinic is iatrogenic ARIA, driven by cerebral
      amyloid angiopathy and vessel-wall fragility as anti-amyloid antibodies clear vascular
      amyloid. If a pre-treatment vascular-integrity readout (microbleed/CAA burden on MRI plus a
      BBB/pericyte-injury marker such as CSF sPDGFR-beta) predicts individual ARIA risk beyond
      APOE4 and microbleed count, dose and titration could be personalised, turning the
      neurovascular unit from an uncontrolled liability into a dosing variable and letting
      lower-risk patients clear amyloid faster.
    novelty: >-
      APOE4 genotype and baseline microbleeds already gate eligibility and dosing. Adding a
      dynamic BBB-integrity biomarker to personalise dose/titration, rather than just exclude, is
      less established; no trial found that tests sPDGFR-beta-guided dosing.
    against: >-
      CSF sPDGFR-beta is validated mainly in one cohort and may not be specific to cerebrovascular
      injury; ARIA prediction from APOE4 plus microbleed count may already capture most of the
      signal, leaving little to add. Collecting CSF to decide dosing adds cost and invasiveness.
    falsify: >-
      In banked baseline samples and MRI from a positive anti-amyloid trial, test whether baseline
      sPDGFR-beta (or a small vascular panel) predicts ARIA-E after adjusting for APOE4 and
      microbleed count. If it adds no discrimination, the idea is dead without any new trial.
    evidence: observational
    safety: >-
      Aimed at reducing iatrogenic harm, but a mis-set rule could under-treat someone who would
      have benefited, or expose a mis-classified patient to ARIA. Any dosing rule needs
      prospective validation before use.
    next: "List anti-amyloid trials with banked baseline CSF + MRI; check whether sPDGFR-beta or similar was measured."
    sources:
      - "10.1001/jamaneurol.2025.0065"
      - "10.1038/s41586-020-2247-3"
      - "10.1038/s41582-019-0281-2"
    history:
      - date: 2026-10-21
        note: "Created on red-team night under the blood-vessel/BBB constraint, from the observation that ARIA makes the neurovascular unit clinically central as a toxicity site."
      - date: 2026-10-25
        note: >-
          Contextual advance (not a dedicated ARIA-biomarker search tonight). The prevention/myelin
          scan reinforces that white-matter-hyperintensity (WMH) / small-vessel burden is both
          measurable and modifiable - intensive blood-pressure control slowed WMH growth in the
          SPRINT MIND MRI substudy (Nasrallah 2019, PMID 31408137) - so baseline WMH burden is a
          natural third component of the pre-treatment vascular-integrity readout alongside
          microbleeds and CSF sPDGFR-beta. Still status new: the decisive test (does any vascular
          marker predict ARIA beyond APOE4 + microbleed count in banked trial data?) has not been
          run. Flagged for a dedicated ARIA-biomarker literature pull.

  - id: fn1-clearance-restore
    title: "Lower excess blood-brain-barrier fibronectin to phenocopy the FN1 resilience variant in APOE4 carriers"
    created: 2026-10-21
    lens: red-team
    goal: slow
    status: investigating
    mechanism: >-
      A rare loss-of-function FN1 variant (rs140926439) is strongly protective in APOE4
      homozygotes, apparently because less fibronectin accumulates at the blood-brain barrier,
      so toxic-protein clearance and gliovascular remodeling are preserved. Reducing
      astrocyte-derived or vascular fibronectin assembly at the barrier might phenocopy that
      protection and restore clearance in APOE4 carriers who did not inherit the variant.
    novelty: >-
      FN1 as an Alzheimer's resilience target is recent (2024-2026) with an independent-cohort
      replication and a mechanistic follow-up; no drug programme targeting barrier fibronectin for
      this purpose was found. The specific twist is testing reduction AFTER pathology is
      established, i.e. as a restorative rather than preventive move.
    against: >-
      The protective odds come from case-control genetics on a rare variant with a wide
      confidence interval, not from intervention. Fibronectin is essential for vascular integrity,
      wound healing and haemostasis, so lowering it is likely dangerous systemically, and the
      zebrafish loss-of-function benefit may be developmental and not reproducible by lowering
      fibronectin in an adult brain.
    falsify: >-
      In an APOE4 blood-brain-barrier model with established fibronectin accumulation, lower
      fibronectin assembly and test whether clearance recovers and gliosis falls (restoration),
      not merely whether co-suppression from the start prevents it. No restoration effect kills
      the restorative version.
    evidence: preclinical
    safety: >-
      Fibronectin is systemically essential (clotting, wound healing, vascular integrity); any
      approach would need brain-vascular-local targeting and careful bleeding/fibrosis monitoring.
    next: >-
      The question is now specific and preclinical: run the staged "establish-then-treat" experiment
      - lower fibronectin (genetically or with pUR4/FUD) in aged APOE4-knock-in mice that already
      have established deposition - and see whether established leak/deposition REVERSES. Until that
      is done, treat FN1 as a prevention lead only (see idea fn1-staged-reversal-test).
    sources:
      - "10.1007/s00401-024-02721-1"
      - "10.1038/s43587-026-01204-0"
      - "10.1097/WAD.0000000000000692"
    history:
      - date: 2026-10-21
        note: "Created on red-team night under the blood-vessel/BBB constraint, from the FN1 vascular-resilience signal."
      - date: 2026-11-01
        note: >-
          The restoration-vs-prevention question is answered: PREVENTION. A full-text read of the
          Nat Aging 2026 paper (PMID 42728404, open access PMC13577929) shows every FN1-lowering
          manipulation was co-suppression or constitutive, never applied to established pathology:
          the genetic tool is a constitutive fn1b knockout that blocks the rise of fibronectin after
          Abeta42 exposure; the pharmacologic tools (camptothecin, Torin2, the FAK inhibitor
          PF-573228, the integrin blocker ATN-161) were given concurrently in an acute 1-day adult
          zebrafish model; and the aged APOE4-knock-in mice (the only model with chronic established
          pathology) were used descriptively, with NO FN1-lowering intervention. So "rescue/restore"
          in the paper means a concurrently-induced acute phenotype, not reversal of established
          deposition. Consequence: this idea's distinctive claim (lowering FN1 AFTER pathology
          reverses it) is UNTESTED, and FN1 is currently a prevention/co-suppression lead, not a
          reversal lead. The decisive experiment is spun out as idea fn1-staged-reversal-test. No
          cheap approved FN-lowering CNS drug exists (pUR4/FUD and ATN-161 are preclinical;
          pirfenidone's brain exposure is unproven; nintedanib barely crosses the barrier)."
      - date: 2026-10-23
        note: >-
          Advanced on repurposing night. Both source papers reconfirmed (Bhattarai 2024 Acta
          Neuropathol, PMID 38598053; Bhattarai 2026 Nat Aging, PMID 42728404). The 2026 abstract
          says reducing fibronectin "rescues" BBB function in vitro and in vivo - suggestive of
          restoration - but does not state whether FN1 was lowered after pathology was established
          or co-suppressed from baseline; full text is paywalled, so the restoration-vs-prevention
          question (the crux for this idea's reversal goal) is still open. No cheap approved
          brain-penetrant FN1-lowering drug exists: pirfenidone is antifibrotic but not CNS-targeted
          and likely fails the cost gate; the FUD/pUR4 fibronectin-assembly inhibitor is
          experimental, not approved; losartan and metformin lower peripheral fibronectin cheaply
          but there is no evidence they reach the perivascular brain compartment (speculative).
          So: genetically anchored and mechanistically fresh, but neither clearly reversal-capable
          nor cheaply druggable yet.

  - id: identify-autocatalysis-rate
    title: "Test whether tau's growth term is actually positive in humans, or just connectivity-patterned transport"
    created: 2026-10-22
    lens: inversion
    goal: understand
    status: investigating
    mechanism: >-
      Network-spreading models (including this repo's FKPP) assume tau grows autocatalytically via
      a logistic term alpha*x*(1-x), but "autocatalytic" is an assumption, not a measured human
      rate, and a good spatial fit (high Pearson r to a regional tau map) does not prove the
      spreading mechanism - regional vulnerability can produce the same pattern. The idea is to fit
      the growth parameter region-wise to longitudinal human tau-PET and test whether it is
      genuinely greater than zero (true self-amplification) or near zero (pattern set by transport
      plus intrinsic vulnerability), because if there is no real self-amplification the whole
      rationale for anti-seeding therapy weakens.
    novelty: >-
      Diffusion models are fit to human tau (Vogel 2020, Raj 2012) and growth+diffusion models
      exist (Schafer/Kuhl 2021), but explicitly testing whether the growth term is identifiable
      and positive region-wise, against a regional-vulnerability confound, is the open question the
      feedback-loop scan surfaced (Xiao et al. preprint: network dynamics set tau presence,
      vulnerability sets load).
    against: >-
      Identifiability: with only a few PET timepoints the growth rate and a static vulnerability
      map may be statistically confounded, so the fit could be unable to separate them even in
      principle. The repo's own synthetic tests show the tooling runs; they say nothing about
      whether a real growth rate is recoverable.
    falsify: >-
      First on synthetic data with a known growth rate: does the fit recover it, or does a
      vulnerability-only model fit equally well? If the two are not separable in silico, the
      question cannot be answered from the available human data and the idea is parked; if they
      are separable, apply it to a public longitudinal tau-PET summary.
    evidence: in-silico
    safety: "None; modeling and inference only. Also a useful honesty check on the repo's own FKPP results."
    next: >-
      Harder test still needed: distinguish growth from a STATIC regional-vulnerability map (not
      just pure diffusion), add realistic noise and unknown seed location, and only then apply to a
      public longitudinal tau-PET summary.
    sources:
      - "10.1038/s41467-020-15701-2"
      - "10.1016/j.neuron.2011.12.040"
      - "10.3389/fphys.2021.702975"
    history:
      - date: 2026-10-22
        note: "Created on inversion night under the engineering constraint, from the feedback-loop scan's point that autocatalysis is assumed, not measured, and good fit does not prove mechanism."
      - date: 2026-10-29
        note: >-
          Ran the synthetic identifiability test (scripts/identifiability_2026_10_29.py) and advanced
          to investigating. First attempt used a NULL with no network term at all - a strawman the
          growth model trivially beat, which told us nothing; corrected to a nested, network-aware
          test (FKPP with free growth vs the same model with growth off = pure diffusion). Honest
          methodological lesson in its own right: a weak null fakes identifiability (echoes the
          "good fit does not prove mechanism" caution). On the corrected test, when the ground truth
          genuinely has strong autocatalytic growth (alpha=1.2, light noise, known seed), the growth
          term IS recoverable even from 3 scans - alpha_hat recovered exactly, fit ~15-20x better
          than pure diffusion. So the method is sound in principle and worth applying to real serial
          tau-PET. Two caveats keep it at investigating, not promising: (1) the harder real-world
          confound is growth vs a STATIC regional-vulnerability map (Xiao et al.), which this test
          does not cover - only growth vs pure diffusion; (2) real data add noise, unknown seed, and
          model misspecification. Those are the new `next`. Tonight this idea also became a component
          of the fused idea nonprogressor-rate-plus-synapse (personal tau rate as an early signal)."

  - id: reserve-as-redundancy-threshold
    title: "Operationalise cognitive reserve as a measured network-redundancy quantity that predicts a tipping point"
    created: 2026-10-22
    lens: inversion
    goal: detect
    status: investigating
    mechanism: >-
      Cognitive reserve is invoked as redundancy - spare circuits that keep function as nodes fail
      - but it is usually measured by proxies (education) rather than a redundancy quantity, and no
      one has tied a measured redundancy to a predicted resilience threshold. The idea is to define
      a concrete graph-redundancy or degeneracy metric on an individual's connectome (independent
      path count, or spectral robustness to node removal) and test whether it predicts the tau
      burden at which that person's cognition falls - a personal failure threshold.
    novelty: >-
      Reserve-as-redundancy and graph-resilience are active but conceptual or cross-sectional; the
      feedback-loop scan found no source closing the loop from a measured redundancy quantity to a
      predicted threshold (Nawani 2025 calls for exactly this). The specific, falsifiable metric
      -> threshold link is the gap.
    against: >-
      Education and brain volume already predict cognition-at-matched-pathology, so a redundancy
      metric may add nothing; cross-sectional connectomes confound cause and consequence; and
      "degeneracy" (different structures, same function) is hard to measure and easy to assert.
    falsify: >-
      Does a connectome-redundancy metric predict cognition at matched tau beyond education and
      brain volume? If it adds no variance in a cohort with connectomes, tau-PET and cognition, the
      idea is dead. Prototype the metric on synthetic connectomes first to check it behaves.
    evidence: observational
    safety: "None; analysis only."
    next: >-
      Needs data: does algebraic connectivity (or a better efficiency-based robustness measure)
      predict cognition at matched tau in a real connectome cohort, beyond education and brain
      volume? Also replace the failed edge-weight knockout measure with a global-efficiency
      (shortest-path) one.
    sources:
      - "10.1002/brb3.70903"
      - "10.1016/j.neuron.2011.12.040"
      - "10.1016/j.ynirp.2025.100255"
    history:
      - date: 2026-10-22
        note: "Created on inversion night under the engineering (redundancy) constraint, from the gap the feedback-loop scan named."
      - date: 2026-10-30
        note: >-
          Prototyped the metric on the repo's synthetic connectome (scripts/redundancy_metric_2026_10_30.py)
          and advanced to investigating - with a partial result. Algebraic connectivity (the Fiedler
          value) WORKS as a reserve proxy: it cleanly separated a redundant many-long-range-edge graph
          (1.145) from a sparse one (0.231) and fell monotonically as nodes were lesioned (1.145 ->
          0.471 over 24 removed). But the second measure I tried - knockout robustness defined as
          retained giant-component edge weight - did NOT discriminate (0.636 vs 0.638), because it is
          dominated by the dense local backbone both graphs share; it needs a global-efficiency
          (shortest-path) definition instead. So the method check half-passes: one usable metric, one
          to fix. Independent human support that redundancy is amyloid-sensitive (cross-sectional):
          Blujus 2025, posterior-hippocampal redundancy reduced by amyloid (doi:10.1016/j.ynirp.2025.100255).
          The matched-pathology predictive test still needs a real cohort (the `next`)."

  - id: restore-before-the-floor
    title: "Gate reversal trials on preserved neuronal substrate and read out a plastic compartment"
    created: 2026-10-22
    lens: inversion
    goal: reverse
    status: investigating
    mechanism: >-
      Reversal is only possible in compartments that are still plastic (synapses, myelin,
      perfusion, inflammation); once neurons are dead they are not replaced, and ~60% of entorhinal
      layer-II neurons are already gone by very-mild dementia. So a reversal trial should enrol only
      people whose neuronal/synaptic substrate is still largely intact - gated by preserved synaptic
      density (SV2A-PET) or entorhinal volume - and measure a plastic-compartment readout that can
      actually move upward, rather than chasing reversal in brains past the irreversible floor.
    novelty: >-
      Trials enrich by amyloid level and tau stage, not by a synaptic-substrate floor, and no
      reversal trial uses SV2A-PET as a substrate gate plus improvement readout. The twist is
      designing for the window where reversal is biologically possible instead of testing it where
      it cannot occur.
    against: >-
      No intervention has yet raised SV2A-PET or any synaptic marker in humans, and no longitudinal
      recovery study exists, so the readout is unproven; a strict substrate gate might exclude most
      symptomatic patients, shrinking the trial population to near-preclinical where change is
      slow and hard to detect.
    falsify: >-
      Is there any cohort where SV2A-PET (or another plastic-compartment readout) rose after an
      intervention? If synaptic density is never observed to increase in humans, the reversal
      endpoint is unusable and the design cannot work; that single question settles it cheaply.
    evidence: observational
    safety: >-
      None for the design itself; any trial would carry its intervention's own risks and must not
      give enrolled people a false expectation of reversal.
    next: >-
      The reversal endpoint is the bottleneck, not the gate. Before designing the trial, establish a
      minimal-detectable-change for SV2A-PET (test-retest ~3-9%) and find or run a positive-control
      setting where a synaptic readout provably rises, since no therapy has yet moved it.
    sources:
      - "10.1523/jneurosci.16-14-04491.1996"
      - "10.1002/alz.12097"
      - "10.1002/ana.410300410"
      - "10.1371/journal.pbio.3002456"
    history:
      - date: 2026-10-22
        note: "Created on inversion night; the reversibility scan's compartment inventory (plastic vs lost-neuron) and tonight's no-hysteresis model both point to a narrow pre-floor window."
      - date: 2026-10-31
        note: >-
          Advanced to investigating on the modeling night; the blocking question was answered, and the
          answer is discouraging for the endpoint. SV2A-PET CAN rise detectably in humans - but the
          only convincing within-subject increase is from SLEEP DEPRIVATION (thalamus +4.6%,
          hippocampus +5.6%, n=40 randomized; Elmenhorst 2026, PMID 42335020), read as pathological
          synaptic accumulation, not recovery. NO therapy has ever driven a significant within-group
          SV2A-PET rise: human single-dose ketamine (PMID 41863255) and psilocybin (PMID 42457666)
          were null, and the increases that exist sit right at the ~3-9% test-retest floor (Finnema
          2018, PMID 28792356). The one genuine above-baseline COGNITIVE gain from a peripheral-immune
          agent (sargramostim, Potter 2021, +1.45 MMSE within-group) was tiny, transient and not a
          synaptic readout. So the gate half of the idea is sound but the reversal-readout half is not
          yet usable: SV2A-PET has never been shown to go up with treatment and barely clears its own
          noise floor. Reframed `next` accordingly. Related idea improvement-endpoint-validation
          carries the same bottleneck."

  - id: vaccine-trained-immunity
    title: "Test whether adult vaccines protect by trained innate immunity (antigen-independent), not anti-herpesvirus action"
    created: 2026-10-23
    lens: repurposing
    goal: understand
    status: investigating
    mechanism: >-
      A regression-discontinuity natural experiment on the Welsh shingles rollout found roughly a
      20% relative drop in dementia, and the protection does not look antigen-specific: the
      recombinant shingles vaccine (a different, adjuvanted antigen) protects at least as well as
      the live one, an adjuvanted RSV vaccine shows a similar signal, and unrelated vaccines (BCG,
      Tdap, influenza, pneumococcal) each associate with lower risk. The hypothesis is that the
      shared cause is trained innate immunity - durable epigenetic/metabolic reprogramming of
      myeloid cells and microglia - so the protective ingredient is immune stimulation in general,
      not suppression of any one pathogen.
    novelty: >-
      The individual vaccine-dementia associations are published; framing them as one
      antigen-independent trained-immunity effect with a single decisive prediction, and treating
      the recombinant-vs-live and cross-vaccine contrasts as the test, is the contribution. A
      BCG-to-CSF reprogramming trial exists but is tiny and open-label.
    against: >-
      Healthy-vaccinee bias inflates cohort estimates (the regression-discontinuity effect ~20% is
      far smaller than cohort hazard ratios of 0.49-0.74, and an active Tdap comparator attenuates
      one estimate from 0.49 to 0.73). An antigen-specific anti-herpesvirus pathway is not excluded
      (shingles infection itself raises risk; antivirals modestly lower it). Trained immunity can
      also worsen neuroinflammation, so "net protective" is not obvious. No RCT with a clinical
      dementia endpoint exists for any of these.
    falsify: >-
      Antigen-independence is the test. If, across regression-discontinuity or active-comparator
      designs, antigenically unrelated vaccines (BCG, Tdap) do NOT lower risk while only
      herpesvirus-directed ones do, trained immunity is wrong and the effect is anti-herpesvirus.
      If recombinant and live shingles vaccines diverge sharply (live better), that also favours
      the antiviral story over trained immunity.
    evidence: observational
    safety: >-
      Adult vaccines are broadly safe and already recommended, so the translational risk is low;
      but trained immunity is double-edged and could in principle worsen neuroinflammation in some
      people, which any trial must monitor. Nothing here is medical advice.
    next: "Watch for independent (non-originating-group) regression-discontinuity replications and any head-to-head antigen-unrelated-vaccine comparison; see the power note in scripts/power_2026_10_23.py."
    sources:
      - "10.1038/s41586-025-08800-x"
      - "10.1038/s41591-024-03201-5"
      - "10.1038/s41541-025-01172-3"
      - "10.1001/jamanetworkopen.2023.14336"
      - "10.7554/eLife.106037"
    history:
      - date: 2026-10-23
        note: "Created on repurposing night. Strongest of the night: a cheap, safe class with a natural-experiment signal and one clean falsification (antigen-independence)."
      - date: 2026-10-30
        note: >-
          Weakened on the frontier-scan night (confidence lowered; still new, no longer treated as
          the single most promising idea). A 2026 reanalysis (Kivimaki et al., Brain Behav Immun,
          PMID 42754179, verified against source) quantified the IMPLIED vaccine effectiveness behind
          the shingles natural experiments: Wales 18%, Australia 177%, Canada 84% and 111% - two
          exceed the 100% theoretical maximum, and no matching decline appears in national dementia
          statistics, so the authors conclude these "cannot be considered strong evidence of a
          clinically meaningful effect." Reading: the flagship Welsh regression-discontinuity (~18%)
          remains the least-biased single estimate and is not overturned, but the "robustly
          replicated ~20%" framing does not hold - the confirmatory-looking replications are
          implausibly large, consistent with residual (healthy-vaccinee) confounding. The idea
          survives as a hypothesis with a clean falsification (antigen-independence), but its
          evidence base is weaker than the first write-up implied."
      - date: 2026-10-31
        note: >-
          A mechanistic headwind from the peripheral-immune scan: the key preclinical experiment on
          peripheral innate-immune training (Wendeln 2018 Nature, PMID 29643512) found that immune
          TRAINING WORSENED cerebral amyloidosis while tolerance alleviated it - the opposite
          direction to the human vaccine-lower-dementia signal. Combined with last night's
          confounding critique, the net sign of peripheral immune training on AD pathology is now
          genuinely in doubt; this is the decisive question spun out tonight as idea
          trained-immunity-net-sign."
      - date: 2026-11-04
        note: >-
          Reversal-lens / women-focus revisit. Status new -> investigating. The idea's OWN
          falsification test is antigen-independence, and it now has data that leans toward trained
          immunity: the recombinant adjuvanted Shingrix out-protects the live-attenuated Zostavax
          (Taquet et al., Nat Med 2024, restricted-mean-time-lost ratio 0.83 [0.80-0.87], PMID
          39053634) - a replicating live virus should win if the mechanism were antiviral, so losing
          to the adjuvanted protein favours the adjuvant/trained-immunity read; the two AS01
          vaccines (zoster, RSV) are equivalent (npj Vaccines 2025, 10.1038/s41541-025-01172-3); and
          BCG lowers dementia ~20% despite zero shared antigen with VZV (JAMA Netw Open 2023 HR 0.80
          [0.69-0.99]; Swedish cohort PLOS ONE 10.1371/journal.pone.0292174, AD-specific NS), though
          only in confounded bladder-cancer cohorts. Sex-specificity verified in both primary RD
          sources (Eyting 2025 Nature 10.1038/s41586-025-08800-x, effect markedly greater in women;
          Cell 2025 progression study, men indistinguishable from zero for every outcome) BUT it is
          MECHANISM-AGNOSTIC - estrogen-enhanced trained immunity, higher female anti-VZV response,
          and sex-skewed healthy-vaccinee bias all predict a female signal, so sex does not
          adjudicate; recorded as a feature, not as support. Still NO independent (non-originating-
          group) regression-discontinuity replication (the Australian RD is a Geldsetzer
          collaboration; Taquet/Oxford is independent but a different, cohort design). Reversal lens:
          only progression-slowing in the already-diagnosed (Cell 2025) plus mouse-only microglial-
          repair hints; no evidence of reversal, consistent with the recurring freeze-not-reverse
          finding. Net: the mechanism half strengthened, the effect-is-real half stayed weak
          (Kivimaki >100% implied VE in 3 of 4 natural experiments, PMID 42754179; Wendeln 2018
          training worsened amyloid, PMID 29643512; no RCT). Not promising (effect base too weak),
          not parked/killed (the discriminating test is alive and currently favourable)."
  - id: lithium-microdose-target-trial
    title: "Microdose lithium for prevention, made credible by an active-comparator target-trial emulation"
    created: 2026-10-23
    lens: repurposing
    goal: slow
    status: investigating
    mechanism: >-
      Endogenous brain lithium is reduced in MCI and further depleted in Alzheimer's by amyloid
      sequestration, and in mice dietary lithium depletion worsens amyloid, tau, inflammation and
      memory via GSK3-beta while an amyloid-evading lithium salt prevents it. The hypothesis is
      that restoring lithium at microdose (well below psychiatric doses) slows progression, tested
      not by yet another tiny trial but by emulating a target trial in existing records.
    novelty: >-
      Lithium-in-AD is an old idea with small positive MCI trials and drinking-water epidemiology;
      the fresh parts are the 2025 endogenous-depletion mechanism and, as the contribution here, a
      credible-inference design - comparing people already on lithium for mood disorders against an
      active comparator (other mood stabilisers) to defeat healthy-user bias - rather than relying
      on confounded ecological water-lithium studies.
    against: >-
      The mechanism and salt-specific rescue are preclinical (mouse); the human RCTs are small and
      old (Forlenza, n=45) and a microdose pilot was methodologically weak; drinking-water studies
      are ecological and confounded. Even low-dose lithium carries real renal and thyroid risk over
      years, and the amyloid-evading orotate salt is unproven in humans.
    falsify: >-
      In a claims/records cohort, emulate a target trial of lithium vs an active mood-stabiliser
      comparator in people with mood disorders, with negative-control outcomes. If lithium shows no
      lower dementia incidence against the active comparator, the observational rationale collapses
      before any prevention RCT is worth running.
    evidence: preclinical
    safety: >-
      Lithium has a narrow therapeutic window even if microdosing is safer; chronic renal and
      thyroid toxicity are the main risks and would gate any trial. Not medical advice; no one
      should self-dose.
    next: "The emulation now largely exists (medRxiv 2026); shift to the untested matched-pathology question - in an autopsy cohort with lithium + amyloid + tau + cognition, does PFC lithium predict cognition WITHIN the high-pathology stratum (a resilience buffer) or only track disease stage? Treat the 2026 preprint as not-yet-peer-reviewed."
    sources:
      - "10.1038/s41586-025-09335-x"
      - "10.1192/bjp.bp.110.080044"
      - "10.1016/j.envpol.2026.127766"
      - "10.64898/2026.01.12.26343472"
    history:
      - date: 2026-10-23
        note: "Created on repurposing night. Cheapest candidate with a 2025 mechanism; the design, not the drug, is the novel part."
      - date: 2026-11-04
        note: >-
          (Bookkeeping) This entry was silently merged into vaccine-trained-immunity from 2026-10-23
          until 2026-11-04 because its `- id:` line was missing (YAML duplicate-key last-wins), so it
          did not exist as a loadable catalogue entry during that window; restored on the
          reversal-biology night.
      - date: 2026-11-05
        note: >-
          Resilience-lens revisit. Status new -> investigating, with two honest DOWNGRADES and a
          reframe. (1) The entry's claimed novelty was "the design, not the drug" - an
          active-comparator, new-user target-trial emulation - but that design now LARGELY EXISTS: a
          2026 preprint (medRxiv 10.64898/2026.01.12.26343472) emulates exactly it (lithium vs
          antiepileptic mood stabilisers, Medicare/MarketScan/Optum) and finds a modest, heterogeneous
          5-yr RR ~0.84-0.87 for progression to advanced ADRD (Optum null ~0.90, MarketScan ~0.57),
          not peer-reviewed and about PROGRESSION in already-ill patients, not prevention; a 2024
          Nordic register target trial (lithium vs lamotrigine/valproate) found no systematic dementia
          difference. So the signal weakly survives an active comparator but is not clean. (2) The 2025
          Nature mechanism paper (10.1038/s41586-025-09335-x) compared DIAGNOSTIC groups (CN/MCI/AD),
          not cognitively resilient-vs-demented brains at matched pathology, so the tempting
          "endogenous lithium is a resilience buffer" reading is an inference, not a demonstrated
          resilience finding, and its mouse rescue is prevention-dominant/reversal-ambiguous. Reframe:
          the live contribution is now (a) the resilience-buffer MECHANISM (PFC-specific lithium
          depletion already at MCI, amyloid sequestration, de-repressed GSK3-beta driving tau - a
          growth-term lever, which tonight's firebreak toy argues is where resilience against an
          autocatalytic spreader actually lives) and (b) the untested matched-pathology question. Note
          a possible convergence: the RELN-COLBOS resilience variant lowers tau via Dab1 and lithium
          loss raises tau via GSK3-beta - plausibly the same kinase node. Kept evidence: preclinical;
          not promoted to promising (modest, heterogeneous, unreplicated by peer review)."

  - id: repurposing-credibility-gate
    title: "A standard active-comparator / regression-discontinuity bar before any observational repurposing claim is graded"
    created: 2026-10-23
    lens: repurposing
    goal: understand
    status: investigating
    mechanism: >-
      Observational repurposing signals in this field are systematically inflated by healthy-user
      and immortal-time bias: the shingles-vaccine effect shrinks from cohort hazard ratios near
      0.5 to ~20% under regression discontinuity, the sildenafil claims signal attenuates under
      active-comparator designs, and metformin's protective claims signal is near-null in Mendelian
      randomisation. The idea is a fixed credibility gate - active comparator, negative-control
      outcomes, and regression discontinuity where an eligibility cutoff exists - that any
      observational repurposing claim must pass before the repo grades it above the weakest level.
    novelty: >-
      Target-trial emulation and active comparators are established methods; adopting them as an
      explicit grading gate in this repo's evidence table, tied to concrete worked examples from
      the nightly scans, is the contribution.
    against: >-
      Emulation cannot remove unmeasured confounding entirely, and regression discontinuity needs a
      natural eligibility cutoff that usually does not exist, so the gate could reject real effects
      for lack of a clean design rather than for being false.
    falsify: >-
      Apply the gate retrospectively to the night's candidates. If active-comparator correction
      does NOT change the signals (e.g. if the shingles effect had not shrunk from 0.49 to 0.73
      against a Tdap comparator), the gate adds nothing and is not worth adopting. Its value is
      exactly the size of the corrections it forces.
    evidence: observational
    safety: "None; this is a methodological standard for grading evidence."
    next: >-
      Put the five-point gate below to the project owner as a proposed addition to policy/VETTING.md
      (do not edit policy unprompted). Then apply it to one live candidate end to end.
    sources:
      - "10.1038/s41586-025-08800-x"
      - "10.1038/s41591-024-03201-5"
      - "10.1007/s00125-022-05743-0"
    history:
      - date: 2026-10-23
        note: "Created on repurposing night, from the recurring pattern that every observational repurposing signal shrank under a stronger design."
      - date: 2026-11-02
        note: >-
          Advanced to investigating with concrete criteria drafted on the causal-chain/repurposing
          night. Proposed five-point gate a repurposing claim should pass before being graded above
          the weakest tier: (1) active-comparator new-user / target-trial emulation; (2)
          negative-control outcomes AND exposures; (3) regression discontinuity where an eligibility
          cutoff exists; (4) drug-target cis-Mendelian-randomization PLUS colocalization,
          direction-matched to the proposed drug effect; (5) APOE-locus exclusion and a
          clinically-diagnosed (non-proxy) AD GWAS as primary, proxy-AD only for replication. Worked
          examples from our own history: shingles (0.49 cohort -> 0.73 vs active comparator, but the
          effect survives and has a birth-date regression-discontinuity natural experiment ->
          promotes); sildenafil (naive ~69% collapses under active-comparator/DREAM -> stays weakest);
          metformin (MR null/conflicting -> stays weakest); and tonight's ACE example (coloc-backed MR
          with a direction that argues against the drug -> criterion 4 catches a false-positive
          "protective" story). This is a PROPOSAL, not adopted; it needs owner sign-off to enter
          policy/VETTING.md."

  - id: antiviral-hsv-reactivation
    title: "Antiherpes antivirals (valacyclovir) to slow Alzheimer's via the HSV-reactivation hypothesis"
    created: 2026-10-23
    lens: repurposing
    goal: slow
    status: killed
    mechanism: >-
      Herpes simplex reactivation was proposed to drive neuroinflammation and amyloid as an
      antimicrobial response, so suppressing reactivation with antiherpes antivirals was expected
      to slow decline.
    novelty: >-
      Not novel; logged to record that a randomized trial has now settled it for the tested
      regimen.
    against: >-
      The VALAD randomized trial (valacyclovir 4 g/day, early symptomatic Alzheimer's, HSV
      seropositive) was not merely negative: cognition worsened significantly MORE on valacyclovir
      than on placebo (ADAS-Cog between-group difference 3.93, 95% CI 1.03-6.83, p=0.01), with no
      effect on amyloid or tau PET. The 4 g/day dose also fails the cost gate.
    falsify: >-
      Already falsified for this regimen by VALAD. A residual, narrower question (early/preclinical
      timing, low suppressive dose, or PCR-confirmed active reactivation only) would need its own
      trial and is not pursued here without a positive signal first.
    evidence: RCT
    safety: >-
      The trial suggests possible harm (greater cognitive worsening) at the dose tested; this is a
      reason not to pursue the regimen, and certainly not medical advice.
    next: "Do not pursue the tested regimen. Read VALMCI (PMID 42210804) in full before revisiting any narrower version."
    sources:
      - "10.1001/jama.2025.21738"
      - "10.1186/s13195-021-00950-0"
    history:
      - date: 2026-10-23
        note: "Created and immediately killed on repurposing night: the VALAD RCT (Devanand, JAMA 2026, PMID 41405855) reported negative and trending to harm, verified against Europe PMC."

  - id: regime-shift-trial-signatures
    title: "Design trials to detect the signatures of alternative stable states, not a group-mean slope"
    created: 2026-10-24
    lens: trial-design
    goal: reverse
    status: new
    mechanism: >-
      If the brain behaves like an ecosystem with alternative stable states, recovery is not a
      graded reversal of decline but a jump between basins, so the useful trial signals are (a)
      bimodal, person-level outcomes - a subset crossing back above their own baseline while most do
      not - and (b) a threshold-shaped dose-response rather than a straight line. A trial that reads
      only the group-mean change averages a bimodal response into a muddy slope and misses both.
    novelty: >-
      Responder and dose-ranging analyses exist, but as secondary readouts; pre-specifying a
      bimodality/time-to-improvement endpoint AND a test for a discontinuous dose-response, both
      motivated explicitly by an alternative-stable-states model, is the contribution. Tonight's toy
      regime-shift model (scripts/regime_shift_2026_10_24.py) shows the hysteresis gap this would
      look for; dynamical tipping-point models of AD exist (PMID 42899506, PMID 41675964) but have
      not been turned into trial-readout prescriptions.
    against: >-
      No instrument is validated to detect improvement above baseline in 6-12 months (the trial-
      design scan's central finding), so a "crossed back above baseline" endpoint has no validated
      ruler yet. Bistability in human AD is unproven - it is so far modeling and metaphor, with no
      demonstrated basin structure - so the premise may simply be false, and a responder threshold
      can be gamed by where it is set.
    falsify: >-
      Re-analyze a positive anti-amyloid trial (lecanemab CLARITY-AD or donanemab TRAILBLAZER-ALZ 2)
      for a bimodal responder distribution and its dose arms for a graded-vs-threshold shape. If the
      outcome is unimodal decline and the dose-response is graded, there is no basin signature and
      the premise is unsupported.
    evidence: observational
    safety: "None; a trial-analysis and design proposal."
    next: "Specify the bimodality + threshold-dose readout concretely; check whether published trial-level distributions (not just means) are available to test for bimodality."
    sources:
      - "10.1111/ejn.70713"
      - "10.1002/qub2.86"
      - "10.1056/NEJMoa2212948"
    history:
      - date: 2026-10-24
        note: "Created on trial-design night under the ecosystem constraint, from tonight's regime-shift model and the finding that no endpoint detects improvement."

  - id: microglia-plaque-predator-prey
    title: "A predator-prey model of microglia clearing amyloid, where the predator degrades as it feeds"
    created: 2026-10-24
    lens: trial-design
    goal: understand
    status: investigating
    mechanism: >-
      Neurodegeneration modeling uses spreading/aggregation math (reaction-diffusion, epidemic-style)
      but almost no true population-competition models; yet microglia clearing amyloid look like a
      predator-prey system with a twist - chronic engagement exhausts and transforms microglia from a
      homeostatic to a dysfunctional disease-associated state, so the predator degrades as it feeds.
      A Lotka-Volterra-type model with that feedback could reveal whether the amyloid-microglia system
      has collapse or oscillation regimes a pure spreading model cannot show.
    novelty: >-
      The ecosystem scan found genuine Lotka-Volterra / predator-prey models of brain cell populations
      are essentially absent; this fills a real gap rather than restating known spreading dynamics.
    against: >-
      Microglial states are a continuum, not two discrete species - the field has formally deprecated
      the two-state A1/A2 and M1/M2 caricatures (Escartin 2021, PMID 33589835) - so a discrete
      predator-prey model may encode exactly the oversimplification that was abandoned, and could be
      elegant but unfalsifiable without longitudinal single-cell state data.
    falsify: >-
      Build the model and ask whether it predicts anything the existing reaction-diffusion/epidemic
      models do not (e.g. a clearance-collapse regime or oscillation), then check whether that
      prediction is distinguishable against published microglial-state trajectories. If it only
      re-describes known spreading behavior, it adds nothing and is dropped.
    evidence: in-silico
    safety: "None; modeling only."
    next: >-
      Fix the likely wrong sign of the peripheral term: re-run with peripheral input allowed to ADD
      to inflammation / suppress clearance (per Wendeln 2018), and work out which human readout would
      reveal the true sign. Also move from two discrete states toward a continuum before over-reading.
    sources:
      - "10.1038/nature21029"
      - "10.1038/s41593-020-00783-4"
      - "10.1371/journal.pcbi.1012743"
      - "10.1038/nature25158"
    history:
      - date: 2026-10-24
        note: "Created on trial-design night under the ecosystem constraint, from the Lotka-Volterra gap the scan identified."
      - date: 2026-10-31
        note: >-
          Built the model (scripts/predator_prey_2026_10_31.py) on the modeling night and advanced to
          investigating. Minimal predator-prey with microglial exhaustion (self-limitation) and a
          peripheral-immune reinforcement term r. Result: the outcome is a THRESHOLD, not a dial -
          amyloid either clears or saturates; clearance efficiency a and peripheral reinforcement r
          push toward clearing, microglial exhaustion q pushes toward saturation (sensitivity across
          each range: a -0.62, q +0.49, r -0.44 around the base point). So the model answers its own
          falsification - it does predict a collapse/clearance threshold a pure spreading model does
          not. BUT tonight's peripheral-immune scan undercuts the model's most policy-relevant
          assumption: physiological peripheral-monocyte amyloid clearance is ~0 (the engraftment story
          is largely an irradiation-chimera artifact - Mildner 2007, Prokop/Varvel 2015), peripheral
          trained immunity WORSENED amyloidosis in the key experiment (Wendeln 2018 Nature, PMID
          29643512), and systemic inflammation suppresses clearance. So the r>0-helps term may have
          the WRONG SIGN, and microglia may not even be rate-limiting for plaque maintenance
          (Grathwohl 2009). The model is structurally sound and its threshold behaviour is honest, but
          its optimistic peripheral knob is not supported by the biology - that is the new `next`. The
          night-6 caveat (states are a continuum, not two species) still stands."

  - id: improvement-endpoint-validation
    title: "Find and validate a readout that can detect within-person cognitive improvement in 6-12 months"
    created: 2026-10-24
    lens: trial-design
    goal: detect
    status: investigating
    mechanism: >-
      Every validated cognitive, digital and fluid measure is validated for rate of DECLINE, not for
      improvement above a person's own baseline, so no reversal trial can currently be scored on its
      own terms. The idea is to validate a candidate improvement-sensitive readout - a passive
      digital/speech measure with good within-person reliability, or a functional measure that
      outperforms cognitive composites over short windows - by testing whether it can detect a KNOWN
      within-person gain against a positive control (e.g. recovery from a reversible cause such as
      treated depression, delirium or sleep deprivation).
    novelty: >-
      The gap is explicit in the literature (no improvement-validated endpoint over 6-12 months); using
      a reversible-cause recovery as a positive control to validate an improvement ruler is the
      contribution.
    against: >-
      Practice effects contaminate any apparent improvement (both arms rose in FINGER/POINTER largely
      via retesting), so a measure might register "improvement" that is just test familiarity; and if
      genuine within-person gains essentially never occur in Alzheimer's, there is nothing to validate
      the ruler against within the disease.
    falsify: >-
      Take a candidate measure and test whether it detects a real within-person cognitive gain in a
      positive-control setting with acceptable reliability and above practice-effect noise. If it
      cannot, no improvement endpoint is feasible and reversal trials cannot be scored - a decisive,
      cheap negative.
    evidence: observational
    safety: "None; a measurement-validation proposal."
    next: "Take one passive/practice-robust at-home signal with published within-person reliability - connected-speech MFCC acoustic-variance (ICC>0.65, 10.1186/s13195-024-01543-3) or an M2C2 burst aggregate (ICC 0.89-0.97, 10.1002/dad2.12283) - and test whether it registers the within-person rebound after one night of RECOVERY SLEEP following sleep deprivation (the one at-home positive control with documented reversible within-person change, PVT-validated, 10.3758/s13428-016-0763-8), above its own retest band. Days, not months; decisive negative if it fails."
    sources:
      - "10.1016/S0140-6736(15)60461-5"
      - "10.1016/j.trci.2017.08.010"
      - "10.1002/dad2.12283"
      - "10.1186/s13195-024-01543-3"
      - "10.1002/alz.087332"
    history:
      - date: 2026-10-24
        note: "Created on trial-design night, from the scan's central finding that no instrument is validated to detect improvement above baseline."
      - date: 2026-11-06
        note: >-
          Red-team / at-home revisit. Status new -> investigating, re-scoped. Survives the red-team but
          only in a narrow form. Active cognitive tasks cannot cleanly show improvement: retest
          (practice) effects mimic ~0.2 SD gains (FINGER both arms rose, 10.1016/S0140-6736(15)60461-5;
          Jacobs 2017, 10.1016/j.trci.2017.08.010), and the only domain with a proven at-home
          within-person recovery is vigilance (PVT after recovery sleep, 10.3758/s13428-016-0763-8),
          not AD-relevant episodic memory. Key reframe: the practice effect is ALSO an AD signal - its
          attenuation tracks amyloid and entorhinal tau (Tort-Merino 2025, 10.1002/alz.087332) - so the
          ruler should be deviation from each person's expected practice-learning curve, not raw change
          (spun out as practice-curve-deviation-endpoint). Only high-reliability burst-aggregated
          measures (M2C2, ICC 0.89-0.97, 10.1002/dad2.12283) clear the detectability bar, and passive
          measures that escape practice by construction (speech acoustics) have the weakest reliability
          so far - the crux. Modelled tonight in scripts/improvement_detectability_2026_11_06.py. Also
          corrected a mis-cited source: the old 10.1001/jamaneurol.2014.803 is the PACC decline
          composite, not a practice-effects paper; swapped for FINGER + Jacobs."

  - id: remyelination-prevention-window
    title: "Test a cheap remyelination drug early, in high-myelin-risk people, with a myelin imaging endpoint"
    created: 2026-10-25
    lens: prevention-population
    goal: slow
    status: new
    mechanism: >-
      Myelin breakdown is demonstrably early in Alzheimer's - visible in preclinical disease and even
      in APOE4-carrier infants - and remyelination is druggable (clemastine shortened visual-evoked
      latency in a multiple-sclerosis RCT; metformin rejuvenates aged oligodendrocyte precursors in
      rodents). Yet no remyelination trial exists in Alzheimer's. The idea is to test a cheap generic
      remyelinator in high-risk preclinical people (APOE4 or high white-matter-hyperintensity burden)
      with a myelin imaging readout (myelin water fraction / g-ratio), where repair is still possible.
    novelty: >-
      The absence of any Alzheimer's remyelination trial is an explicit gap in the literature; moving a
      proven-in-MS agent into early/high-risk Alzheimer's with a myelin endpoint is the contribution.
    against: >-
      Clemastine's MS benefit was a surrogate (conduction latency), not cognition, and clemastine is
      strongly anticholinergic - and anticholinergic burden is itself associated with higher dementia
      risk, so the drug could do net harm in an older brain. Structural myelin protection may not reach
      cognition anyway: SPRINT MIND slowed white-matter-lesion growth yet missed its dementia endpoint.
      Remyelination may also be MS-specific and not achievable against ongoing amyloid/tau toxicity.
    falsify: >-
      In a high-risk cohort, does a remyelination agent move BOTH myelin imaging and cognition, or
      myelin only? A myelin-only result (as in the MS surrogate, and echoing SPRINT's
      structure-without-dementia) shows the chain does not reach clinical benefit, killing the
      prevention rationale. Choose a non-anticholinergic agent (e.g. metformin) to avoid confounding
      harm.
    evidence: RCT
    safety: >-
      Clemastine is sedating and anticholinergic (a real dementia-risk concern in older adults);
      metformin is safer but has its own cautions. Any trial needs a non-anticholinergic agent and
      careful monitoring. Not medical advice.
    next: "Check whether any remyelination agent has been trialled in MCI/preclinical AD with a myelin-imaging endpoint; prefer metformin over clemastine on the anticholinergic concern."
    sources:
      - "10.1016/S0140-6736(17)32346-2"
      - "10.1016/j.stem.2019.08.015"
      - "10.1038/s41586-023-06120-6"
      - "10.1001/jama.2019.10551"
    history:
      - date: 2026-10-25
        note: "Created on prevention night starting from the oligodendrocyte; the AD remyelination-trial gap plus the anticholinergic safety tension are the crux."

  - id: wmh-enriched-prevention-trial
    title: "Enrich a blood-pressure prevention trial for high white-matter-lesion burden before concluding BP does not prevent dementia"
    created: 2026-10-25
    lens: prevention-population
    goal: slow
    status: new
    mechanism: >-
      Intensive blood-pressure control slowed white-matter-hyperintensity growth in the SPRINT MIND
      MRI substudy and cut mild cognitive impairment, but missed its probable-dementia endpoint even on
      extended follow-up - plausibly because the trial stopped early (underpowered) and enrolled
      everyone, not those with the most small-vessel/myelin damage to protect. The idea is a prevention
      trial enriched for high baseline white-matter-lesion burden, with a myelin/vascular mechanistic
      endpoint and adequately powered long dementia follow-up.
    novelty: >-
      SPRINT MIND was not enriched for white-matter burden; targeting the subgroup with the most
      modifiable small-vessel damage, and testing whether the structure-to-dementia link holds there,
      is the contribution.
    against: >-
      The structure-vs-clinical disconnect may be real - slowing lesion growth might simply not prevent
      dementia - in which case enrichment will not rescue it. Enriching for high white-matter burden
      also selects mixed/vascular dementia, muddying an Alzheimer's-specific claim, and blood-pressure
      lowering has intrinsic limits and harms at the extremes.
    falsify: >-
      Re-analyze SPRINT MIND by baseline white-matter-hyperintensity burden: did the high-burden
      subgroup get a dementia benefit (a treatment-by-burden interaction)? No interaction means
      enrichment will not help and the premise is dead - a cheap test on existing data before any new
      trial.
    evidence: RCT
    safety: >-
      Intensive blood-pressure lowering carries falls/syncope/renal risks, especially in frail elders;
      a trial would weigh these. Not medical advice.
    next: "Look for a published SPRINT MIND analysis stratified by baseline WMH burden; if absent, that interaction test is the first, cheap step."
    sources:
      - "10.1001/jama.2019.10551"
      - "10.1001/jama.2018.21442"
      - "10.1001/jamaneurol.2018.3122"
    history:
      - date: 2026-10-25
        note: "Created on prevention night; connects the oligodendrocyte/WMH thread to the population BP lever and SPRINT MIND's structure-without-dementia result."

  - id: oligodendrocyte-amyloid-source-test
    title: "Does remyelination raise or lower amyloid? A go/no-go for combining it with anti-amyloid therapy"
    created: 2026-10-25
    lens: prevention-population
    goal: understand
    status: new
    mechanism: >-
      Two recent preclinical findings conflict: myelin loss drives amyloid accumulation (so repairing
      myelin should lower it), yet oligodendrocytes themselves produce amyloid-beta and contribute to
      plaques (so boosting oligodendrocyte activity might raise it). If oligodendrocytes are a
      meaningful amyloid source, promoting remyelination could paradoxically increase amyloid load and
      conflict with anti-amyloid therapy - a decision that must be settled before pairing the two.
    novelty: >-
      The victim-versus-culprit contradiction is fresh (both findings 2023-2024) and unreconciled;
      framing it as a go/no-go test for combining remyelination with anti-amyloid therapy is the
      contribution.
    against: >-
      Both findings are in amyloid-overexpressing mouse models, which translate poorly; the
      oligodendrocyte amyloid contribution may be negligible in human brain, making the worry moot. The
      question may also be unanswerable without clean lineage-specific amyloid-source measurement.
    falsify: >-
      In a model, promote remyelination and measure amyloid burden: if it falls (the myelin-loss-drives-
      amyloid direction dominates), the conflict worry is void and remyelination is safe to combine; if
      it rises, remyelination-as-therapy carries an amyloid penalty. Either result is decisive.
    evidence: preclinical
    safety: "None directly; the point is to prevent a harmful drug combination before it is tried in people."
    next: "Read whether either source paper measured amyloid after a remyelination manipulation; if not, that is the experiment."
    sources:
      - "10.1038/s41593-024-01730-3"
      - "10.1038/s41586-023-06120-6"
      - "10.1038/s41586-022-05439-w"
    history:
      - date: 2026-10-25
        note: "Created on prevention night from the oligodendrocyte victim-vs-culprit contradiction (Sasmita 2024 vs Depp 2023); a mechanistic go/no-go rather than a prevention lever."

  - id: sleep-regularity-vs-duration
    title: "Night-to-night regularity of consolidated slow-wave sleep may predict pathology better than sleep duration"
    created: 2026-10-28
    lens: combination-timing
    goal: understand
    status: new
    mechanism: >-
      Both short and long sleep associate with worse amyloid and cognition (a U-shape), which makes
      total duration a poor single axis. Tonight's timing model shows that, near a clearance
      threshold, how clearance is distributed in time changes containment even at equal daily
      average - long low-clearance gaps let pathology regrow. That points to the regularity and
      consolidation of slow-wave windows, not mean duration, as the sleep variable most likely to
      track amyloid/tau.
    novelty: >-
      Sleep-regularity indices predict cardiometabolic outcomes and mortality, but their link to AD
      biomarkers versus mean duration is far less established; the timing model gives the prediction
      a concrete rationale, and the U-shape in duration is a reason to expect duration to
      underperform.
    against: >-
      Mendelian randomization is largely null for sleep traits causing AD, so any sleep-pathology
      link may be reverse causation (early pathology fragments sleep) or confounding; regularity is
      noisier to measure than duration; and the model's timing effect is a property of its concave
      growth term, not evidence the brain works this way.
    falsify: >-
      In a cohort with multi-night actigraphy (or EEG) and amyloid/tau PET, does a sleep-regularity
      / slow-wave-consolidation index predict pathology better than mean duration, adjusting for
      age and APOE? If regularity adds nothing beyond duration, the idea is dead.
    evidence: observational
    safety: "None; an analysis and measurement hypothesis."
    next: "Look for cohorts with actigraphy/EEG regularity metrics plus amyloid/tau PET; compare regularity vs mean duration as predictors."
    sources:
      - "10.1001/jamaneurol.2021.2876"
      - "10.1093/brain/awx148"
      - "10.1038/s41386-019-0478-5"
    history:
      - date: 2026-10-28
        note: "Created on combination-timing night (sleep constraint), from the U-shaped duration finding plus the intermittent-clearance timing model."

  - id: orexin-antagonist-early-window
    title: "A dual orexin-receptor antagonist tested early, with PET endpoints, to see if nightly use durably lowers accumulation"
    created: 2026-10-28
    lens: combination-timing
    goal: slow
    status: new
    mechanism: >-
      A single dose of suvorexant acutely lowered CSF amyloid and p-tau in a small randomized study,
      and the field's best-evidenced timing lesson is that intervening earlier helps far more. The
      idea is to test a dual orexin-receptor antagonist nightly in high-risk preclinical people with
      amyloid/tau PET endpoints, with the explicit prediction that it only changes trajectory if the
      acute biomarker drop accumulates into durable lowering AND it is started before the tipping
      point - a sleep-drug-plus-early-timing combination.
    novelty: >-
      A DORA trial with a cognitive or PET-progression endpoint is an explicit gap (evidence stops at
      acute biomarkers); pairing it with early-stage enrollment and a durability test is the
      contribution.
    against: >-
      The sleep-causal premise is shaky: Mendelian randomization is largely null for sleep traits,
      and the best sleep-improvement trials (CPAP, CBT-I) are null on cognition and amyloid, so a
      DORA may move biomarkers acutely without changing disease. Suvorexant's effect was transient,
      single-night, biomarker-only; DORAs cause next-day somnolence and fall risk in elderly.
    falsify: >-
      A nightly-DORA RCT in high-risk preclinical people with serial amyloid/tau PET: does chronic
      dosing produce durable lowering and slower accumulation, or only the known acute dip? Acute-
      only (no durable change) kills the disease-modification rationale.
    evidence: RCT
    safety: >-
      Dual orexin-receptor antagonists cause somnolence, next-day impairment and fall risk,
      especially in older adults; a trial must weigh these. Not medical advice.
    next: "Check whether any DORA trial with a cognitive/PET-progression endpoint is registered; if not, that is the missing study."
    sources:
      - "10.1002/ana.26641"
      - "10.1002/alz.71591"
      - "10.1093/ije/dyaa183"
    history:
      - date: 2026-10-28
        note: "Created on combination-timing night; the DORA cognitive-endpoint gap plus the early-timing lesson are the crux, against a shaky sleep-causal premise."

  - id: circadian-period-enrichment
    title: "Use intrinsic cellular circadian period as prognostic enrichment to select fast progressors for trials"
    created: 2026-10-28
    lens: combination-timing
    goal: detect
    status: new
    mechanism: >-
      A longer intrinsic cellular circadian period (measured ex vivo) was associated with higher
      p-tau/NfL/GFAP, medial-temporal atrophy, and faster clinical decline, reportedly independent of
      baseline pathology. If it genuinely adds prognostic information beyond standard markers, it
      could enrich trials for fast progressors - shrinking the sample size and time needed to detect
      an effect, the recurring bottleneck in this field.
    novelty: >-
      The circadian-period association is published as prognostic only; using it as a trial-
      enrichment variable (alongside or instead of p-tau217) is the contribution.
    against: >-
      The measurement is an ex-vivo fibroblast assay - invasive, slow, and hard to scale for
      enrollment; and the period may partly track pathology rather than add to it, in which case it
      collapses into p-tau217 and adds no value. Single-cohort finding.
    falsify: >-
      Does circadian period predict decline after adjusting for plasma p-tau217 and baseline tau PET
      (i.e. is the reported independence robust and replicable)? If it collapses into p-tau217, it
      adds nothing as an enrichment variable.
    evidence: observational
    safety: "None; a trial-enrichment biomarker proposal."
    next: "Read the circadian-period paper's adjustment models; check whether a scalable proxy (e.g. a blood-based clock measure) exists."
    sources:
      - "10.1073/pnas.2527236123"
      - "10.1002/alz.71577"
    history:
      - date: 2026-10-28
        note: "Created on combination-timing night from the circadian-period prognostic signal; framed as trial enrichment, connecting to the trial-design night's power problem."

  - id: distance-to-tipping-point-signal
    title: "A personal distance-to-tipping-point signal, fusing network reserve with pathology-accumulation rate"
    created: 2026-10-29
    lens: earliest-signal
    goal: detect
    status: new
    mechanism: >-
      Fuses two catalogue ideas - reserve-as-redundancy-threshold (a measured network-redundancy
      reserve) and clearance-threshold-onset (onset as a tipping point). Instead of a static
      biomarker, estimate how close a person is to their personal basin boundary by combining how
      much reserve/redundancy their network still has with how fast pathology is currently
      accumulating - a dynamic early signal that is closer to the disease's dynamics than any single
      snapshot marker, aimed at the question of who will NOT progress.
    novelty: >-
      Both components are catalogue ideas; fusing them into a dynamic margin-to-tipping-point score
      is new. The research shows why it is unproven: critical-slowing-down / tipping-point early-
      warning signals have essentially NO human Alzheimer's precedent (the early-warning literature
      is ecology/climate/mood), and connectome redundancy predicting non-progression is unsupported-
      but-open.
    against: >-
      Neither ingredient is validated in humans: no cohort shows rising variance/autocorrelation
      before cognitive decline (possibly because cognition is sampled too sparsely to see it), and
      no study shows a redundancy metric predicting stability at matched pathology. Worse, p-tau217
      plus a cognitive test already captures most predictable risk, and added signals buy only
      ~1-3% AUC - so a complex composite may add nothing over the cheap marker.
    falsify: >-
      In a longitudinal cohort with connectomes and serial amyloid/tau, does a redundancy-plus-rate
      composite predict cognitive stability at matched pathology BEYOND plasma p-tau217? If it adds
      no discrimination over p-tau217 on external validation, the fusion is dead.
    evidence: observational
    safety: "None; an analysis and early-signal proposal."
    next: "Define the redundancy metric and the rate estimate; check for any cohort with connectomes + serial PET to test added value over p-tau217."
    sources:
      - "10.1016/j.ynirp.2025.100255"
      - "10.1038/s41591-025-03565-2"
      - "10.1002/dad2.70321"
    history:
      - date: 2026-10-29
        note: "Created on earliest-signal night by fusing reserve-as-redundancy-threshold + clearance-threshold-onset; the research puts both components at hypothesis stage (no human tipping-point or redundancy-prediction evidence)."

  - id: passive-circadian-early-signal
    title: "A passive wearable sleep-regularity signal, validated against the intrinsic circadian-period marker"
    created: 2026-10-29
    lens: earliest-signal
    goal: detect
    status: new
    mechanism: >-
      Fuses two catalogue ideas - sleep-regularity-vs-duration and circadian-period-enrichment. Use a
      passive, cheap, at-scale wearable sleep-regularity index as the earliest signal, and validate
      it against the expensive but prognostic intrinsic cellular circadian-period marker - the lab
      marker anchoring the wearable one. Two large UK Biobank analyses already tie low sleep
      regularity to incident dementia.
    novelty: >-
      Both components are catalogue ideas; fusing a scalable wearable signal with a lab circadian-
      period anchor, and testing it against pathology rather than diagnosis, is the contribution.
    against: >-
      The regularity-dementia link may be reverse causation (early pathology fragments rhythms),
      and the two UK Biobank analyses disagree on shape (U-shaped vs near-linear); no study runs a
      clean head-to-head showing regularity beats mean sleep duration, or shows it predicts amyloid/
      tau PET rather than a dementia diagnosis. Mendelian randomization is largely null for sleep
      traits causing AD, so the whole causal premise is shaky.
    falsify: >-
      Does the wearable regularity index predict amyloid/tau PET (not just dementia diagnosis), beat
      mean sleep duration head-to-head in one model, and track the intrinsic circadian-period marker?
      If it only tracks diagnosis (reverse causation) and does not beat duration, the fusion is dead.
    evidence: observational
    safety: "None; a passive-measurement and validation proposal."
    next: "Find a cohort with wearable regularity (SRI) plus amyloid/tau PET; run SRI vs mean duration head-to-head against pathology."
    sources:
      - "10.1212/wnl.0000000000208029"
      - "10.1186/s12889-025-21649-z"
      - "10.1073/pnas.2527236123"
    history:
      - date: 2026-10-29
        note: "Created on earliest-signal night by fusing sleep-regularity-vs-duration + circadian-period-enrichment; bounded by the no-head-to-head-vs-duration gap and the null sleep-trait MR."

  - id: nonprogressor-rate-plus-synapse
    title: "A two-marker non-progressor test: where you are (synaptic integrity) plus where you are going (tau rate)"
    created: 2026-10-29
    lens: earliest-signal
    goal: detect
    status: new
    mechanism: >-
      Fuses two catalogue ideas - synaptic-reversal-endpoint (synaptic-integrity markers, the best
      single discriminator of progressors from non-progressors) and identify-autocatalysis-rate (a
      personal tau-accumulation rate estimated from serial scans, which tonight's model shows is
      recoverable when real). Pair a static "where you are" readout (synaptic integrity, e.g. the
      CSF YWHAG:NPTX2 ratio) with a dynamic "where you are going" readout (personal tau rate) to
      identify amyloid-positive people who will stay stable.
    novelty: >-
      Each component is a catalogue idea; combining a synaptic-level snapshot with a personal
      accumulation-rate estimate as a non-progressor classifier is the contribution, and it directly
      targets the lens's hardest question (who will not progress despite amyloid).
    against: >-
      Synaptic-integrity ratios already add the most independent variance of any marker (Oh 2025),
      so the tau-rate term may add little once the synaptic marker is in; the 1-3% AUC ceiling for
      added signals applies; "non-progressor" is confounded by lead-time and circular definitions
      (Ourry 2026); and the personal tau-rate estimate needs two-plus scans, which is costly and
      noisy in practice.
    falsify: >-
      In a cohort with CSF synaptic markers and serial tau, does adding the personal tau-rate term
      improve non-progressor prediction BEYOND the synaptic marker alone, on external validation? If
      the synaptic marker alone does as well, the rate term (and the fusion) adds nothing.
    evidence: observational
    safety: "None; a risk-stratification proposal, not a treatment."
    next: "Check whether any cohort pairs CSF synaptic markers with serial tau-PET so the added value of a rate term over the synaptic marker can be tested."
    sources:
      - "10.1038/s41591-025-03565-2"
      - "10.1038/s41591-022-02049-x"
      - "10.1038/s41467-026-71732-1"
    history:
      - date: 2026-10-29
        note: "Created on earliest-signal night by fusing synaptic-reversal-endpoint + identify-autocatalysis-rate; grounded in Oh 2025 (synaptic markers best discriminator) and tonight's identifiability result (tau rate recoverable when real)."

  - id: down-syndrome-condensed-window-trial
    title: "Use Down syndrome's condensed, near-deterministic cascade as the fastest test of very-early amyloid lowering"
    created: 2026-10-30
    lens: frontier-scan
    goal: slow
    status: new
    mechanism: >-
      APP triplication makes amyloid near-universal in Down syndrome, and new data show the tau
      cascade is "condensed" - p-tau217 and tau-PET turn positive almost simultaneously ~4-6 years
      after amyloid, versus a longer latency in neurotypical adults. That near-deterministic,
      time-compressed trajectory makes Down syndrome the population where whether very-early amyloid
      lowering prevents the tau phase can be answered fastest and with the most statistical power.
      The first dedicated anti-amyloid trial in Down syndrome (donanemab, ALADDIN) is now registered.
    novelty: >-
      ALADDIN exists; the contribution is framing Down syndrome's condensed window as the decisive,
      fastest prevention read for the whole field, and tying the trial's value to whether amyloid
      lowering can still open space before tau co-emerges within that 4-6 year window.
    against: >-
      Cerebral amyloid angiopathy and ARIA risk are elevated in Down syndrome, raising the safety
      bar; the condensed window may mean that by the time anyone is identified, tau has already
      co-emerged and amyloid lowering is too late; and co-pathologies are common in Down syndrome
      autopsy, muddying a pure-amyloid readout. Consent and trial-design ethics are also harder.
    falsify: >-
      ALADDIN (donanemab, NCT06911944) or the ABATE anti-amyloid vaccine (NCT05462106): does
      lowering amyloid in Down syndrome delay the onset of tau-PET/p-tau217 positivity and cognitive
      decline? No delay in the tau phase despite amyloid clearance would be strong evidence that, at
      least in this near-deterministic setting, removing amyloid does not open a treatment window.
    evidence: RCT
    safety: >-
      ARIA and cerebral amyloid angiopathy risk are elevated in Down syndrome; dedicated dosing and
      safety data are needed, and this population warrants extra consent and ethics care. Not medical
      advice.
    next: "Watch NCT06911944 (ALADDIN) status and NCT05462106 (ABATE DS arm); note whether either reports a tau-phase/downstream readout, not just amyloid change."
    sources:
      - "10.1093/brain/awaf428"
      - "10.1002/alz.71404"
      - "10.1002/alz.71738"
    history:
      - date: 2026-10-30
        note: "Created on frontier-scan night (Down syndrome / autosomal-dominant constraint), from the condensed-tau-cascade finding (Brain 2026, PMID 41240365) and the first DS anti-amyloid trials now registering."

  - id: beta-synuclein-ultra-early-signal
    title: "Serum beta-synuclein as a presynaptic signal that may precede p-tau217 by ~two decades"
    created: 2026-10-30
    lens: frontier-scan
    goal: detect
    status: new
    mechanism: >-
      In Down syndrome, serum beta-synuclein (a presynaptic protein) was reported elevated about two
      decades before symptoms, rising before p-tau217, NfL and GFAP, and linked to atrophy,
      hypometabolism and worse memory. If that ordering holds, beta-synuclein could be an
      ultra-early synaptic signal - earlier than the current blood front-runner - and a cheap blood
      readout of the synaptic dysfunction that tracks cognition.
    novelty: >-
      New (2026-09) and cross-sectional; the contribution is testing whether beta-synuclein is
      genuinely earlier than p-tau217 within individuals and adds value over the dominant predictors
      (age, p-tau217), rather than just correlating.
    against: >-
      Cross-sectional, single cohort (n=131), Down syndrome-specific; in Down syndrome, chronological
      age outperforms biomarkers as a predictor, and p-tau217 already dominates - so beta-synuclein
      may add little independent value. Beta-synuclein is also not AD-specific (a general synaptic
      marker).
    falsify: >-
      Longitudinally and in sporadic AD, does serum beta-synuclein rise before p-tau217 within the
      same individuals, and does it improve prediction beyond age plus p-tau217? If it does not
      precede p-tau217 or adds nothing over age+p-tau217, it is not the earlier signal claimed.
    evidence: observational
    safety: "None; a blood-marker hypothesis."
    next: "Check for any longitudinal beta-synuclein data (DS or sporadic) testing temporal order vs p-tau217 and added value over age+p-tau217."
    sources:
      - "10.1002/alz.71860"
      - "10.1002/alz.71661"
      - "10.1038/s41591-025-03565-2"
    history:
      - date: 2026-10-30
        note: "Created on frontier-scan night from the DS serum beta-synuclein finding (Alz&Dem 2026, PMID 42768868); bounded by the age-dominates-prediction caveat (PMID 42449194)."

  - id: resilience-downstream-effector
    title: "Target the downstream glial/vascular effector of resilience variants, not the variant itself"
    created: 2026-10-30
    lens: frontier-scan
    goal: slow
    status: new
    mechanism: >-
      The 2026 mechanistic burst around the APOE3-Christchurch and RELN-COLBOS resilience variants
      points to protection acting DOWNSTREAM - through microglial, vascular and hepatic/lipid effects
      and an oligogenic combination - rather than through the rare coding change itself. If the
      protective output is a druggable cell state or pathway, mimicking that downstream effector
      could confer resilience without needing the variant.
    novelty: >-
      Night 1 logged resilience-mimicry ideas (e.g. FN1); the contribution here is the reframing that
      the DRUGGABLE node is the shared downstream effector (a microglial/vascular state), supported by
      the recent mechanism papers, not the upstream variant.
    against: >-
      "Oligogenic" and "downstream burst" mean there may be no single effector to target; the
      mechanism work is preclinical/iPSC/plasma-EV; and the human protection from the heterozygous
      Christchurch variant was only modest (a ~5-year delay in carriers), so even a faithful mimic
      might buy little.
    falsify: >-
      In a model, does reproducing the proposed downstream state (e.g. the Christchurch-like
      microglial program) confer protection WITHOUT the variant? If mimicking the effector does not
      reproduce protection, the "downstream effector is the druggable node" claim fails.
    evidence: preclinical
    safety: >-
      Manipulating microglial/vascular states carries real risk (trained immunity is double-edged;
      vascular changes can harm). Preclinical only; not medical advice.
    next: "Pull the 2026 Christchurch/RELN mechanism papers; identify whether a single downstream effector (microglial state, Wnt/Dkk1, lipid pathway) recurs across them."
    sources:
      - "10.1016/j.cell.2023.11.029"
      - "10.1038/s41591-023-02318-3"
    history:
      - date: 2026-10-30
        note: "Created on frontier-scan night from the 2026 APOE3-Christchurch / RELN-COLBOS mechanism burst (resilience looks downstream, glial/vascular, oligogenic, potentially druggable)."

  - id: trained-immunity-net-sign
    title: "Resolve whether peripheral immune training is net-protective or net-harmful for AD pathology"
    created: 2026-10-31
    lens: modeling
    goal: understand
    status: new
    mechanism: >-
      The human signal (adult vaccines associated with less dementia) and the key preclinical
      experiment point in opposite directions: peripheral innate-immune TRAINING worsened cerebral
      amyloidosis in mice while immune TOLERANCE alleviated it (Wendeln 2018). Since the whole
      vaccine-trained-immunity program and tonight's predator-prey "peripheral reinforcement helps"
      assumption both rest on peripheral immune activation being net-protective, the sign of that
      effect is the decisive go/no-go.
    novelty: >-
      The clash between Wendeln's harmful training and the protective human vaccine epidemiology is
      known but unreconciled; framing it as the single decisive test that gates both the vaccine idea
      and the clearance-reinforcement modeling is the contribution.
    against: >-
      May be irreducibly context-dependent (training dose, timing, stimulus, amyloid vs tau, mouse vs
      human), so there may be no single "sign"; mouse amyloidosis models translate poorly; and the
      human evidence is confounded (healthy-vaccinee bias), so neither side is clean.
    falsify: >-
      A preclinical study varying training stimulus, dose and timing with amyloid AND tau AND
      cognition readouts, or a human mechanistic (not epidemiological) test of whether a defined
      immune-training exposure raises or lowers pathology. A consistently harmful result kills
      vaccine-trained-immunity; a consistently protective one rescues it and fixes the model's sign.
    evidence: preclinical
    safety: >-
      Directly relevant: if training is net-harmful, immune-activating prevention strategies could
      accelerate pathology - a reason to settle the sign before any trial. Not medical advice.
    next: "Pull Wendeln 2018 and any follow-ups varying training timing/dose; map where protective vs harmful training diverge."
    sources:
      - "10.1038/nature25158"
      - "10.1038/s41586-025-08800-x"
      - "10.7554/eLife.106037"
    history:
      - date: 2026-10-31
        note: "Created on the modeling night (peripheral-immune constraint); the Wendeln-vs-vaccine-epidemiology sign clash is the crux, and it also decides the sign of the predator-prey model's peripheral term."

  - id: sargramostim-above-baseline-replication
    title: "Replicate sargramostim/GM-CSF's rare above-baseline cognitive gain, properly powered and with a durability readout"
    created: 2026-10-31
    lens: modeling
    goal: reverse
    status: new
    mechanism: >-
      Most peripheral-immune interventions in AD failed (etanercept, IVIG), but a small phase-2 RCT of
      sargramostim (GM-CSF) produced a rare signal of genuine IMPROVEMENT above a patient's own
      baseline - MMSE rose ~1.45 points within-group over three weeks - plausibly by mobilising innate
      immunity toward clearance or trophic support. Because above-baseline improvement is almost
      unheard of in AD, this specific signal is worth a properly powered replication with a durability
      and mechanistic readout.
    novelty: >-
      The Potter trials exist; the contribution is isolating the above-baseline-improvement signal
      (not slowed decline) as the thing to replicate, and pairing it with a synaptic/mechanistic
      readout and longer follow-up to test whether the gain is real and durable.
    against: >-
      The signal is fragile: n=40, three-week dosing, a baseline MMSE imbalance that made the
      placebo-adjusted result non-significant after adjustment, a transient ADAS-Cog worsening, and no
      effect on CDR-SB/Trails - classic small-trial noise. The broader peripheral-immune trial record
      is discouraging, and GM-CSF broadly activates immunity (see the net-sign worry).
    falsify: >-
      A larger, longer sargramostim RCT: does the above-baseline MMSE gain replicate and persist
      beyond the dosing window? No replication, or a gain that vanishes after dosing stops, kills it.
    evidence: RCT
    safety: >-
      GM-CSF is immune-activating (injection-site and inflammatory effects) and, given the trained-
      immunity net-sign uncertainty, could in principle aggravate pathology - monitoring required. Not
      medical advice.
    next: "Read the Potter 2021 trial and the 2026 follow-up in full; check whether a larger sargramostim AD RCT is registered or reporting."
    sources:
      - "10.1002/trc2.12158"
      - "10.1056/NEJMoa2212948"
    history:
      - date: 2026-10-31
        note: "Created on the modeling night (peripheral-immune constraint); the one above-baseline cognitive gain in the peripheral-immune record, flagged for replication, with its fragility recorded."

  - id: clearance-vs-production-rate-limiting
    title: "Settle whether amyloid clearance is even rate-limiting before betting on clearance-boosting"
    created: 2026-10-31
    lens: modeling
    goal: understand
    status: new
    mechanism: >-
      A whole family of ideas here (clearance-threshold-onset, the predator-prey model, peripheral-
      immune and glymphatic boosting) assumes that raising clearance can control pathology. But
      preclinical work shows plaques persist even when microglia are ablated (clearance may not be
      rate-limiting for plaque maintenance), while human kinetic studies show impaired clearance in
      sporadic disease - a real tension. Which step is rate-limiting, production/seeding or clearance,
      decides whether any clearance-boosting strategy can work.
    novelty: >-
      The production-vs-clearance question is old, but the specific tension between "clearance not
      rate-limiting for maintenance" (Grathwohl 2009) and "clearance deficit in sporadic AD"
      (Mawuenyega 2010) is unresolved; making it an explicit gate on the repo's clearance-centric
      ideas is the contribution.
    against: >-
      May be stage-dependent (clearance matters for onset, production for maintenance), so the
      dichotomy could be false; the mouse ablation and human kinetic studies measure different things
      (maintenance vs flux), so they may not actually conflict.
    falsify: >-
      A human stable-isotope-kinetic (SILK-type) comparison across stages: is the amyloid imbalance
      driven by production/seeding or by clearance, and does it shift with stage? If clearance is not
      rate-limiting at the stage a therapy targets, clearance-boosting (and the model's clearance
      knob) cannot help there.
    evidence: preclinical
    safety: "None; a mechanistic/kinetic question."
    next: "Reconcile Grathwohl 2009 (plaques persist without microglia) with Mawuenyega 2010 (clearance deficit); find any staged human kinetic data."
    sources:
      - "10.1038/nn.2432"
      - "10.1126/science.1197623"
    history:
      - date: 2026-10-31
        note: "Created on the modeling night; the peripheral-immune scan's point that microglia may not be rate-limiting for plaque maintenance puts the whole clearance-centric line (including tonight's model) in question."

  - id: treat-to-target-proximal-biomarker
    title: "Borrow HIV/oncology treat-to-target, but aim at a proximal biomarker (tau/p-tau217), not amyloid"
    created: 2026-11-01
    lens: cross-domain
    goal: slow
    status: parked
    mechanism: >-
      HIV turned fatal into chronic by hitting an obligate step with combinations and treating to a
      quantified target (viral load); oncology adds measure/combine/adapt. The transferable move for
      symptomatic Alzheimer's is treat-to-target with adaptive combinations - but against a PROXIMAL
      marker that tracks the lesion, namely tau/p-tau217, rather than amyloid, since clearing amyloid
      to near-zero barely changes cognition while tau tracks atrophy and decline.
    novelty: >-
      Treat-to-target is standard in HIV and lipidology; applying it to AD with p-tau217 as the
      target (explicitly not amyloid) and an adaptive combination design is the contribution. Current
      trials enrich by tau stage but do not treat-to-a-tau-target or adapt.
    against: >-
      p-tau217 is a validated READOUT, not a validated TARGET: lowering it may not change cognition,
      exactly the trap amyloid fell into (amyloid cleared, cognition barely moved). No drug reliably
      lowers tau with proven clinical benefit yet, and tonight's model shows a hard symptomatic-stage
      ceiling that no target-hitting can lift. Combination also compounds toxicity (ARIA).
    falsify: >-
      Trial-level surrogacy test: across trials, does the treatment effect on p-tau217 predict the
      treatment effect on cognition? If lowering p-tau217 does not track cognitive benefit (as
      amyloid lowering did not), treat-to-target on p-tau217 is as hollow as on amyloid and the idea
      fails.
    evidence: observational
    safety: >-
      Combination anti-amyloid/anti-tau regimens compound ARIA and bleeding risk; a treat-to-target
      rule must not push dosing past safety. Not medical advice.
    next: "Check whether treatment effects on p-tau217 and on cognition have been correlated across trials (trial-level surrogacy), the way the amyloid-cognition surrogacy was tested."
    sources:
      - "10.1056/NEJMoa2212948"
      - "10.1001/jama.2023.13239"
      - "10.1093/brain/awz321"
    history:
      - date: 2026-11-01
        note: "Created on cross-domain night (symptomatic constraint); the cross-domain scan's single most transferable principle (HIV treat-to-target + oncology measure/combine/adapt, aimed at a proximal marker)."
      - date: 2026-11-06
        note: >-
          Red-team DOWNGRADE, new -> parked. The distinctive claim - that steering a tau number
          (p-tau217) steers cognition - does not survive. p-tau217 is a validated diagnostic/prognostic
          READOUT, never a validated treatment surrogate (no trial-level surrogacy analysis exists for
          it), and the sharpest available data point the wrong way: the drug that most cleanly lowered
          tau still missed cognition with the best signal at the LOWEST dose (diranersen/CELIA; see
          evidence/claims.yaml `diranersen`), and N-terminal/aggregated-tau antibodies engaged tau with
          no cognitive benefit (gosuranemab, semorinemab/LAURIET, tilavonemab, zagotenemab). This is
          amyloid's hollow surrogacy (Ackley 2021, 10.1136/bmj.n156) recurring one marker inward. The
          winners that DID lower p-tau217 (lecanemab 10.1056/NEJMoa2212948, donanemab
          10.1001/jama.2023.13239) are anti-amyloid, confounding tau-lowering with upstream amyloid
          removal, and none shows the p-tau217 change SIZE predicts the cognition change size. Survivable
          kernel spun out as biomarker-futility-gate-platform (use the marker as an enrichment and
          go/no-go DROP rule, never to graduate an arm). The decisive prospective test (does maximal tau
          lowering help) is DIAN-TU Tau NexGen, NCT05269394, not yet read out."

  - id: reversible-ceiling-staging
    title: "Estimate each patient's reversible-vs-banked deficit and set trial endpoints to the reachable ceiling"
    created: 2026-11-01
    lens: cross-domain
    goal: reverse
    status: new
    mechanism: >-
      Hepatology, cardiology and MS reverse because the damaged tissue is in a remodellable
      compartment; symptomatic Alzheimer's also carries an irreversible compartment (lost neurons)
      with no regrowth analog. Split a patient's deficit into a reversible part (synapse, inflammation,
      perfusion, myelin) and a banked irreversible part (neuron loss), estimate the personal reversible
      ceiling, and set trial endpoints to that ceiling instead of expecting full reversal.
    novelty: >-
      The reversible/irreversible compartment split is conceptually known; computing a per-person
      reversible ceiling as an explicit trial-design and endpoint-setting tool, and powering reversal
      trials against it, is the contribution. Tonight's model (scripts/reversible_ceiling_2026_11_01.py)
      makes the ceiling concrete: achievable recovery falls the later treatment starts.
    against: >-
      No validated in-vivo way to measure the reversible fraction exists - synaptic density (SV2A-PET)
      has never been shown to rise with therapy (prior night), and separating reversible load from
      banked neuron loss may be unidentifiable from available markers. If you cannot measure the
      ceiling, you cannot set endpoints to it.
    falsify: >-
      Can the reversible fraction (e.g. synaptic/inflammatory markers) and the banked fraction (NfL,
      atrophy, neuron-loss proxies) be estimated from available biomarkers, and does the estimated
      ceiling predict the improvement actually achieved in a trial? If the split does not predict
      achievable recovery, it is not a usable design tool.
    evidence: in-silico
    safety: "None; a trial-design and endpoint-setting proposal. Must not promise patients reversal beyond the measured ceiling."
    next: "List candidate reversible-compartment markers (synaptic, perfusion, inflammation) and banked-damage markers (NfL, atrophy); check whether their ratio predicts response in any trial."
    sources:
      - "10.1523/jneurosci.16-14-04491.1996"
      - "10.1002/alz.12097"
    history:
      - date: 2026-11-01
        note: "Created on cross-domain night from the reversible-ceiling model and the cross-domain lesson that every reversal analogy fails on AD's irreversible neuron loss."

  - id: fn1-staged-reversal-test
    title: "Run the missing staged experiment: does lowering fibronectin AFTER established pathology reverse it?"
    created: 2026-11-01
    lens: cross-domain
    goal: reverse
    status: new
    mechanism: >-
      The FN1-at-the-barrier work showed that preventing fibronectin rise protects the blood-brain
      barrier, but never tested lowering fibronectin once deposition is established. Borrowing the
      hepatology question (does the ECM regress when you remove the driver?), the decisive experiment
      is to lower fibronectin - genetically or with an assembly inhibitor (pUR4/FUD) - in aged
      APOE4-knock-in mice that ALREADY have established deposition, and ask whether the barrier leak
      and deposition reverse.
    novelty: >-
      This is exactly the experiment the 2026 paper did not do (its aged, chronically-affected mice
      got no FN1 intervention); it converts an open factual gap into a single decisive test, and
      imports the fibrosis-reversal framing from hepatology.
    against: >-
      Established extracellular-matrix may not remodel in the brain the way liver fibrosis does (the
      cross-domain caution: AD's defining lesion does not regrow); fibronectin is systemically
      essential, so lowering it risks bleeding/fibrosis; and pUR4/FUD CNS delivery is unproven.
    falsify: >-
      The experiment is its own test: lower fibronectin after established deposition in aged APOE4
      mice. No reversal of barrier leak/deposition means FN1 is a prevention-only lead, closing the
      reversal version of fn1-clearance-restore.
    evidence: preclinical
    safety: >-
      Preclinical; any eventual translation carries fibronectin's systemic essentiality (clotting,
      wound healing). Not medical advice.
    next: "Specify the staged protocol (establish deposition in aged APOE4-KI, then FN1-lower with pUR4/FUD or inducible knockdown, read barrier leak + deposition); check if any group has data."
    sources:
      - "10.1038/s43587-026-01204-0"
      - "10.1007/s00401-024-02721-1"
    history:
      - date: 2026-11-01
        note: "Created on cross-domain night, spun out of the fn1-clearance-restore revisit once the 2026 paper was found to test prevention only; the staged establish-then-treat test is the decisive missing experiment."

  - id: target-the-leverage-node-not-the-root
    title: "Search approved drugs by the modifiable-genetics node (microglia/immune), not the causal root (amyloid)"
    created: 2026-11-02
    lens: causal-chain
    goal: slow
    status: new
    mechanism: >-
      Common-variant genetics puts the dominant MODIFIABLE Alzheimer's signal in microglial/immune
      genes (TREM2, PLCG2, INPP5D, MS4A, ABI3, SPI1, BIN1); amyloid overproduction is the causal root
      only in autosomal-dominant disease, and APOE is the single largest effect. So the causal root
      (amyloid) is not the highest-yield drug target, which is why anti-amyloid gives real-but-capped
      benefit. The idea is to prioritise the search for approved/repurposable drugs by the modifiable
      genetic node - microglial state and lipid/APOE biology - rather than by amyloid clearance.
    novelty: >-
      The microglial-genetics story is well known; the contribution is making it the explicit SEARCH
      STRATEGY for approved-drug repurposing (screen drug targets that are microglial/immune-expressed
      and genetics-supported), rather than defaulting to the amyloid axis.
    against: >-
      The strongest microglial target (TREM2 agonism) has no approved drug and AL002 failed Phase 2;
      "microglial state" is a continuum, hard to drug cleanly, and training can worsen pathology
      (Wendeln 2018); tonight's cascade model also showed which node you hit matters far less than how
      early you start.
    falsify: >-
      Screen approved-drug targets by microglial/immune expression plus drug-target MR support; if the
      resulting candidates do not out-rank amyloid-axis candidates on causal genetic evidence, the
      node-prioritisation adds nothing over the status quo.
    evidence: observational
    safety: "None for the search strategy; any resulting drug carries its own risks (immune modulation is double-edged)."
    next: "Rank microglial/immune and lipid drug targets by drug-target MR + colocalization on open data (see drug-target-MR-pipeline)."
    sources:
      - "10.1038/s41588-022-01024-z"
      - "10.1038/nature25158"
    history:
      - date: 2026-11-02
        note: "Created on causal-chain night; genetics (Bellenguez 2022) plus tonight's cascade model both say the causal root is not the highest-yield target - the modifiable signal is microglial/immune."

  - id: ace-inhibitor-ad-pharmacovigilance
    title: "Test whether ACE-inhibitor use raises Alzheimer's risk (drug-target MR says lower ACE = higher risk)"
    created: 2026-11-02
    lens: causal-chain
    goal: understand
    status: new
    mechanism: >-
      Drug-target Mendelian randomization with colocalization reports that genetically LOWER ACE (what
      ACE inhibitors pharmacologically mimic) is associated with HIGHER Alzheimer's risk, independent
      of blood pressure, in both blood and brain. If that causal direction is real, the very common
      ACE-inhibitor class could be a modifiable risk factor, and the actionable move is a
      pharmacovigilance test, not a therapy.
    novelty: >-
      A harm signal, not a benefit one - the opposite of most repurposing hunts. The MR/coloc direction
      is published; turning it into an active-comparator pharmacovigilance test (ACE inhibitors vs
      angiotensin-receptor blockers) on claims data is the contribution.
    against: >-
      MR direction can be confounded by pleiotropy; brain and blood ACE differ, and ACE has many
      substrates (including amyloid-degrading activity) so the mechanism is not clean; observational
      ACEi-vs-dementia data are mixed, and an active-comparator analysis may show no excess.
    falsify: >-
      Active-comparator new-user claims analysis, ACE inhibitors vs angiotensin-receptor blockers,
      with negative-control outcomes, for incident Alzheimer's. No excess risk with ACEi vs ARB means
      the MR direction does not translate to the drug.
    evidence: observational
    safety: >-
      This is a safety/harm hypothesis about a widely used drug class; it must NOT be read as advice
      to start or stop any medication - only as a signal to test. Not medical advice.
    next: "Confirm the MR/coloc direction against its source, then specify the ACEi-vs-ARB active-comparator emulation; check whether published claims analyses already did this."
    sources:
      - "10.1186/s13195-025-01671-4"
      - "10.1038/s41588-022-01024-z"
    history:
      - date: 2026-11-02
        note: "Created on causal-chain night from the repurposing scan's cleanest coloc-backed drug-target MR - whose direction argues AGAINST ACE inhibition, i.e. a potential harm signal worth a pharmacovigilance test."

  - id: drug-target-mr-pipeline
    title: "Stand up an open-data drug-target MR + colocalization pipeline to screen approved drugs for AD"
    created: 2026-11-02
    lens: causal-chain
    goal: understand
    status: new
    mechanism: >-
      The one causal route this project can actually run without any restricted data is drug-target
      cis-Mendelian-randomization plus colocalization: combine an open AD GWAS with open protein/
      expression QTLs to ask, target by target, whether genetically mimicking a drug's effect raises or
      lowers Alzheimer's risk. Built as a repeatable pipeline, it screens approved-drug targets and
      flags both benefit and harm directions (as the ACE example shows).
    novelty: >-
      Drug-target MR is an established method; the contribution is making it a standing, reproducible
      capability of this open repo (the first thing here that outputs a causal estimate rather than a
      hypothesis), with APOE handling and proxy-AD controls baked in.
    against: >-
      A genetic proxy for lifelong lower protein is NOT the same as a drug given late in life
      (magnitude, timing, tissue); plasma and CSF pQTL overlap is low; the APOE region breaks MR and
      must be excluded; proxy-AD GWAS dilute effects. So the pipeline bounds plausibility, it does not
      prove a drug works.
    falsify: >-
      Validate against known controls before trusting it: does it reproduce the expected null for
      statins/HMGCR, the adverse/benefit directions already reported (e.g. ACE), and stable estimates
      with vs without the APOE region? If it cannot recover controls, it is not trustworthy.
    evidence: observational
    safety: "None; a computational capability on summary data. Respects the repo's no-participant-data rule."
    next: "Assemble the open inputs (Kunkle non-proxy + Bellenguez AD GWAS; UKB-PPP + deCODE pQTL; GTEx/eQTLGen/MetaBrain) and TwoSampleMR + coloc; run known-control validation first. Needs owner go-ahead."
    sources:
      - "10.7554/eLife.34408"
      - "10.1038/s41586-023-06592-6"
      - "10.1038/s41588-022-01024-z"
    history:
      - date: 2026-11-02
        note: "Created on causal-chain night; operationalises the open-data causal-inference capability flagged to the owner - the project's first route to an actual causal estimate, using only summary-level data."
  - id: menopause-timed-plasticity-window
    title: "Time regenerative interventions to menopausal stage, not chronological age"
    created: 2026-11-04
    lens: reversal-biology
    goal: understand
    status: new
    mechanism: >-
      Women accumulate tau faster than men at matched amyloid and carry ~2/3 of AD, and the menopausal
      transition - not chronological age - marks a measurable drop in brain glucose metabolism,
      mitochondrial ATP markers and grey-matter volume, with a partial post-menopausal rebound that
      tracks preserved cognition (Mosconi 2021, Sci Rep, 10.1038/s41598-021-90084-y). Rodent
      hippocampal plasticity and new-cell survival are estrogen-gated. Hypothesis: there is a
      menopause-anchored window in which the brain's regenerative/plasticity machinery is transiently
      reopened, and aligning a pro-regenerative intervention to menopausal STAGE would beat
      age-matched dosing - a reason women-specific timing, not just women-specific risk, matters.
    novelty: >-
      Reframes the well-known menopause-AD link as a TIMING lever for reversal/repair rather than a
      risk factor, and makes a falsifiable stage-vs-age prediction. Distinct from estrogen-replacement
      trials (which tested hormone level, not the plasticity-window hypothesis and largely failed on
      timing, e.g. WHIMS late initiation).
    against: >-
      The rebound is observational imaging, not a demonstrated plasticity window; no intervention has
      ever raised a human regenerative readout; estrogen-timing trials (WHIMS) were negative when
      started late, which could mean the window is narrow or illusory; healthy-user and
      reverse-causation confounds are heavy in menopause cohorts.
    falsify: >-
      If a plasticity/synaptic biomarker (SV2A PET, or a validated CSF plasticity marker) shows NO
      menopausal-stage dependence after adjusting for chronological age, the window is illusory and the
      idea dies. Equally, if a stage-matched vs age-matched intervention arm shows no difference.
    evidence: observational
    safety: >-
      The timing hypothesis is testable with imaging/biomarkers before any intervention; any estrogen
      or regenerative intervention carries real risk and must be gated by trial safety. Not medical
      advice.
    next: "Check whether existing menopause-imaging cohorts (open summary level) report stage-resolved plasticity markers; specify a stage-vs-age analysis."
    sources:
      - "10.1038/s41598-021-90084-y"
      - "10.1001/jamaneurol.2017.2188"
    history:
      - date: 2026-11-04
        note: "Created on the reversal-biology / women night; turns the menopause-AD link into a timing-of-repair hypothesis with a stage-vs-age falsification test."
  - id: x-escape-oligodendrocyte-reversal-triage
    title: "Triage open AD omics for X-escape / oligodendrocyte-reactivation genes as a female-specific repair lever"
    created: 2026-11-04
    lens: reversal-biology
    goal: reverse
    status: new
    mechanism: >-
      In aged female mice the normally silent second X chromosome partially reactivates in the
      hippocampus, and a reactivated X-escapee (Plp1) expressed in oligodendrocytes improved cognition
      (Gadek et al. 2025, Sci Adv - mouse); reactivating silenced maternal-X genes reversed some
      deficits (Abdulai-Saiku et al. 2025, Nature, 10.1038/s41586-024-08457-y - mouse); a second X and
      the escapee Kdm6a confer resilience in hAPP mice with a human expression association
      (Davis/Dubal 2020, Sci Transl Med - mouse + human association). Hypothesis: the female brain
      holds a latent, age-triggered regenerative reserve on the inactive X, myelin-linked, with no male
      equivalent - and the tractable first step is a purely computational triage of OPEN AD omics for
      X-escape and oligodendrocyte-reactivation genes whose female-specific expression tracks
      resilience (non-decliners) vs decliners.
    novelty: >-
      The X-escape / second-X-reserve story is new (2020-2025) and almost entirely mouse; no AI agent
      or open project has nominated a sex-specific X-escape / oligodendrocyte AD target (the 2026-11-02
      breadcrumb scan found agents converge on microglial+lipid targets only). The contribution is to
      make it an open-data, in-silico screen this repo can run.
    against: >-
      Everything load-bearing is mouse; human X-reactivation in aged brain is unproven; expression
      associations are not causal; oligodendrocyte/myelin benefits in AD may cap at imaging markers
      (prior nights: structural-marker benefit often fails to reach clinical endpoints). PLP1 is also
      an autoimmune/overexpression-toxicity antigen, so "more PLP1" is not obviously safe.
    falsify: >-
      If female resilient (non-decliner) AD brains show NO enrichment of X-escape / PLP1-axis
      oligodendrocyte expression versus matched female decliners in open datasets, drop it. If the
      signal is present in males equally, the female-specific framing is wrong.
    evidence: in-silico
    safety: >-
      The triage is computational on open summary/omic data (no participant-level data; respects the
      repo rule). Any downstream reactivation intervention is high-risk (tumorigenicity, autoimmunity)
      and far off. Not medical advice.
    next: "Scope an X-escape + oligodendrocyte-reactivation gene list against AMP-AD Agora target nominations and sex-stratified expression; define the resilient-vs-decliner contrast."
    sources:
      - "10.1038/s41586-024-08457-y"
    history:
      - date: 2026-11-04
        note: "Created on the reversal-biology / women night; the night's most surprising finding (aging reactivates the silent second X; a myelin escapee improves cognition in mice) turned into an open-data in-silico screen. Mouse-grounded; human causal data absent."
  - id: silent-engram-recoverable-window
    title: "Stage AD by silenced-but-alive vs dead engrams to define the only window reversal theory allows"
    created: 2026-11-04
    lens: reversal-biology
    goal: reverse
    status: new
    mechanism: >-
      The engram literature says memories held in neurons that are ALIVE but synaptically SILENCED can
      be recovered (optogenetic engram reactivation restores 'lost' memories and spine density in early
      AD mice; Roy/Tonegawa 2016, Nature, 10.1038/nature17172), whereas a memory whose neuron ensemble
      is DEAD is gone. So the only stage theory predicts is reversible is the pre-ensemble-loss window
      when engrams are silenced, not destroyed. Hypothesis: a human staging readout that separates
      silenced-but-recoverable from lost circuitry (e.g. SV2A-PET synaptic density paired with
      cued-retrieval paradigms) would define who is even eligible for a reversal attempt - and tonight's
      toy (scripts/silent_engram_window_2026_11_04.py) shows recoverable benefit is front-loaded and
      collapses as loss overtakes silencing.
    novelty: >-
      Imports the silent-vs-lost engram distinction as a clinical STAGING criterion for reversal
      eligibility - different from existing amyloid/tau staging, which indexes pathology not
      recoverability. Gives the field a concrete unmet endpoint (a human synaptic-density RISE, never
      yet achieved; no therapy has raised SV2A-PET signal in humans, Chen 2018, PMID 30014145).
    against: >-
      Human staging of silenced-vs-lost does not exist and may be impossible if SV2A loss and
      irreversible recall failure are already coincident at earliest detectable disease; the whole
      silent-engram construct is mouse/optogenetic and may not transfer; 'reactivation' has never been
      delivered as a human therapy.
    falsify: >-
      If, at the earliest clinically detectable AD, synaptic loss and irreversible recall failure are
      already coincident (no cue recovers performance), then the recoverable window does not exist in
      humans and the staging idea is moot.
    evidence: none
    safety: "A staging/biomarker concept; no intervention. Not medical advice."
    next: "Specify a silenced-vs-lost staging readout (SV2A-PET + cued retrieval) and check whether any open imaging cohort could test whether the two collapse together at onset."
    sources:
      - "10.1038/nature17172"
    history:
      - date: 2026-11-04
        note: "Created on the reversal-biology / women night and modelled tonight (silent_engram_window toy): recoverable gain is front-loaded and capped by the surviving-neuron ceiling - the 'treat early' wall derived from alive-vs-dead rather than reversible-vs-banked damage."
  - id: resilience-is-growth-not-topology
    title: "Against an autocatalytic tau spreader, resilience lives in the growth term, not in network firebreaks"
    created: 2026-11-05
    lens: resilience
    goal: understand
    status: investigating
    mechanism: >-
      Borrowed from outside medicine (wildfire firebreaks, power-grid islanding, percolation theory):
      the hypothesis was that a resilient brain arrests a prion-like tau front at network bottlenecks
      (bridge edges), so WHERE pathology can travel, not just how much, sets resilience. Tonight's toy
      (scripts/firebreak_percolation_2026_11_05.py) tests it on the repo's FKPP reaction-diffusion vs
      linear NDM spreading models and reframes it: a containment/"resilience" threshold exists ONLY
      because tau growth is autocatalytic (FKPP has an invasion threshold in the growth rate; linear
      diffusion floods every connected node and has none), so the real resilience lever is the GROWTH
      term (the GSK3-beta / lithium-buffer and disease-tolerance axes), not edge topology.
    novelty: >-
      Imports a percolation/firebreak frame and then KILLS its naive form with a model, converting a
      borrowed analogy into a sharp claim: topology-based resilience (islanding, firebreaks,
      sub-threshold hub-loading) is mechanistically empty against a supercritical self-amplifying
      spreader. Distinct from the repo's reserve-as-redundancy idea (spare capacity) - this is about
      where the controllable lever is (growth vs wiring), and it ties resilience to the open
      autocatalysis question.
    against: >-
      In the toy, down-weighting even the top bottleneck (effective-resistance) edges did NOT contain
      an above-threshold front; only a full cut did, and that merely disconnects the epicenter node
      (and contains linear diffusion equally) - trivial disconnection a brain cannot do. So the
      firebreak mechanism fails here. Caveat: this is one synthetic connectome with assumed rates; a
      real small-world brain network with different hub structure, or a near-critical growth regime,
      could behave differently, and the whole claim is conditional on tau being autocatalytic in
      humans (unresolved; see identify-autocatalysis-rate).
    falsify: >-
      On real tau-PET + connectome data: if targeted weakening of bottleneck/hub edges predicts slower
      tau-front advance beyond total connectivity and baseline tau (i.e. topology DOES buy resilience),
      the growth-not-topology claim is wrong. Conversely, if human tau growth is shown to be
      non-autocatalytic (alpha ~ 0), the percolation/firebreak family is void regardless.
    evidence: in-silico
    safety: "A modeling/conceptual result on synthetic networks; no intervention. Not medical advice."
    next: "Rerun the toy on an open group connectome (e.g. an HCP-derived matrix) and at a near-critical growth rate to see whether partial bottleneck weakening ever contains without full disconnection; link to identify-autocatalysis-rate."
    sources:
      - "10.1016/j.neuron.2011.12.040"
      - "10.1038/s41467-020-15701-2"
      - "10.1103/PhysRevLett.86.3200"
    history:
      - date: 2026-11-05
        note: "Created and tested the same night on the resilience lens (outside-medicine constraint). The firebreak/islanding/percolation analogy's topological form was killed by the toy; the surviving claim - resilience against an autocatalytic spreader is a growth-term property - is kept as investigating and ties to the lithium/GSK3-beta buffer and the disease-tolerance idea."
  - id: disease-tolerance-slope-endpoint
    title: "Measure cognitive resilience as disease tolerance - the per-person slope of cognition vs tau, not low tau"
    created: 2026-11-05
    lens: resilience
    goal: understand
    status: new
    mechanism: >-
      Borrowed from the ecology/immunology of host defence (Medzhitov, Schneider & Soares 2012,
      10.1126/science.1214935): hosts survive a pathogen by RESISTANCE (lower burden) or TOLERANCE
      (less damage per unit burden, read off the slope of the health-vs-burden reaction norm). Mapped
      to AD: resilience = tolerance = a flat cognition-vs-tau slope, distinct from resistance = low
      tau. The decisive quantity is the between-person random slope of cognition regressed on tau-PET;
      resilience variants that act downstream (APOE3-Christchurch, RELN-COLBOS) are tolerance
      mechanisms (they lower tau's cognitive cost), aligning the construct with real human biology.
    novelty: >-
      Reframes "cognitive reserve" (usually education/IQ proxies) as a measurable tolerance slope with
      a clean statistical test, and separates a tolerance therapeutic axis (preserve function per
      tangle) from the clearance axis (remove tangles) that dominates trials.
    against: >-
      Phenomenological - it names the slope without a spreading mechanism and gives no topology
      prediction; it may not cleanly separate "less damage per tangle" from "fewer functionally
      relevant tangles" (resistance in disguise); and a stable between-person slope must exceed
      measurement error to be real.
    falsify: >-
      Fit cognition ~ tau with a per-person random slope in a tau-PET + cognition cohort (ADNI-style
      summary stats suffice). If, after accounting for measurement error, there is no stable
      between-person slope component (all variance is in the intercept = baseline ability), there is
      nothing to "tolerate" and the frame is wrong.
    evidence: observational
    safety: "A measurement/endpoint concept; no intervention. Not medical advice."
    next: "Specify the random-slope model and a noise floor; check whether an open tau-PET + cognition summary dataset can estimate a between-person slope component."
    sources:
      - "10.1126/science.1214935"
      - "10.1038/s41591-019-0611-3"
      - "10.1038/s41591-023-02318-3"
    history:
      - date: 2026-11-05
        note: "Created on the resilience / outside-medicine night; the disease-tolerance frame gives the single sharpest already-measurable resilience readout and complements resilience-is-growth-not-topology (resilience off the spread axis, onto the tolerance axis)."
  - id: response-diversity-not-redundancy
    title: "Resilience is decorrelated circuit vulnerability (response diversity), not spare capacity (redundancy)"
    created: 2026-11-05
    lens: resilience
    goal: understand
    status: new
    mechanism: >-
      Borrowed from ecology's insurance hypothesis (Yachi & Loreau 1999, 10.1073/pnas.96.4.1463;
      response diversity, Elmqvist 2003, 10.1890/1540-9295(2003)001[0488:RDECAR]2.0.CO;2): functional
      redundancy buffers a system only if the redundant components have RESPONSE DIVERSITY - they fail
      under different stresses, so they do not collapse together. Mapped to AD: resilience is not spare
      circuit capacity (the repo's reserve-as-redundancy-threshold) but redundancy x (1 - cross-circuit
      tau-susceptibility correlation). A brain with many parallel circuits that are all equally
      tau-vulnerable (correlated failure) is NOT resilient; one whose parallel circuits have
      decorrelated vulnerability is.
    novelty: >-
      Explicitly distinct from the repo's redundancy (Fiedler/algebraic-connectivity) metric - it is
      about the correlation structure of vulnerability across redundant paths, a claim the redundancy
      metric cannot make. Closest formalism is Edelman & Gally degeneracy (10.1073/pnas.131216798).
    against: >-
      AD presents essentially one chronic stressor (tau), so "diversity of responses to different
      stresses" barely applies; per-circuit response curves are unmeasured (we have at best
      cross-sectional vulnerability rankings), so the construct may be untestable with current data and
      could collapse back into plain redundancy.
    falsify: >-
      Build a response-diversity index (variance in regional/cell-type tau-vulnerability across the
      circuits serving one cognitive function, from open Allen/Agora cell-type maps x a connectome) and
      test whether it predicts cognition-at-matched-tau BEYOND the Fiedler redundancy metric and
      education. If it adds nothing, the construct is redundant with redundancy and dies.
    evidence: observational
    safety: "A modeling/metric concept on open summary and atlas data; no participant-level data; no intervention. Not medical advice."
    next: "Prototype the decorrelated-vs-correlated vulnerability contrast in-silico on the synthetic connectome, then scope the Allen/Agora cell-type vulnerability maps needed for a real index."
    sources:
      - "10.1073/pnas.96.4.1463"
      - "10.1890/1540-9295(2003)001[0488:RDECAR]2.0.CO;2"
      - "10.1073/pnas.131216798"
    history:
      - date: 2026-11-05
        note: "Created on the resilience / outside-medicine night; deliberately carved apart from reserve-as-redundancy-threshold (spare capacity) - this is decorrelated vulnerability, the insurance-hypothesis reading."
  - id: biomarker-futility-gate-platform
    title: "Use p-tau217/tau as an adaptive drop-rule and enrichment gate, never to graduate an arm"
    created: 2026-11-06
    lens: red-team
    goal: understand
    status: new
    mechanism: >-
      The survivable kernel of the parked treat-to-target idea. Keep the HIV/oncology
      measure-combine-adapt borrowing but change what the tau marker does: use plasma p-tau217 (or
      CSF MTBR-tau243) for trial ENRICHMENT and as a go/no-go FUTILITY GATE - an arm that fails to
      move the marker is dropped early - while REQUIRING a cognitive/functional endpoint to graduate.
      This exploits the marker's real strength (target engagement, prognosis) without betting that
      lowering it causes benefit, which tonight's red-team found unsupported.
    novelty: >-
      Reframes a proximal biomarker from surrogate-endpoint (discredited by amyloid's hollow surrogacy
      and diranersen's inverse dose-response) to a pure adaptive-design control variable; the testable
      twist is a retrospective validation of the drop-rule against known winners and losers.
    against: >-
      A futility gate that drops arms failing to move tau would have been correct only if tau movement
      is necessary for benefit - but if a beneficial mechanism acts without moving tau, the gate
      wrongly kills it; and enrichment on p-tau217 narrows generalisability. The gate is a bet that
      target engagement is necessary, which is weaker than surrogacy but still a bet.
    falsify: >-
      Retrospective in-silico test on the Alzforum Therapeutics tau-drug table: would a "drop if the
      arm does not lower tau" rule have dropped the known cognitive failures (gosuranemab, semorinemab,
      tilavonemab) while KEEPING the winners (lecanemab, donanemab)? If it mis-sorts the known
      winners/losers, the gate is worthless.
    evidence: in-silico
    safety: "A trial-design/analysis concept; no intervention. Not medical advice."
    next: "Tabulate tau-lowering vs cognitive outcome for each approved/failed tau or anti-amyloid arm (Alzforum Therapeutics, open) and test whether a tau drop-rule separates winners from losers."
    sources:
      - "10.1136/bmj.n156"
      - "10.1056/NEJMoa2212948"
      - "10.1001/jama.2023.13239"
    history:
      - date: 2026-11-06
        note: "Spun out of the parked treat-to-target-proximal-biomarker on the red-team night; the biomarker as a drop-rule/enrichment gate, not a graduation surrogate."
  - id: practice-curve-deviation-endpoint
    title: "Score cognitive improvement as normalization of the practice-learning curve, not raw change"
    created: 2026-11-06
    lens: red-team
    goal: detect
    status: new
    mechanism: >-
      At-home-only. The retest (practice) effect both mimics improvement (~0.2 SD, the size of a
      plausible treatment gain) and is itself an AD signal - its ATTENUATION tracks amyloid and
      entorhinal tau (Tort-Merino 2025, 10.1002/alz.087332). So instead of raw endpoint-minus-baseline
      (which a practice effect fakes), score each person against their own EXPECTED practice-learning
      trajectory: a treatment that restores the normal practice gain is the readout. Tonight's toy
      (scripts/improvement_detectability_2026_11_06.py) shows naive change reads a false ~+0.25 SD
      "improvement" under a true null while the practice-curve-deviation estimator recovers ~0.
    novelty: >-
      Turns the central confounder of improvement measurement into the measurement itself; distinct
      from existing decline-validated endpoints and from raw within-person change.
    against: >-
      Needs dense pre-onset repeated measures to estimate each person's practice curve (feasible only
      with at-home high-frequency sampling) and assumes the curve's shape is modelled correctly -
      mis-specifying it reintroduces the bias; and if genuine within-person gains essentially never
      occur in AD there is nothing to detect.
    falsify: >-
      If restoring a reversible deficit (recovery sleep after deprivation; treated depression) does not
      move the practice-curve-deviation metric beyond its retest CI, the reframing fails and raw change
      is no worse.
    evidence: observational
    safety: "A measurement concept on at-home digital data; no intervention; no participant-level data. Not medical advice."
    next: "Prototype the estimator against an open high-frequency at-home dataset (M2C2/Mobile Toolbox is open-source) using a reversible-cause positive control."
    sources:
      - "10.1002/alz.087332"
      - "10.1002/dad2.12283"
      - "10.1016/j.trci.2017.08.010"
    history:
      - date: 2026-11-06
        note: "Created on the red-team / at-home night from the finding that the practice effect is both the threat and an AD signal; modelled tonight."
  - id: ptau217-athome-slope-coupling
    title: "Test whether within-person change in plasma p-tau217 tracks change in an at-home cognition slope"
    created: 2026-11-06
    lens: red-team
    goal: detect
    status: new
    mechanism: >-
      At-home-feasible necessary-condition test for the parked treat-to-target claim. Using serial
      finger-prick/venous plasma p-tau217 (not PET or CSF) plus a passive at-home cognitive slope
      (remote smartphone memory and passive connected-speech proper-name recall), test WITHIN
      individuals whether a change in p-tau217 tracks a change in the at-home slope. If the marker and
      the at-home readout do not move together within a person, the marker cannot be a steerable target.
    novelty: >-
      Most p-tau217 work is cross-sectional or clinic-based; this is a within-person, at-home coupling
      test, and it is the cheapest partial kill of the treat-to-target idea.
    against: >-
      It tests only the NECESSARY condition (marker tracks cognition), not the sufficient causal step
      (lowering it CAUSES improvement), which needs an interventional arm; passive at-home slopes are
      noisy (see the detectability toy); and a coupling could be driven by shared upstream decline
      rather than a steerable link.
    falsify: >-
      If within-person delta-p-tau217 does not predict delta(at-home slope) - especially if banked
      remote-assessment arms of tau/anti-amyloid trials show the marker and the slope decoupled by dose
      - the marker-as-steerable-target claim is dead cheaply.
    evidence: observational
    safety: "Observational; a finger-prick blood test and passive at-home measures; not medical advice; nothing self-dosed."
    next: "Find an open cohort or banked trial arm with serial plasma p-tau217 plus any repeated at-home cognitive/speech measure and specify the within-person coupling analysis."
    sources:
      - "10.1136/bmj.n156"
      - "10.1002/dad2.12283"
    history:
      - date: 2026-11-06
        note: "Created on the red-team night as the cheapest at-home partial kill of treat-to-target-proximal-biomarker (necessary-condition, within-person, no scanner)."
