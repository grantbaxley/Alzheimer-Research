[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alzres"
version = "0.1.0"
description = "Verification-first open toolkit for Alzheimer's disease modeling: synthetic ground-truth cohorts, null-tested spreading models, leakage-proof evaluation, and a vetted resource registry."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# pySuStaIn is pinned to the commit we checked (MIT, ucl-pond/pySuStaIn, 2026-03-30).
progression = ["pySuStaIn @ git+https://github.com/ucl-pond/pySuStaIn@708fa22d89c9692dbeafcc2c31a1c8460ced5640"]

[project.scripts]
alzres-registry = "alzres.registry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: slower reproduction checks; some need optional upstream packages (pip install -e .[progression])"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py310"
# The contributed model keeps its own style so its code stays recognisably the same as the
# version that produced its committed outputs; it is checked by tests/test_open_ad_sim.py.
extend-exclude = ["models/open-ad-sim"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
